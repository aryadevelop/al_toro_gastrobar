# ============================================================
# BASE — compartido por todos los entornos
# Dev:  docker compose up --build  (carga override.yml automaticamente)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up --build -d
# Ejecutar siempre desde la RAIZ del proyecto.
# El frontend NO esta dockerizado; correr por separado con: cd frontend && npm start
# ============================================================
services:

  postgres:
    image: postgres:15-alpine
    container_name: altoro_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altoro_db}
      POSTGRES_USER: ${POSTGRES_USER:-altoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altoro1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - altoro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: altoro_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - altoro_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altoro_api
    environment:
      # Postgres — usa el nombre del servicio como host
      DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-altoro_db}
      DB_USERNAME: ${POSTGRES_USER:-altoro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-altoro1234}
      # RabbitMQ — usa el nombre del servicio como host
      RABBITMQ_HOST:     rabbitmq
      RABBITMQ_PORT:     5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - altoro_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  altoro_network:
    driver: bridge
