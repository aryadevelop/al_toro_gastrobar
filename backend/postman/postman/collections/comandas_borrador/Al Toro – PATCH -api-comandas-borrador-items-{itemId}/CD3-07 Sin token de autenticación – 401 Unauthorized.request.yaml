$kind: http-request
name: CD3-07 Sin token de autenticación – 401 Unauthorized
description: |-
  **Objetivo:** Verificar que la API rechaza la solicitud sin header Authorization.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/comandas/borrador/items/{{itemPicanhaBaseId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cantidad": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1060
