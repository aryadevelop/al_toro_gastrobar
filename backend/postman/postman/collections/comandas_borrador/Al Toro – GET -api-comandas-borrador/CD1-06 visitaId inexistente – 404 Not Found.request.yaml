$kind: http-request
name: CD1-06 visitaId inexistente – 404 Not Found
description: |-
  **Objetivo:** Verificar que `validarOwnership` lanza ENT-001 cuando la visita no existe.
  **Pre-condición:** `meseroToken` disponible. visitaId 999999 no existe en BD.
  **Resultado esperado:** 404 Not Found con `code = ENT-001`.
url: "{{baseUrl}}/api/comandas/borrador?visitaId=999999"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('CD1-06: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 404', function () {
        pm.response.to.have.status(404);
      });

      pm.test('Código de error es ENT-001', function () {
        const body = pm.response.json();
        pm.expect(body.code).to.equal('ENT-001');
      });
    language: text/javascript
order: 1050
