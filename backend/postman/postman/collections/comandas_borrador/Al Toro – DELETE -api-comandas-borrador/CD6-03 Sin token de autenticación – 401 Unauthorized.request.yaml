$kind: http-request
name: CD6-03 Sin token de autenticación – 401 Unauthorized
description: |-
  **Objetivo:** Verificar que la API rechaza la solicitud sin header Authorization.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/comandas/borrador?visitaId=14"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1020
