$kind: http-request
name: VE-06 Descuento mayor al total – 409 Conflict
description: Descuento desproporcionado sobre la visita abierta 17 → 409 NEG-001 (CA-11). No cierra la visita.
url: "{{baseUrl}}/api/ventas"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    { "emailCajero": "cajero1@altoro.com", "visitaId": 17, "descuento": 99999999, "metodo": "EFECTIVO" }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Descuento > total → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-001', function () {
        pm.expect(pm.response.json().code).to.equal('NEG-001');
      });
    language: text/javascript
order: 6000
