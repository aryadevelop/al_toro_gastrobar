$kind: http-request
name: VE-08 Cuenta ya cerrada – 409 Conflict
description: La visita 1 ya tiene venta. Reintentar el cierre → 409 NEG-002 (idempotencia).
url: "{{baseUrl}}/api/ventas"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    { "emailCajero": "cajero1@altoro.com", "visitaId": 1, "descuento": 0, "metodo": "EFECTIVO" }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Cuenta ya cerrada → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-002', function () {
        pm.expect(pm.response.json().code).to.equal('NEG-002');
      });
    language: text/javascript
order: 8000
