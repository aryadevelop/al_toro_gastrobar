$kind: http-request
name: PB-01 Sin token JWT – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** Control de acceso — no se permite consultar puntos sin autenticación.
  **Objetivo:** Verificar que el endpoint rechaza peticiones sin `Authorization` con 401.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/clientes/1/puntos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la petición sin token con 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
