$kind: http-request
description: |-
  **Criterio de Aceptación:** Validación de existencia del cliente
  **Objetivo:** Verificar que el sistema retorna 404 para un clienteId que no existe.
  **Pre-condición:** No existe cliente con ID 999999.
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/clientes/999999/puntos"
method: GET
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna 404 para clienteId inexistente', function() {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 3000
