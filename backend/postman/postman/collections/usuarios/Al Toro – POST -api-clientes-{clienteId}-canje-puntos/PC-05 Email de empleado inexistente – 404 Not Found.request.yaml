$kind: http-request
description: |-
  **Criterio de Aceptación:** Validación de existencia del empleado
  **Objetivo:** Verificar que el sistema retorna 404 cuando el emailEmpleado no corresponde a ningún Empleado registrado.
  **Pre-condición:** El email 'noexiste@altoro.com' no existe como Empleado; el cliente tiene puntos > 0 (usar `clienteIdConPuntos` con puntos disponibles o reiniciar con nuevo cliente).
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/clientes/{{clienteIdConPuntos}}/canje-puntos?emailEmpleado=noexiste@altoro.com"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
queryParams:
  emailEmpleado: noexiste@altoro.com
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna 404 para email de empleado inexistente', function() {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
