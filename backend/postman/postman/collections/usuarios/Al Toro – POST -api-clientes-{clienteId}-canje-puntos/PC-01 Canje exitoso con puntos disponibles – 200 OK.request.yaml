$kind: http-request
description: |-
  **Criterio de Aceptación:** Canje exitoso
  **Objetivo:** Verificar que el canje resetea `puntosActuales` a 0, retorna el saldo actualizado y registra auditoría.
  **Pre-condición:** `clienteIdConPuntos` tiene `puntosActuales > 0`; el cajero `emailCajero` existe como Empleado.
  **Resultado esperado:** 200 OK · `data.puntosActuales = 0` · `data.puntosAcumulados` presente.
url: "{{baseUrl}}/api/clientes/{{clienteIdConPuntos}}/canje-puntos?emailEmpleado={{emailCajero}}"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
queryParams:
  emailEmpleado: "{{emailCajero}}"
scripts:
  - type: beforeRequest
    code: |-
      // Capturar puntosAcumulados antes del canje para verificar que no cambia en PC-03
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/clientes/' + pm.environment.get('clienteIdConPuntos') + '/puntos',
        method: 'GET',
        header: [{ key: 'Authorization', value: 'Bearer ' + pm.environment.get('cajeroToken') }]
      }, function(err, res) {
        if (!err && res.code === 200) {
          pm.environment.set('acumuladosAntesDelCanje', res.json().data.puntosAcumulados);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function() {
        pm.response.to.have.status(200);
      });
      pm.test('Tras el canje puntosActuales es 0', function() {
        pm.expect(pm.response.json().data.puntosActuales).to.eql(0);
      });
      pm.test('La respuesta contiene puntosAcumulados', function() {
        pm.expect(pm.response.json().data).to.have.property('puntosAcumulados');
      });
    language: text/javascript
order: 1000
