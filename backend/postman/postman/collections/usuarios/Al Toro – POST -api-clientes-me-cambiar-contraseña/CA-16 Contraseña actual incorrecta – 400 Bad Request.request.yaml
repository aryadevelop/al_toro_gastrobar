$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-16
  **Objetivo:** Verificar que no se permite cambiar contraseña si la contraseña actual es incorrecta.
url: "{{baseUrl}}/api/clientes/me/cambiar-contraseña"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "contraseñaActual": "ContraseñaIncorrecta123!",
      "nuevaContraseña": "NewPass123!",
      "confirmacion": "NewPass123!"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Login como CLIENTE para obtener token
      const loginRequest = {
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: {
          'Content-Type': 'application/json'
        },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cliente@altoro.com',
            password: 'ClientePass123!'
          })
        }
      };

      pm.sendRequest(loginRequest, function (err, response) {
        if (!err && response.code === 200) {
          const token = response.json().accessToken;
          pm.request.headers.add({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Contraseña actual incorrecta', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Mensaje de error sobre contraseña actual', () => {
        pm.expect(body.message).to.include('actual');
      });
    language: text/javascript
order: 3002

