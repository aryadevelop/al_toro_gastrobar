$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-03 (sin puntos canjeables)
  **Objetivo:** Verificar que el sistema retorna 200 con puntosActuales = 0 para un cliente que no ha acumulado puntos o los canjeó todos.
  **Pre-condición:** El cliente `emailSuspendido` tiene `clientePuntos = 0` en la base de datos.
  **Resultado esperado:** 200 OK · `data.puntosActuales = 0` · `data.puntosAcumulados` ≥ 0.
url: "{{baseUrl}}/api/clientes/me/puntos?emailCliente={{emailSuspendido}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  emailCliente: "{{emailSuspendido}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function() {
        pm.response.to.have.status(200);
      });
      pm.test('El sistema retorna puntosActuales = 0 para cliente sin saldo canjeable', function() {
        pm.expect(pm.response.json().data.puntosActuales).to.eql(0);
      });
      pm.test('puntosAcumulados es no negativo incluso con puntosActuales = 0', function() {
        pm.expect(pm.response.json().data.puntosAcumulados).to.be.at.least(0);
      });
    language: text/javascript
order: 2000
