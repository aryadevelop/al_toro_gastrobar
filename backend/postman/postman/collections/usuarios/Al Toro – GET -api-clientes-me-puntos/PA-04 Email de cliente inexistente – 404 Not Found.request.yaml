$kind: http-request
description: |-
  **Criterio de Aceptación:** Validación de existencia del cliente
  **Objetivo:** Verificar que el sistema retorna 404 cuando el emailCliente no existe en la base de datos.
  **Pre-condición:** El email 'noexiste@altoro.com' no está registrado.
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/clientes/me/puntos?emailCliente=noexiste@altoro.com"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  emailCliente: noexiste@altoro.com
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna 404 para email de cliente inexistente', function() {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 4000
