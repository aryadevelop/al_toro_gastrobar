$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-01
  **Objetivo:** Verificar que acceder al perfil sin autenticación retorna 401.
url: "{{baseUrl}}/api/clientes/me"
method: GET
headers:
  Authorization: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – No autenticado', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
