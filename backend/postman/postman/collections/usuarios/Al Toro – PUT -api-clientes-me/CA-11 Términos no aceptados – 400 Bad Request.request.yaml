$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-11
  **Objetivo:** Verificar que no se permite actualizar si los términos no son aceptados (false).
url: "{{baseUrl}}/api/clientes/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Carlos",
      "email": "unique.{{$timestamp}}@example.com",
      "telefono": "3102555{{$randomInt}}",
      "direccion": "Carrera 10 # 25-30, Popayán",
      "aceptaTerminos": false
    }
scripts:
  - type: beforeRequest
    code: |-
      // Login como CLIENTE para obtener token
      const loginRequest = {
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: {
          'Content-Type': 'application/json'
        },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cliente@altoro.com',
            password: 'ClientePass123!'
          })
        }
      };

      pm.sendRequest(loginRequest, function (err, response) {
        if (!err && response.code === 200) {
          const token = response.json().accessToken;
          pm.request.headers.add({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Términos no aceptados', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2007

