$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-12
  **Objetivo:** Verificar que no se permite actualizar sin autenticación.
url: "{{baseUrl}}/api/clientes/me"
method: PUT
headers:
  Content-Type: application/json
  Authorization: ""
body:
  type: text
  content: |-
    {
      "nombre": "Juan Carlos",
      "email": "unique.{{$timestamp}}@example.com",
      "telefono": "3102666{{$randomInt}}",
      "direccion": "Carrera 10 # 25-30, Popayán",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – No autenticado', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2008
