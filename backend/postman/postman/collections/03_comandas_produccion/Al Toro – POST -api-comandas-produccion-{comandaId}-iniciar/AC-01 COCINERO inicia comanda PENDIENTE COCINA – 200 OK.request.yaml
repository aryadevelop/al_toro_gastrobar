$kind: http-request
name: AC-01 COCINERO inicia comanda PENDIENTE COCINA – 200 OK
description: |-
  **Objetivo:** El cocinero transiciona una comanda PENDIENTE de COCINA a EN_PREPARACION.
  **Pre-condición:** `cocineroToken` lo provee el `beforeRequest` de colección;
  comanda 26 (visita 10, COCINA) está en estado PENDIENTE.
  **Nota:** Esta acción es destructiva — requiere reseed (`docker compose down -v && up`) para repetir.
  **Resultado esperado:** 200 OK con `data.comandaEstado === 'EN_PREPARACION'` y `data.estacion === 'COCINA'`.
url: "{{baseUrl}}/api/comandas/produccion/26/iniciar"
method: POST
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Estado transicionado a EN_PREPARACION', function () {
        const data = pm.response.json().data;
        pm.expect(data.comandaEstado).to.equal('EN_PREPARACION');
      });
      pm.test('Estación es COCINA', function () {
        const data = pm.response.json().data;
        pm.expect(data.estacion).to.equal('COCINA');
      });
      pm.test('Estructura de resumen completa', function () {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('comandaId');
        pm.expect(data).to.have.property('mesaIdentificador');
        pm.expect(data).to.have.property('totalItems');
        pm.expect(data).to.have.property('createdAt');
      });
    language: text/javascript
order: 3010
