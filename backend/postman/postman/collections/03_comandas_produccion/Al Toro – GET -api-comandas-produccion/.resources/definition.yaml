$kind: collection
name: Al Toro – GET /api/comandas/produccion
description: |-
  # GET /api/comandas/produccion

  Devuelve el tablero de comandas pendientes, en preparación y listas para la(s) estación(es)
  del usuario autenticado. Cuando el usuario tiene los roles `COCINERO` y `BARTENDER`
  simultáneamente, el tablero combina las dos estaciones; en otro caso cubre solo la
  estación correspondiente al rol.

  **Control de acceso:**
  - COCINERO/BARTENDER (rol funcional `PRODUCCION`): acceso permitido.
  - MESERO/CAJERO/CLIENTE/ADMIN: 403 Forbidden.
  - Sin token: 401 Unauthorized.

  **Campos de TableroProduccionResponse:**
  - `estaciones`: lista de estaciones cubiertas (`["COCINA"]`, `["BARRA"]` o `["BARRA","COCINA"]`).
  - `pendientes[]`, `enPreparacion[]`, `listos[]`: cada elemento es un
    `ComandaProduccionResumenResponse` con `comandaId`, `estacion`, `comandaEstado`,
    `mesaIdentificador`, `meseroNombre`, `totalItems`, `createdAt`, `fechaHoraInicio`,
    `fechaHoraListo`, `notas`.

  | ID | Escenario | HTTP |
  |----|-----------|------|
  | AC-01 | COCINERO obtiene tablero | 200 |
  | AC-02 | BARTENDER obtiene tablero | 200 |
  | AC-03 | Sin token | 401 |
  | AC-04 | MESERO intenta acceder | 403 |
  | AC-05 | CAJERO intenta acceder | 403 |
  | AC-06 | CLIENTE intenta acceder | 403 |
  | AC-07 | ADMIN intenta acceder | 403 |

scripts:
  - type: http:beforeRequest
    code: |-
      const logins = [
        { emailKey: 'emailCocinero',  tokenKey: 'cocineroToken'  },
        { emailKey: 'emailBartender', tokenKey: 'bartenderToken' },
        { emailKey: 'emailMesero',    tokenKey: 'meseroToken'    },
        { emailKey: 'emailCajero',    tokenKey: 'cajeroToken'    },
        { emailKey: 'emailCliente',   tokenKey: 'clienteToken'   },
        { emailKey: 'emailAdmin',     tokenKey: 'adminToken'     }
      ];
      const runLogin = (index) => {
        if (index >= logins.length) return;
        const { emailKey, tokenKey } = logins[index];
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: pm.environment.get(emailKey),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })
          }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('produccion-tablero pre-request: login ' + emailKey + ' falló');
          } else {
            pm.environment.set(tokenKey, res.json().accessToken);
          }
          runLogin(index + 1);
        });
      };
      runLogin(0);
    language: text/javascript
order: 1000
