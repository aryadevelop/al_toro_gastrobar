$kind: http-request
name: AC-04 MESERO intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Un usuario con rol MESERO recibe 403 al intentar consultar el detalle.
  **Pre-condición:** `meseroToken` lo provee el `beforeRequest` de colección.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/comandas/produccion/1"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 2040
