$kind: http-request
name: AC-01 COCINERO consulta detalle – 200 OK
description: |-
  **Objetivo:** El cocinero obtiene el detalle de una comanda de COCINA en estado visible.
  **Pre-condición:** `cocineroToken` lo provee el `beforeRequest` de colección;
  `comandaIdCocinaVisible` apunta a una comanda en PENDIENTE/EN_PREPARACION/LISTO de la estación COCINA.
  **Resultado esperado:** 200 OK con `data.estacion='COCINA'` y listas `platos`, `bebidas`, `otros` presentes.
url: "{{baseUrl}}/api/comandas/produccion/{{comandaIdCocinaVisible}}"
method: GET
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |
      pm.environment.set('comandaIdCocinaVisible', '13');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Detalle con estructura completa', function () {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('comandaId');
        pm.expect(data.estacion).to.equal('COCINA');
        pm.expect(['PENDIENTE','EN_PREPARACION','LISTO']).to.include(data.comandaEstado);
        pm.expect(data.platos).to.be.an('array');
        pm.expect(data.bebidas).to.be.an('array');
        pm.expect(data.otros).to.be.an('array');
      });
    language: text/javascript
order: 2010
