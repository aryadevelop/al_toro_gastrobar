$kind: http-request
name: RD-04 ADMIN consulta reservas canceladas/devueltas de cualquier cliente – 200 OK
description: |-
  **Criterio de Aceptación:** Autorización por rol — `ADMIN` está incluido en el `@PreAuthorize`
  del controller y, al no ser `CLIENTE`, no aplica restricción de ownership.
  **Objetivo:** Verificar que un ADMIN puede consultar las reservas terminales de cualquier
  cliente; cuando la lista no está vacía, todos los elementos deben tener estado válido
  (`CANCELADA` | `DEVUELTA`) y orden descendente por fecha.
  **Pre-condición:** El seed `V3__dev_data.sql` hace que `emailCliente` (andres.morales)
  tenga la reserva 16 en estado `DEVUELTA`, así que la lista no estará vacía. Se usa
  `accessToken` (ADMIN).
  **Resultado esperado:** 200 OK · `data` es un array · todos los elementos cumplen el contrato.
url: "{{baseUrl}}/api/reservas/cliente/canceladas-devueltas?emailCliente={{emailCliente}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200 para ADMIN sin restricción de ownership', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo data es un array', function () {
        pm.expect(body.data).to.be.an('array');
      });

      const lista = body.data;
      pm.test('Solo hay reservas con estado CANCELADA o DEVUELTA', function () {
        lista.forEach(r => {
          pm.expect(['CANCELADA', 'DEVUELTA']).to.include(r.estado);
        });
      });

      pm.test('La lista está ordenada descendentemente por fechaHoraLlegada', function () {
        for (let i = 1; i < lista.length; i++) {
          pm.expect(new Date(lista[i].fechaHoraLlegada) <= new Date(lista[i-1].fechaHoraLlegada)).to.be.true;
        }
      });
    language: text/javascript
order: 4000
