$kind: http-request
name: AB-09 monto cero o negativo – 422 Unprocessable Entity
description: |
  Bean Validation @DecimalMin("0.01") rechaza montos ≤ 0.
  Resultado esperado: 422 Unprocessable Entity, code = VAL-001.
url: "{{baseUrl}}/api/reservas/999999/abonos"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "ANTICIPO",
      "monto": 0,
      "metodo": "EFECTIVO",
      "fechaHora": "2026-05-23T10:00:00"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        } else {
          console.warn('AB-09: login CAJERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('monto ≤ 0 → 422', function () {
        pm.response.to.have.status(422);
      });
      pm.test('code = VAL-001', function () {
        pm.expect(pm.response.json().code).to.equal('VAL-001');
      });
    language: text/javascript
order: 9000
