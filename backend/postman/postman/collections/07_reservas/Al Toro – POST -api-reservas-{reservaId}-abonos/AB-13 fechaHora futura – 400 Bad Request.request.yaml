$kind: http-request
name: AB-13 fechaHora futura – 400 Bad Request
description: |
  La regla de negocio validarFechaAbono rechaza fechaHora futura con 400 BAD_REQUEST.
  El beforeRequest crea una reserva ESPECIAL CONFIRMADA para poder llegar al servicio
  (la validación de fecha ocurre después de validar estado).
  El body envía fechaHora = mañana (futura).
  Resultado esperado: 400, code = VAL-001,
  message = "La fecha no puede ser futura ni anterior a la fecha de creación de la reserva".
  Cleanup en afterResponse: CAJERO cancela la reserva creada.
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdAB13}}/abonos"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: "{{tmpAbonoBodyAB13}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaReserva = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      // fechaHora del abono = mañana (futura → rechazada por validarFechaAbono)
      const manana = new Date();
      manana.setDate(manana.getDate() + 1);
      const fechaFutura = manana.getFullYear() + '-' + pad(manana.getMonth() + 1) + '-' + pad(manana.getDate())
        + 'T10:00:00';

      pm.environment.set('tmpAbonoBodyAB13', JSON.stringify({
        tipo: 'ANTICIPO',
        monto: 50000,
        metodo: 'EFECTIVO',
        fechaHora: fechaFutura
      }));

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fechaReserva,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('AB-13: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          pm.environment.set('tmpReservaIdAB13', r2.json().data.reservaId);

          // Paso 2: CAJERO confirma la reserva
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (e3 || !r3 || r3.code !== 200) {
              console.warn('AB-13: login CAJERO falló', e3, r3 && r3.code);
              return;
            }
            const cajeroToken = r3.json().accessToken;
            pm.environment.set('cajeroToken', cajeroToken);

            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + r2.json().data.reservaId + '/confirmar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + cajeroToken }
            }, function (e4, r4) {
              if (!e4 && r4 && r4.code !== 200) {
                console.warn('AB-13: confirmar reserva falló', r4 && r4.code);
              }
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('fechaHora futura → 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('code = VAL-001', function () {
        pm.expect(pm.response.json().code).to.equal('VAL-001');
      });
      pm.test('message sobre fecha futura', function () {
        pm.expect(pm.response.json().message)
          .to.equal('La fecha no puede ser futura ni anterior a la fecha de creación de la reserva');
      });

      // Cleanup: CAJERO cancela la reserva creada
      const reservaId = pm.environment.get('tmpReservaIdAB13');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('cajeroToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup AB-13: cancelar reserva falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaIdAB13');
      pm.environment.unset('tmpAbonoBodyAB13');
    language: text/javascript
order: 13000
