$kind: http-request
name: AB-17 Devolución excede neto abonado – 409 Conflict
description: |
  Una devolución no puede exceder el neto abonado (totalAnticipado - totalDevuelto).
  El beforeRequest: (1) cliente crea reserva ESPECIAL, (2) CAJERO confirma,
  (3) CAJERO registra anticipo de 10 COP, (4) CAJERO cancela la reserva.
  El POST intenta devolver 999_999_999 COP (excede el neto de 10 COP con certeza).
  Resultado esperado: 409 Conflict, code = NEG-001, message contiene "Pendiente máximo".
  No se requiere cleanup adicional: la reserva ya está CANCELADA (estado terminal).
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdAB17}}/abonos"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: "{{tmpDevolucionBodyAB17}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaReserva = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      const now = new Date();
      const fechaAbono = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
        + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

      // Devolución que excede el neto (anticipo de 10 COP, devolución de 999_999_999 COP)
      pm.environment.set('tmpDevolucionBodyAB17', JSON.stringify({
        tipo: 'DEVOLUCION',
        monto: 999999999,
        metodo: 'TRANSFERENCIA',
        fechaHora: fechaAbono
      }));

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fechaReserva,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('AB-17: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          const reservaId = r2.json().data.reservaId;
          pm.environment.set('tmpReservaIdAB17', reservaId);

          // Paso 2: CAJERO obtiene token, confirma la reserva
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (e3 || !r3 || r3.code !== 200) {
              console.warn('AB-17: login CAJERO falló', e3, r3 && r3.code);
              return;
            }
            const cajeroToken = r3.json().accessToken;
            pm.environment.set('cajeroToken', cajeroToken);

            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/confirmar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + cajeroToken }
            }, function (e4, r4) {
              if (e4 || !r4 || r4.code !== 200) {
                console.warn('AB-17: confirmar reserva falló', e4, r4 && r4.code);
                return;
              }

              // Paso 3: CAJERO registra anticipo mínimo (10 COP) para establecer neto > 0
              pm.sendRequest({
                url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/abonos',
                method: 'POST',
                header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cajeroToken },
                body: { mode: 'raw', raw: JSON.stringify({
                  tipo: 'ANTICIPO',
                  monto: 10,
                  metodo: 'EFECTIVO',
                  fechaHora: fechaAbono
                })}
              }, function (e5, r5) {
                if (e5 || !r5 || r5.code !== 201) {
                  console.warn('AB-17: anticipo mínimo falló', e5, r5 && r5.code);
                  return;
                }

                // Paso 4: CAJERO cancela la reserva
                pm.sendRequest({
                  url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
                  method: 'PATCH',
                  header: { 'Authorization': 'Bearer ' + cajeroToken }
                }, function (e6, r6) {
                  if (!e6 && r6 && r6.code !== 200) {
                    console.warn('AB-17: cancelar reserva falló', r6 && r6.code);
                  }
                });
              });
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Devolución excede neto abonado → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-001', function () {
        pm.expect(pm.response.json().code).to.equal('NEG-001');
      });
      pm.test('message contiene "Pendiente máximo"', function () {
        pm.expect(pm.response.json().message).to.include('Pendiente máximo');
      });
      // Reserva ya está CANCELADA (estado terminal) — no requiere cleanup adicional.
      pm.environment.unset('tmpReservaIdAB17');
      pm.environment.unset('tmpDevolucionBodyAB17');
    language: text/javascript
order: 17000
