$kind: http-request
name: CR-30 Sin zonaId, ninguna zona tiene capacidad – 422 Unprocessable
description: |-
  **Criterio de Aceptación:** Cuando no se envía `zonaId`, el servicio verifica que al
  menos una zona tenga capacidad restante para el número de comensales. Si ninguna lo
  tiene, rechaza con 422.
  **Objetivo:** Verificar el rechazo por capacidad global insuficiente.
  **Pre-condición:** `clienteToken` disponible; `tmpFechaLibre` aleatoria futura.
  El seed V2 define como zona más grande el Salón Principal (cap=60), por lo que un
  request con 200 comensales siempre excede cualquier zona individual —
  independiente de otras reservas.
  **Resultado esperado:** 422 Unprocessable Entity.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fechaHoraLlegada": "{{tmpFechaLibre}}",
      "numeroPersonas": 200
    }
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la reserva sin zona por capacidad global con 422', function () {
        pm.response.to.have.status(422);
      });
      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 30000
