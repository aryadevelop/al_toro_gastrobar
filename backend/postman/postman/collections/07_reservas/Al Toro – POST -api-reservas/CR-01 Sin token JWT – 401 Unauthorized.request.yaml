$kind: http-request
name: CR-01 Sin token JWT – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** Control de acceso — no se permite crear reservas sin autenticación.
  **Objetivo:** Verificar que el endpoint rechaza peticiones sin header `Authorization` con 401.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fechaHoraLlegada": "{{tmpFechaLibre}}",
      "numeroPersonas": 2
    }
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la petición sin token con 401', function () {
        pm.response.to.have.status(401);
      });
      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 1000
