$kind: http-request
name: CR-27 decoracionId inexistente – 404 Not Found
description: |-
  **Criterio de Aceptación:** Cuando el cliente envía un `decoracionId` que no existe,
  `ReservaService` lanza `ResourceNotFoundException` y se traduce a 404.
  **Objetivo:** Verificar que un ID de decoración inválido devuelve 404.
  **Pre-condición:** `clienteToken` disponible; `tmpFechaLibre` aleatoria válida;
  `decoracionId` 99999 no existe en el seed V2 (máximo 8).
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fechaHoraLlegada": "{{tmpFechaLibre}}",
      "numeroPersonas": 2,
      "decoracionId": 99999
    }
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la decoración inexistente con 404', function () {
        pm.response.to.have.status(404);
      });
      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 27000
