$kind: http-request
name: RF-04 ADMIN consulta reservas futuras de cualquier cliente – 200 OK
description: |-
  **Criterio de Aceptación:** Autorización por rol — `ADMIN` está incluido en el `@PreAuthorize`
  del controller y, al no ser `CLIENTE`, no aplica restricción de ownership.
  **Objetivo:** Verificar que un ADMIN puede consultar las reservas futuras de cualquier cliente
  y que la reserva recién creada aparece en la lista.
  **Pre-condición:** Ninguna externa. El pre-request hace login autónomo como ADMIN y como
  CLIENTE (para crear la reserva). El afterResponse cancela la reserva creada.
  **Resultado esperado:** 200 OK · la reserva creada está presente en `data`.
url: "{{baseUrl}}/api/reservas/cliente/futuras?emailCliente={{emailCliente}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      // Login ADMIN (para el request GET)
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailAdmin'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('accessToken', res.json().accessToken);
          pm.environment.set('adminToken', res.json().accessToken);
        } else {
          console.warn('Pre-request RF-04: login ADMIN falló', err, res && res.code);
        }
      });

      // Login CLIENTE → crear reserva
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err2, res2) {
        if (err2 || !res2 || res2.code !== 200) {
          console.warn('Pre-request RF-04: login CLIENTE falló', err2, res2 && res2.code);
          return;
        }
        const token = res2.json().accessToken;
        pm.environment.set('clienteToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: null, preOrden: null
          })}
        }, function (e3, r3) {
          if (!e3 && r3 && r3.code === 201) {
            pm.environment.set('tmpReservaId', r3.json().data.reservaId);
          } else {
            console.warn('Pre-request RF-04: creación de reserva falló', e3, r3 && r3.code, r3 && r3.text());
          }
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200 para ADMIN sin restricción de ownership', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo data es un array', function () {
        pm.expect(body.data).to.be.an('array');
      });

      const tmpId = String(pm.environment.get('tmpReservaId'));
      pm.test('La reserva creada en el pre-request aparece en la lista', function () {
        pm.expect(body.data.map(r => String(r.reservaId))).to.include(tmpId);
      });

      const reservaId = pm.environment.get('tmpReservaId');
      if (reservaId) {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RF-04: cancelar reserva ' + reservaId + ' falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 4000
