$kind: http-request
name: CF-05 CAJERO confirma ESPECIAL PENDIENTE – 200 OK
description: |
  CA-08: CAJERO confirma una reserva ESPECIAL PENDIENTE.
  El beforeRequest crea una reserva ESPECIAL PENDIENTE (decoracionId=1 con costo)
  a nombre del cliente seed, luego el CAJERO la confirma con su propio token.
  Resultado esperado: 200, estado=CONFIRMADA, tipo=ESPECIAL.
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdCF05}}/confirmar"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fecha = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE (decoracionId=1 tiene costo)
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fecha,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('CF-05: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          pm.environment.set('tmpReservaIdCF05', r2.json().data.reservaId);

          // Paso 2: CAJERO obtiene su token
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('cajeroToken', r3.json().accessToken);
            } else {
              console.warn('CF-05: login CAJERO falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('CA-08: CAJERO confirma ESPECIAL PENDIENTE → 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('CA-08: estado=CONFIRMADA, tipo=ESPECIAL', function () {
        const data = pm.response.json().data;
        pm.expect(data.estado).to.eql('CONFIRMADA');
        pm.expect(data.tipo).to.eql('ESPECIAL');
      });
      pm.test('CA-08: reservaId coincide', function () {
        pm.expect(pm.response.json().data.reservaId)
          .to.eql(parseInt(pm.environment.get('tmpReservaIdCF05')));
      });
      pm.test('CA-08: response incluye clienteNombre y fechaHoraLlegada', function () {
        const data = pm.response.json().data;
        pm.expect(data.clienteNombre).to.be.a('string').and.not.empty;
        pm.expect(data.fechaHoraLlegada).to.be.a('string').and.not.empty;
      });

      // Cleanup: cancelar la reserva confirmada
      const reservaId = pm.environment.get('tmpReservaIdCF05');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({
            email: pm.environment.get('emailCajero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })}
        }, function (e, r) {
          if (!e && r && r.code === 200) {
            const token = r.json().accessToken;
            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + token }
            }, function (e2, r2) {
              if (!e2 && r2 && r2.code !== 200) {
                console.warn('Cleanup CF-05: cancelar reserva falló', r2 && r2.code);
              }
            });
          }
        });
      }
      pm.environment.unset('tmpReservaIdCF05');
    language: text/javascript
order: 5000
