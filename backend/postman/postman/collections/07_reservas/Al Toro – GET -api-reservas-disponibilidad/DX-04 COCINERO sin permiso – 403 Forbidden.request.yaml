$kind: http-request
name: DX-04 COCINERO (rol PRODUCCION) sin permiso – 403 Forbidden
description: |-
  **Criterio de Aceptación:** Autorización por rol — el `@PreAuthorize` del controller solo
  acepta `CLIENTE`. Los roles `COCINERO` y `BARTENDER` se mapean al rol funcional `PRODUCCION`
  (ver `RoleMapper`) y deben ser rechazados con 403.
  **Objetivo:** Verificar que un usuario con rol `PRODUCCION` autenticado correctamente NO
  puede consultar la disponibilidad.
  **Pre-condición:** `cocineroToken` disponible (lo gestiona el pre-request de la colección).
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora=2026-12-15T19:00:00"
method: GET
headers:
  Authorization: Bearer {{cocineroToken}}
queryParams:
  fechaHora: "2026-12-15T19:00:00"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 403 al rol PRODUCCION (COCINERO)', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
