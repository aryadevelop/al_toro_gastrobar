$kind: http-request
name: "DX-08 CA-04 Decoración con zona fija: puedeSeleccionarZona=false – 200 OK"
description: |-
  **Criterio de Aceptación:** CA-04 — una decoración con una única zona vinculada debe
  presentarse con `puedeSeleccionarZona=false` y `zonaIdsCompatibles` con un solo elemento
  (su zona fija). La decoración id=8 (`Test Zona Fija`) está vinculada a la zona id=4 (`Barra`)
  según `V2__seed_data.sql` (`Decoracion_Zona (8, 4)`).
  **Objetivo:** Verificar la proyección de decoraciones con zona fija.
  **Pre-condición:** Seed data: decoración id=8 con única zona compatible id=4.
  **Resultado esperado:** 200 OK · `decoFija.puedeSeleccionarZona=false` · `decoFija.zonaIdsCompatibles=[4]`.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora={{tmpFechaLibre}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  fechaHora: "{{tmpFechaLibre}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Disponibilidad consultada exitosamente', function () {
        pm.response.to.have.status(200);
      });

      const decos = pm.response.json().data.decoraciones;
      const decoFija = decos.find(d => d.decoracionId === 8);

      pm.test('La decoración con zona fija (id=8) aparece en el resultado', function () {
        pm.expect(decoFija).to.not.be.undefined;
      });

      pm.test('puedeSeleccionarZona es false para decoración con zona fija', function () {
        pm.expect(decoFija.puedeSeleccionarZona).to.be.false;
      });

      pm.test('zonaIdsCompatibles contiene exactamente la zona fija asignada [4]', function () {
        pm.expect(decoFija.zonaIdsCompatibles).to.be.an('array').and.have.lengthOf(1);
        pm.expect(decoFija.zonaIdsCompatibles[0]).to.eql(4);
      });

      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 8000
