$kind: http-request
name: "DX-10 CA-06 Decoración sin restricción de zona: zonaIdsCompatibles vacía – 200 OK"
description: |-
  **Criterio de Aceptación:** CA-06 — una decoración sin vínculos en `Decoracion_Zona` debe
  presentarse con `puedeSeleccionarZona=true` y `zonaIdsCompatibles=[]`, indicando que es
  compatible con cualquier zona disponible. La decoración id=6 (`Globos y Flores`) no tiene
  ninguna entrada en `Decoracion_Zona` en `V2__seed_data.sql`.
  **Objetivo:** Verificar la proyección de decoraciones sin restricción de zona.
  **Pre-condición:** Seed data: decoración id=6 sin registros en `Decoracion_Zona`.
  **Resultado esperado:** 200 OK · `globos.puedeSeleccionarZona=true` · `globos.zonaIdsCompatibles=[]`.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora={{tmpFechaLibre}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  fechaHora: "{{tmpFechaLibre}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Disponibilidad consultada exitosamente', function () {
        pm.response.to.have.status(200);
      });

      const decos = pm.response.json().data.decoraciones;
      const globos = decos.find(d => d.decoracionId === 6);

      pm.test('La decoración Globos y Flores (id=6) aparece en el resultado', function () {
        pm.expect(globos).to.not.be.undefined;
      });

      pm.test('puedeSeleccionarZona es true para decoración sin restricción de zona', function () {
        pm.expect(globos.puedeSeleccionarZona).to.be.true;
      });

      pm.test('zonaIdsCompatibles es un array vacío cuando no hay restricción de zona', function () {
        pm.expect(globos.zonaIdsCompatibles).to.be.an('array').and.be.empty;
      });

      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 10000
