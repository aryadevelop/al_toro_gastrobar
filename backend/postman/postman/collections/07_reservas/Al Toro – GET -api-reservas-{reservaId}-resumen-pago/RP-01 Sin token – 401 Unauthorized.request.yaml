$kind: http-request
name: RP-01 Sin token – 401 Unauthorized
description: |
  Sin cabecera Authorization, el filtro JWT rechaza el request antes de llegar al controlador.
  Resultado esperado: 401 Unauthorized.
url: "{{baseUrl}}/api/reservas/999999/resumen-pago"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 401 la petición sin token', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
