$kind: http-request
name: MC-11 No hay reservas para la fecha – 404 Not Found
description: |-
  **Criterio de Aceptación:** CA-02 — cuando no hay reservas programadas para la fecha consultada, se retorna error de negocio.
  **Objetivo:** Verificar que el sistema retorna 404 con mensaje específico cuando no hay reservas para la fecha.
  **Pre-condición:** Se consulta una fecha muy lejana en el futuro sin reservas programadas.
  **Resultado esperado:** 404 NOT_FOUND · mensaje: "No hay reservas programadas para esta fecha".
url: "{{baseUrl}}/api/reservas/mesero/consulta?fecha=2099-12-31"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 404', function () {
        pm.response.to.have.status(404);
      });

      const body = pm.response.json();
      pm.test('El campo success es false', function () {
        pm.expect(body.success).to.be.false;
      });

      pm.test('El mensaje es el esperado', function () {
        pm.expect(body.message).to.equal('No hay reservas para la fecha o identificador especificado');
      });

      pm.test('El código de error es ENT-001', function () {
        pm.expect(body.code).to.equal('ENT-001');
      });
    language: text/javascript
order: 2065
