$kind: http-request
name: RE-10 COCINERO (rol PRODUCCION) sin permiso para detalle de reserva – 403 Forbidden
description: |-
  **Criterio de Aceptación:** Autorización por rol — el `@PreAuthorize` del controller solo
  acepta `CLIENTE`, `MESERO`, `CAJERO` y `ADMIN`. Los roles `COCINERO` y `BARTENDER` se mapean
  al rol funcional `PRODUCCION` (ver `RoleMapper`) y deben ser rechazados con 403.
  **Objetivo:** Verificar que un usuario con rol `PRODUCCION` autenticado correctamente NO
  puede consultar el detalle de una reserva.
  **Pre-condición:** Ninguna externa. El pre-request hace login autónomo como COCINERO y como
  CLIENTE (para crear la reserva). El afterResponse cancela la reserva creada.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}/detalle"
method: GET
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      // Login COCINERO (para el request GET)
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCocinero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cocineroToken', res.json().accessToken);
        } else {
          console.warn('Pre-request RE-10: login COCINERO falló', err, res && res.code);
        }
      });

      // Login CLIENTE → crear reserva
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err2, res2) {
        if (err2 || !res2 || res2.code !== 200) {
          console.warn('Pre-request RE-10: login CLIENTE falló', err2, res2 && res2.code);
          return;
        }
        const token = res2.json().accessToken;
        pm.environment.set('clienteToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: null, preOrden: null
          })}
        }, function (e3, r3) {
          if (!e3 && r3 && r3.code === 201) {
            pm.environment.set('tmpReservaId', r3.json().data.reservaId);
          } else {
            console.warn('Pre-request RE-10: creación de reserva falló', e3, r3 && r3.code, r3 && r3.text());
          }
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 403 al rol PRODUCCION (COCINERO)', function () {
        pm.response.to.have.status(403);
      });

      const reservaId = pm.environment.get('tmpReservaId');
      if (reservaId) {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RE-10: cancelar reserva ' + reservaId + ' falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 10000
