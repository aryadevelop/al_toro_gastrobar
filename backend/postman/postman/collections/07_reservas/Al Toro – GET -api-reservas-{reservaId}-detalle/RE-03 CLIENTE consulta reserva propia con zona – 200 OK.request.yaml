$kind: http-request
name: RE-03 CLIENTE consulta detalle de reserva propia con zona – 200 OK
description: |-
  **Criterio de Aceptación:** HE-02-HU-03-CA-07 (campos opcionales presentes cuando aplican)
  **Objetivo:** Verificar que `zonaNombre` se incluye en el detalle cuando la reserva fue creada
  con zona específica.
  **Pre-condición:** Ninguna externa. El pre-request hace login autónomo, consulta disponibilidad
  para obtener una `zonaId` real, crea la reserva y captura el `reservaId` en `tmpReservaId`.
  El afterResponse cancela la reserva para evitar acumulación de datos.
  **Resultado esperado:** 200 OK · `zonaNombre` presente y no vacío · `reservaId` coincide con
  la reserva recién creada.
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}/detalle"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('Pre-request RE-03: login CLIENTE falló', err, res && res.code);
          return;
        }
        const token = res.json().accessToken;
        pm.environment.set('clienteToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/disponibilidad?fechaHora=' + encodeURIComponent(fechaHora),
          method: 'GET',
          header: { 'Authorization': 'Bearer ' + token }
        }, function (errD, resD) {
          if (errD || !resD || resD.code !== 200) {
            console.warn('Pre-request RE-03: disponibilidad falló', errD, resD && resD.code);
            return;
          }
          const zonas = resD.json().data.zonas;
          if (!zonas || zonas.length === 0) {
            console.warn('Pre-request RE-03: no hay zonas disponibles para ' + fechaHora);
            return;
          }
          const zonaId = zonas[0].zonaId;

          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/reservas',
            method: 'POST',
            header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: { mode: 'raw', raw: JSON.stringify({
              emailCliente: pm.environment.get('emailCliente'),
              fechaHoraLlegada: fechaHora,
              numeroPersonas: 2,
              zonaId: zonaId, decoracionId: null,
              notas: 'Cumpleaños', preOrden: null
            })}
          }, function (errR, resR) {
            if (!errR && resR && resR.code === 201) {
              pm.environment.set('tmpReservaId', resR.json().data.reservaId);
            } else {
              console.warn('Pre-request RE-03: creación de reserva falló', errR, resR && resR.code, resR && resR.text());
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('El detalle incluye zonaNombre y notas asociados a la reserva', function () {
        const data = pm.response.json().data;
        pm.expect(data.zonaNombre).to.be.a('string').and.not.empty;
        pm.expect(data.notas).to.eql('Cumpleaños');
      });
      pm.test('El reservaId del detalle coincide con el de la reserva creada', function () {
        pm.expect(String(pm.response.json().data.reservaId))
          .to.eql(String(pm.environment.get('tmpReservaId')));
      });

      const reservaId = pm.environment.get('tmpReservaId');
      if (reservaId) {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RE-03: cancelar reserva ' + reservaId + ' falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 3000
