$kind: http-request
name: 08 COCINERO inicia preparación – 200 OK
description: La comanda COCINA pasa PENDIENTE → EN_PREPARACION (descuenta inventario de insumos).
url: "{{baseUrl}}/api/comandas/produccion/{{tmpComandaCocinaId}}/iniciar"
method: POST
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCocinero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cocineroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema inicia la preparación (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('La comanda queda EN_PREPARACION', function () {
        pm.expect(pm.response.json().data.comandaEstado).to.eql('EN_PREPARACION');
      });
    language: text/javascript
order: 170
