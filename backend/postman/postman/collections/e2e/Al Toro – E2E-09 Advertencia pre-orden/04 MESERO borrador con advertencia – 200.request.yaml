$kind: http-request
name: 04 MESERO obtiene borrador – advertenciasPreorden con 1 entrada – 200 OK
description: |-
  El borrador precargado debe exponer `advertenciasPreorden` con UNA entrada para PA-HE-04-Sin-Stock
  (productoId=145, cantidadEnComanda=1, cantidadDisponible=0) y `puedeEnviarCocina=true` (informativa,
  no bloquea). Captura `tmpComandaCocinaId` y el `comandaItemId` del ítem 145 (buscado en platos[] por
  productoId===145) en `tmpItem145Id`.
url: "{{baseUrl}}/api/comandas/borrador?visitaId={{tmpVisitaId}}"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const data = pm.response.json().data;
      pm.environment.set('tmpComandaCocinaId', data.comandaCocinaId);

      pm.test('advertenciasPreorden tiene 1 entrada para PA-HE-04-Sin-Stock (145)', function () {
        const adv = data.advertenciasPreorden || [];
        pm.expect(adv, 'advertenciasPreorden').to.be.an('array').with.lengthOf(1);
        const a = adv[0];
        pm.expect(a.productoId, 'productoId').to.eql(145);
        pm.expect(a.productoNombre, 'productoNombre').to.eql('PA-HE-04-Sin-Stock');
        pm.expect(a.cantidadEnComanda, 'cantidadEnComanda').to.eql(1);
        pm.expect(a.cantidadDisponible, 'cantidadDisponible').to.eql(0);
      });

      pm.test('El borrador no se bloquea (puedeEnviarCocina=true)', function () {
        pm.expect(data.puedeEnviarCocina).to.be.true;
      });

      pm.test('Captura el comandaItemId del ítem 145 desde platos[]', function () {
        const item145 = (data.platos || []).find(p => p.productoId === 145);
        pm.expect(item145, 'ítem 145 en platos[]').to.exist;
        pm.environment.set('tmpItem145Id', item145.comandaItemId);
      });
    language: text/javascript
order: 130
