$kind: http-request
name: 05 MESERO elimina el ítem sin stock (145) del borrador – 200 OK
description: |-
  El mesero elimina la línea de PA-HE-04-Sin-Stock del borrador (por su `comandaItemId`). Así el ítem
  con advertencia NO se envía a producción y no bloqueará `iniciar` por stock 0.
  // VERIFICAR EN VIVO: status del DELETE de ítem del borrador (esperado 200).
url: "{{baseUrl}}/api/comandas/borrador/items/{{tmpItem145Id}}"
method: DELETE
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema elimina el ítem sin stock (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 140
