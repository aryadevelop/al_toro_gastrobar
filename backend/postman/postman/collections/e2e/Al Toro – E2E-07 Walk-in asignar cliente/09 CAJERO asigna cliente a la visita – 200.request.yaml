$kind: http-request
name: 09 CAJERO asigna el cliente a la visita – 200 OK
description: |-
  El cajero relaciona la cuenta del walk-in con el cliente encontrado (`?clienteId=` como query param).
  // VERIFICAR EN VIVO: status de éxito de este PATCH (asumido 200).
url: "{{baseUrl}}/api/visitas/{{tmpVisitaId}}/cliente?clienteId={{tmpClienteId}}"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema asigna el cliente a la visita (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 180
