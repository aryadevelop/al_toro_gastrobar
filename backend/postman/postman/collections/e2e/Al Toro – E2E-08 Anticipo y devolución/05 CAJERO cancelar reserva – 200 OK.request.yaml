$kind: http-request
name: 05 CAJERO cancelar reserva – 200 OK
description: Cancela la reserva (CONFIRMADA → CANCELADA). Requisito para poder registrar una DEVOLUCIÓN.
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}/cancelar"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('La reserva queda CANCELADA', function () {
        pm.expect(pm.response.json().data.estado).to.eql('CANCELADA');
      });
    language: text/javascript
order: 140
