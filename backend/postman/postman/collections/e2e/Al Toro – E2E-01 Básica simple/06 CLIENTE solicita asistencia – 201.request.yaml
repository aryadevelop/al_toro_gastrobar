$kind: http-request
name: 06 CLIENTE solicita asistencia – 201 Created
description: El cliente llama al mesero desde su mesa (crea notificación ATENCION ACTIVA).
url: "{{baseUrl}}/api/visitas/{{tmpVisitaId}}/asistencia"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: 'paola.rojas@gmail.com',
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('clienteToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema registra la solicitud de asistencia (HTTP 201)', function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
order: 150
