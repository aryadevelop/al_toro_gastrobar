$kind: http-request
name: 09 CLIENTE visita activa ya sin asistencia pendiente – 200 OK
description: Tras atender, la visita refleja `asistenciaSolicitada=false`.
url: "{{baseUrl}}/api/visitas/activa"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: 'paola.rojas@gmail.com',
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('clienteToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('asistenciaSolicitada=false tras atender', function () {
        pm.expect(pm.response.json().data.asistenciaSolicitada).to.be.false;
      });
    language: text/javascript
order: 180
