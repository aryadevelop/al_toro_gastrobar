$kind: http-request
name: 08 MESERO atiende la asistencia – 200 OK
description: El mesero atiende la notificación de asistencia (ATENCION ACTIVA → ATENDIDA).
url: "{{baseUrl}}/api/notificaciones/{{tmpNotifAsistenciaId}}/atender"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema atiende la asistencia (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 170
