$kind: http-request
name: 08 CAJERO consulta cuenta (invitado, sin cliente) – 200 OK
description: |-
  La cuenta de un walk-in sin cliente asignado tiene `clienteId=null` (invitado).
  Captura `tmpTotalAntes` y la cantidad de ítems `tmpItemsAntes` para comparar tras eliminar uno.
url: "{{baseUrl}}/api/ventas/{{tmpVisitaId}}/cuenta"
method: GET
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      // Capturas FUERA del pm.test para que siempre se ejecuten (aunque una aserción falle).
      const data = pm.response.json().data;
      pm.environment.set('tmpTotalAntes', data.totalAPagar);
      pm.environment.set('tmpItemsAntes', data.items.length);
      pm.test('La cuenta es de un INVITADO (clienteId omitido) con ítems', function () {
        pm.expect(data.clienteId, 'clienteId').to.not.exist;
        pm.expect(data.items, 'items').to.be.an('array').with.lengthOf.at.least(2);
        pm.expect(Number(data.totalAPagar)).to.be.above(0);
      });
    language: text/javascript
order: 170
