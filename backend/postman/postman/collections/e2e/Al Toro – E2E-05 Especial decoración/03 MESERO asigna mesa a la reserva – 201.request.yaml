$kind: http-request
name: 03 MESERO asigna mesa a la reserva (inicia visita) – 201 Created
description: |-
  El mesero asigna mesa a la reserva CONFIRMADA, creando la Visita. Como la reserva NO tiene pre-orden,
  el borrador arranca vacío (se arma desde cero en la visita). Captura `tmpVisitaId`.
  ⚠️ Requiere ventana 17:00–22:00.
url: "{{baseUrl}}/api/mesas"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mesaIdentificador": "{{tmpMesaIdent}}",
      "zonaId": 3,
      "numeroPersonas": 2,
      "reservaId": {{tmpReservaId}},
      "mesaNotas": null
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('tmpMesaIdent', 'E05-' + (Date.now() % 1000000));

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema asigna la mesa (HTTP 201)', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Se crea la visita y se captura su id', function () {
        const data = pm.response.json().data;
        pm.expect(data.visitaId, 'visitaId').to.be.a('number');
        pm.environment.set('tmpVisitaId', data.visitaId);
      });
    language: text/javascript
order: 120
