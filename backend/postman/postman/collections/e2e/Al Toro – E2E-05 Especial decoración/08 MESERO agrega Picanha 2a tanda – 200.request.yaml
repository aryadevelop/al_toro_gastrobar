$kind: http-request
name: 08 MESERO agrega Picanha (2ª tanda) – 200 OK
description: |-
  Segunda tanda: el mesero agrega Picanha (productoId=10) mientras la 1ª comanda está EN_PREPARACION.
  Como la 1ª ya salió del borrador (PENDIENTE→EN_PREPARACION), agregar un ítem crea/usa un NUEVO borrador COCINA.
  // VERIFICAR EN VIVO: mecánica del borrador de 2ª tanda — que agregar ítem con la 1ª comanda ya en
  // producción genere una comanda COCINA distinta (nuevo borrador) y NO reabra la comanda en preparación.
url: "{{baseUrl}}/api/comandas/borrador/items"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "visitaId": {{tmpVisitaId}},
      "productoId": 10,
      "cantidad": 1,
      "descripcion": null
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema agrega el ítem de la 2ª tanda (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 170
