$kind: http-request
name: 01 CAJERO descubre la reserva sembrada (hora 20:00) – 200 OK
description: |-
  Primer paso: el CAJERO consulta las reservas del día y localiza la sembrada para E2E-05
  (única a las 20:00, ESPECIAL por decoración Bodas Premium). Captura su reservaId en `tmpReservaId`.
  Ante re-corridas del seed, toma el reservaId MAYOR a esa hora.
url: "{{baseUrl}}/api/reservas/mesero/consulta"
method: GET
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        } else {
          console.warn('E2E-05/01: login CAJERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Existe una reserva ESPECIAL por decoración a las 20:00', function () {
        const reservas = pm.response.json().data.reservas;
        const candidatas = reservas.filter(r =>
          r.horaLlegada === '20:00' && r.tipo === 'ESPECIAL' && r.estado === 'PENDIENTE'
          && r.decoracionNombre === 'Bodas Premium');
        pm.expect(candidatas.length,
          'No hay reserva ESPECIAL PENDIENTE a las 20:00 → reinicia la BD (down -v && up --build) para re-sembrar V3'
        ).to.be.above(0);
        // Tomar el reservaId mayor (más reciente ante re-corridas del seed)
        const elegida = candidatas.reduce((a, b) => (b.reservaId > a.reservaId ? b : a));
        pm.environment.set('tmpReservaId', elegida.reservaId);
      });
    language: text/javascript
order: 100
