$kind: http-request
name: 06 MESERO agrega 1 plato de carta (Hamburguesa) al borrador – 200 OK
description: |-
  AV=sí · El mesero agrega un plato de carta (Hamburguesa, productoId=36, 25000) al borrador COCINA,
  además del menú especial precargado. Esto valida que la carta agregada en la visita coexiste con el menú.
url: "{{baseUrl}}/api/comandas/borrador/items"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "visitaId": {{tmpVisitaId}},
      "productoId": 36,
      "cantidad": 1,
      "descripcion": null
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema agrega el ítem de carta (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 150
