$kind: http-request
name: N-11 CAJERO cierra cuenta sin método de pago – 422 Unprocessable Entity
description: |-
  El método de pago es obligatorio al cerrar (`@NotNull` → 422, CA-13). Se incluye aquí por ser
  una regla de cierre. El beforeRequest crea un walk-in con un ítem y deja la visita abierta; la
  request principal cierra sin el campo "metodo". Coincide con la colección por-endpoint VE-04.
url: "{{baseUrl}}/api/ventas"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailCajero": "{{emailCajero}}",
      "visitaId": {{tmpNegVisitaSinMetodoId}},
      "descuento": 0
    }
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      const ident = 'N11-' + (Date.now() % 1000000);

      pm.sendRequest({
        url: baseUrl + '/api/auth/login', method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (e1, r1) => {
        if (e1 || !r1 || r1.code !== 200) { console.warn('N-11: login MESERO falló', e1, r1 && r1.code); return; }
        const meseroToken = r1.json().accessToken;
        const meseroHdr = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + meseroToken };

        pm.sendRequest({
          url: baseUrl + '/api/mesas', method: 'POST', header: meseroHdr,
          body: { mode: 'raw', raw: JSON.stringify({
            mesaIdentificador: ident, zonaId: 3, numeroPersonas: 2, reservaId: null
          })}
        }, (e2, r2) => {
          if (e2 || !r2 || r2.code !== 201) { console.warn('N-11: walk-in falló', e2, r2 && r2.code); return; }
          const visitaId = r2.json().data.visitaId;

          pm.sendRequest({
            url: baseUrl + '/api/comandas/borrador/items', method: 'POST', header: meseroHdr,
            body: { mode: 'raw', raw: JSON.stringify({ visitaId: visitaId, productoId: 36, cantidad: 1 }) }
          }, (e3, r3) => {
            if (e3 || !r3 || r3.code !== 200) { console.warn('N-11: agregar ítem falló', e3, r3 && r3.code); return; }
            pm.environment.set('tmpNegVisitaSinMetodoId', visitaId);

            pm.sendRequest({
              url: baseUrl + '/api/auth/login', method: 'POST',
              header: { 'Content-Type': 'application/json' },
              body: { mode: 'raw', raw: JSON.stringify({
                email: pm.environment.get('emailCajero'),
                password: pm.environment.get('passwordValida'),
                forceSessionOverride: true
              })}
            }, (e4, r4) => {
              if (!e4 && r4 && r4.code === 200) {
                const token = r4.json().accessToken;
                pm.environment.set('cajeroToken', token);
                pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
              } else { console.warn('N-11: login CAJERO falló', e4, r4 && r4.code); }
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Cierre sin método → 422', function () {
        pm.response.to.have.status(422);
      });
      pm.environment.unset('tmpNegVisitaSinMetodoId');
    language: text/javascript
order: 1100
