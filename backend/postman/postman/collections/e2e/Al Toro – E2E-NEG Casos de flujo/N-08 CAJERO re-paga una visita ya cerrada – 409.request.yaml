$kind: http-request
name: N-08 CAJERO re-paga una visita ya cerrada – 409 Conflict
description: |-
  Cerrar una visita que ya tiene venta (re-pago) → 409 NEG-002 (idempotencia). El beforeRequest
  crea un walk-in con un ítem, lo cierra correctamente como CAJERO, y la request principal intenta
  cerrar la MISMA visita de nuevo. Coincide con la colección por-endpoint VE-08.
  // VERIFICAR EN VIVO: setup pesado (walk-in→armar→cerrar) antes del re-pago.
url: "{{baseUrl}}/api/ventas"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailCajero": "{{emailCajero}}",
      "visitaId": {{tmpNegVisitaCerradaId}},
      "descuento": 0,
      "metodo": "EFECTIVO"
    }
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      const ident = 'N08-' + (Date.now() % 1000000);
      const emailCajero = pm.environment.get('emailCajero');

      pm.sendRequest({
        url: baseUrl + '/api/auth/login', method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (e1, r1) => {
        if (e1 || !r1 || r1.code !== 200) { console.warn('N-08: login MESERO falló', e1, r1 && r1.code); return; }
        const meseroToken = r1.json().accessToken;
        const meseroHdr = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + meseroToken };

        pm.sendRequest({
          url: baseUrl + '/api/mesas', method: 'POST', header: meseroHdr,
          body: { mode: 'raw', raw: JSON.stringify({
            mesaIdentificador: ident, zonaId: 3, numeroPersonas: 2, reservaId: null
          })}
        }, (e2, r2) => {
          if (e2 || !r2 || r2.code !== 201) { console.warn('N-08: walk-in falló', e2, r2 && r2.code); return; }
          const visitaId = r2.json().data.visitaId;

          pm.sendRequest({
            url: baseUrl + '/api/comandas/borrador/items', method: 'POST', header: meseroHdr,
            body: { mode: 'raw', raw: JSON.stringify({ visitaId: visitaId, productoId: 36, cantidad: 1 }) }
          }, (e3, r3) => {
            if (e3 || !r3 || r3.code !== 200) { console.warn('N-08: agregar ítem falló', e3, r3 && r3.code); return; }

            // login CAJERO + CERRAR la visita (primer cierre, debe ser 201)
            pm.sendRequest({
              url: baseUrl + '/api/auth/login', method: 'POST',
              header: { 'Content-Type': 'application/json' },
              body: { mode: 'raw', raw: JSON.stringify({
                email: emailCajero,
                password: pm.environment.get('passwordValida'),
                forceSessionOverride: true
              })}
            }, (e4, r4) => {
              if (e4 || !r4 || r4.code !== 200) { console.warn('N-08: login CAJERO falló', e4, r4 && r4.code); return; }
              const cajeroToken = r4.json().accessToken;
              pm.environment.set('cajeroToken', cajeroToken);

              pm.sendRequest({
                url: baseUrl + '/api/ventas', method: 'POST',
                header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cajeroToken },
                body: { mode: 'raw', raw: JSON.stringify({
                  emailCajero: emailCajero, visitaId: visitaId, descuento: 0, metodo: 'EFECTIVO'
                })}
              }, (e5, r5) => {
                if (e5 || !r5 || r5.code !== 201) { console.warn('N-08: cierre inicial falló', e5, r5 && r5.code); return; }
                // La visita ya está cerrada; la request principal intenta cerrarla de nuevo.
                pm.environment.set('tmpNegVisitaCerradaId', visitaId);
                pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + cajeroToken });
              });
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Re-pago de visita cerrada → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-002 (estado inválido)', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
        pm.expect(body.code).to.equal('NEG-002');
      });
      pm.environment.unset('tmpNegVisitaCerradaId');
    language: text/javascript
order: 800
