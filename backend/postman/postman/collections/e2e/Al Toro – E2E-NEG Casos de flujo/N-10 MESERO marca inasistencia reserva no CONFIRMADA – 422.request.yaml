$kind: http-request
name: N-10 MESERO marca inasistencia sobre reserva no CONFIRMADA – 422 Unprocessable Entity
description: |-
  Solo una reserva CONFIRMADA puede marcarse como inasistencia. El beforeRequest crea por API una
  reserva ESPECIAL futura (con decoración con costo → queda PENDIENTE) y el MESERO intenta marcar
  inasistencia → 422 NEG-002 (mensaje incluye "confirmadas"). Coincide con la colección
  por-endpoint MI-06.
  // VERIFICAR EN VIVO: el plan §5 anota 409, pero el endpoint responde 422 NEG-002 (confirmado
  // contra ReservaValidador y MI-06). Una ESPECIAL futura nace PENDIENTE; una BÁSICA nacería
  // CONFIRMADA, por eso se usa ESPECIAL para tener una reserva no-CONFIRMADA.
url: "{{baseUrl}}/api/reservas/{{tmpNegReservaNoConfirmadaId}}/marcar-inasistencia"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      // Fecha futura (varios años) para que la ESPECIAL sea aceptada y quede PENDIENTE
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fecha = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      // Paso 1: CLIENTE (paola) crea una ESPECIAL (decoracionId con costo) → PENDIENTE
      pm.sendRequest({
        url: baseUrl + '/api/auth/login', method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: 'paola.rojas@gmail.com',
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (e1, r1) => {
        if (e1 || !r1 || r1.code !== 200) { console.warn('N-10: login CLIENTE falló', e1, r1 && r1.code); return; }
        const clienteToken = r1.json().accessToken;

        pm.sendRequest({
          url: baseUrl + '/api/reservas', method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fecha, numeroPersonas: 2, decoracionId: 1
          })}
        }, (e2, r2) => {
          if (e2 || !r2 || r2.code !== 201) { console.warn('N-10: crear ESPECIAL falló', e2, r2 && r2.code); return; }
          pm.environment.set('tmpNegReservaNoConfirmadaId', r2.json().data.reservaId);

          // Paso 2: login MESERO para la request principal
          pm.sendRequest({
            url: baseUrl + '/api/auth/login', method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailMesero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, (e3, r3) => {
            if (!e3 && r3 && r3.code === 200) {
              const token = r3.json().accessToken;
              pm.environment.set('meseroToken', token);
              pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
            } else { console.warn('N-10: login MESERO falló', e3, r3 && r3.code); }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Reserva no CONFIRMADA → 422', function () {
        pm.response.to.have.status(422);
      });
      pm.test('code = NEG-002 y mensaje indica estado', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
        pm.expect(body.code).to.equal('NEG-002');
        pm.expect((body.message || '').toLowerCase()).to.include('confirmadas');
      });
      pm.environment.unset('tmpNegReservaNoConfirmadaId');
    language: text/javascript
order: 1000
