$kind: http-request
name: N-04 COCINERO marca listo una comanda PENDIENTE (sin iniciar) – 409 Conflict
description: |-
  Una comanda solo puede marcarse LISTO desde EN_PREPARACION. El beforeRequest crea un walk-in,
  arma una comanda de cocina y la ENVÍA (queda PENDIENTE), pero NO la inicia. El COCINERO intenta
  `/listo` directamente → 409 NEG-002 ("Comanda no EN_PREPARACION"). Coincide con la colección
  por-endpoint de producción AC-07.
  ⚠️ Requiere ventana 17:00–22:00 (POST /api/mesas valida LocalTime.now()).
url: "{{baseUrl}}/api/comandas/produccion/{{tmpNegComandaPendienteId}}/listo"
method: POST
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      const ident = 'N04-' + (Date.now() % 1000000);

      // Paso 1: login MESERO
      pm.sendRequest({
        url: baseUrl + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (e1, r1) => {
        if (e1 || !r1 || r1.code !== 200) { console.warn('N-04: login MESERO falló', e1, r1 && r1.code); return; }
        const meseroToken = r1.json().accessToken;
        const meseroHdr = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + meseroToken };

        // Paso 2: walk-in (reservaId null)
        pm.sendRequest({
          url: baseUrl + '/api/mesas', method: 'POST', header: meseroHdr,
          body: { mode: 'raw', raw: JSON.stringify({
            mesaIdentificador: ident, zonaId: 3, numeroPersonas: 2, reservaId: null
          })}
        }, (e2, r2) => {
          if (e2 || !r2 || r2.code !== 201) { console.warn('N-04: walk-in falló', e2, r2 && r2.code); return; }
          const visitaId = r2.json().data.visitaId;

          // Paso 3: agregar ítem de carta al borrador (crea comanda COCINA)
          pm.sendRequest({
            url: baseUrl + '/api/comandas/borrador/items', method: 'POST', header: meseroHdr,
            body: { mode: 'raw', raw: JSON.stringify({ visitaId: visitaId, productoId: 36, cantidad: 1 }) }
          }, (e3, r3) => {
            if (e3 || !r3 || r3.code !== 200) { console.warn('N-04: agregar ítem falló', e3, r3 && r3.code); return; }
            const comandaCocinaId = r3.json().data.comandaCocinaId;

            // Paso 4: enviar la comanda (BORRADOR → PENDIENTE). NO se inicia.
            pm.sendRequest({
              url: baseUrl + '/api/comandas/borrador/' + comandaCocinaId + '/enviar',
              method: 'POST', header: { 'Authorization': 'Bearer ' + meseroToken }
            }, (e4, r4) => {
              if (e4 || !r4 || r4.code !== 200) { console.warn('N-04: enviar falló', e4, r4 && r4.code); return; }
              pm.environment.set('tmpNegComandaPendienteId', comandaCocinaId);

              // Paso 5: login COCINERO para la request principal
              pm.sendRequest({
                url: baseUrl + '/api/auth/login', method: 'POST',
                header: { 'Content-Type': 'application/json' },
                body: { mode: 'raw', raw: JSON.stringify({
                  email: pm.environment.get('emailCocinero'),
                  password: pm.environment.get('passwordValida'),
                  forceSessionOverride: true
                })}
              }, (e5, r5) => {
                if (!e5 && r5 && r5.code === 200) {
                  const token = r5.json().accessToken;
                  pm.environment.set('cocineroToken', token);
                  pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
                } else { console.warn('N-04: login COCINERO falló', e5, r5 && r5.code); }
              });
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Marcar listo sin iniciar → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-002 (estado inválido)', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
        pm.expect(body.code).to.equal('NEG-002');
      });
      pm.environment.unset('tmpNegComandaPendienteId');
    language: text/javascript
order: 400
