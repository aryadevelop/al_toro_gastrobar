$kind: http-request
name: 15 CAJERO ajusta la cantidad del menú (PATCH visitas/items) – 200 OK
description: |-
  El cajero ajusta la cantidad del plato de menú (línea COCINA del par) a 2 vía
  `PATCH /api/visitas/{id}/items`. El backend debe sincronizar el par: la línea BARRA (bebida)
  cambia a la misma cantidad. Se envía SOLO el `comandaItemId` de la línea COCINA del menú.
  // VERIFICAR EN VIVO: ajustar la cantidad de la línea COCINA del menú sincroniza automáticamente la
  // línea BARRA del mismo menuGrupo (no hace falta enviar el comandaItemId de la bebida).
url: "{{baseUrl}}/api/visitas/{{tmpVisitaId}}/items"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        { "comandaItemId": {{tmpMenuItemCocinaId}}, "cantidad": 2 }
      ],
      "eliminados": []
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema ajusta la cantidad del menú (HTTP 200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 240
