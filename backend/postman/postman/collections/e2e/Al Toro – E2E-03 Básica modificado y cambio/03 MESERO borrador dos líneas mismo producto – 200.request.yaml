$kind: http-request
name: 03 MESERO obtiene borrador – Hamburguesa en DOS líneas – 200 OK
description: |-
  🔴 INVARIANTE CRÍTICO. El borrador precargado debe mostrar la Hamburguesa (productoId=36) en DOS
  líneas distintas: una BASE (descripcion=null) y una MODIFICADA (descripcion="sin cebolla"), con
  `comandaItemId` distintos. Captura `tmpComandaCocinaId`, `tmpItemBaseId` y `tmpItemModId`.
url: "{{baseUrl}}/api/comandas/borrador?visitaId={{tmpVisitaId}}"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const data = pm.response.json().data;
      pm.environment.set('tmpComandaCocinaId', data.comandaCocinaId);

      // Las dos líneas de Hamburguesa (productoId=36) en el borrador (platos[]).
      const hamburguesas = (data.platos || []).filter(p => p.productoId === 36);

      pm.test('Hamburguesa (36) aparece en DOS líneas distintas en el borrador', function () {
        pm.expect(hamburguesas, 'líneas de Hamburguesa').to.have.lengthOf(2);
        const ids = hamburguesas.map(h => h.comandaItemId);
        pm.expect(new Set(ids).size, 'comandaItemId distintos').to.eql(2);
      });

      pm.test('Una línea es BASE (descripcion=null) y otra MODIFICADA ("sin cebolla")', function () {
        const base = hamburguesas.find(h => h.descripcion === null);
        const mod  = hamburguesas.find(h => h.descripcion === 'sin cebolla');
        pm.expect(base, 'línea base con descripcion=null').to.exist;
        pm.expect(mod,  'línea modificada con descripcion="sin cebolla"').to.exist;
        pm.environment.set('tmpItemBaseId', base.comandaItemId);
        pm.environment.set('tmpItemModId', mod.comandaItemId);
      });
    language: text/javascript
order: 120
