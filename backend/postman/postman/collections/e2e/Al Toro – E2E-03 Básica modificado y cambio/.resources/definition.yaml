$kind: collection
name: Al Toro – E2E-03 Básica modificado y cambio
description: |-
  **Escenario E2E-03** · BÁSICA con modificación libre + CAMBIO en producción + ajuste de precio.
  TR=BÁSICA · PO=carta + modificación libre · CB=con cambio (carta/modif.) · AJ=precio (solo línea modificada) ·
  DE=sin · PU=cliente(+1) · MP=TRANSFERENCIA.

  **🔴 INVARIANTE CRÍTICO:** la pre-orden incluye el MISMO `productoId` (Hamburguesa=36) en DOS líneas:
  - línea A (base): cantidad 1, SIN `descripcion` → `esModificado=false`
  - línea B (modificado): cantidad 1, CON `descripcion="sin cebolla"` → `esModificado=true`
  Ambas coexisten como DOS `comandaItemId` distintos en borrador, visita y cuenta (`agruparItems`
  agrupa por `nombreProducto|descripcion`, así que base≠modificado). El ajuste de precio sobre B
  NO afecta a A.

  **Pre-condición:** NO requiere seed (la reserva BÁSICA se crea por API para hoy).
  **Cliente:** paola.rojas@gmail.com (hardcodeado en los pasos de cliente).
  **Token:** cada paso hace login autónomo e inyecta `Authorization: Bearer <token>` con
  `pm.request.headers.upsert` dentro del callback.
  **Ventana horaria:** la asignación de mesa valida `LocalTime.now()` (17:00–22:00).

  **Secuencia (los requests comparten `tmp*` y deben correr en orden):**
  | Orden | Rol | Paso | Aserción |
  |-------|-----|------|----------|
  | 100 | CLIENTE | Crea reserva BÁSICA hoy 19:00 (A base + B modif. + Picanha) | 201, BASICA, CONFIRMADA; captura `tmpReservaId`, `tmpClienteId` |
  | 110 | MESERO | Asignar mesa (reserva) | 201; captura `tmpVisitaId` |
  | 120 | MESERO | Obtener borrador | Hamburguesa en DOS líneas (A null / B "sin cebolla"); captura `tmpComandaCocinaId`, `tmpItemBaseId`, `tmpItemModId` |
  | 130 | MESERO | Enviar comanda COCINA | 200 |
  | 140 | COCINERO | Notificar CAMBIO sobre la comanda COCINA | 201; captura `tmpNotifCambioId` |
  | 150 | MESERO | Atender CAMBIO | 200 (devuelve comandaId) |
  | 160 | MESERO | Editar SOLO la línea B (modificada) en borrador | 200 |
  | 170 | MESERO | Reenviar comanda COCINA | 200 |
  | 180 | COCINERO | Iniciar preparación | EN_PREPARACION |
  | 190 | COCINERO | Marcar listo | LISTO |
  | 200 | CLIENTE | Visita activa | Hamburguesa sigue en DOS líneas separadas (A null / B "sin cebolla") |
  | 210 | CAJERO | Cuenta preliminar | Hamburguesa en DOS líneas (esModificado false/true); captura `tmpSubtotalBaseAntes` |
  | 220 | CAJERO | Ajustar PRECIO solo de la línea B | 200 |
  | 230 | CAJERO | Cuenta posterior | precio de B cambió; A NO cambió (subtotal base intacto) |
  | 240 | CAJERO | Cerrar cuenta (TRANSFERENCIA, sin descuento) | 201 |

  **Login autónomo por rol** en cada `beforeRequest` (emails de entorno + `passwordValida`).
  **Re-corridas:** crea datos nuevos y cierra la visita (terminal).
