$kind: collection
name: e2e
description: |-
  Pruebas de integración E2E por rol (recorridos completos cliente→mesero→producción→cajero).

  Cada subcolección "Al Toro – E2E-NN" es un ESCENARIO: una secuencia ORDENADA de requests  
  que comparten estado vía variables de entorno con prefijo `tmp\*`. A diferencia de las  
  colecciones por-endpoint (independientes por-request), aquí el orden importa: cada request  
  consume lo que el anterior capturó en su `afterResponse`.

  Login autónomo por rol en cada request (emails de entorno: emailCliente, emailMesero,  
  emailCajero, emailCocinero, emailBartender; password `passwordValida`).

  ⚠️ VENTANA HORARIA: todos los escenarios que asignan mesa (E2E-01..E2E-07, E2E-09) requieren  
  correrse entre las 17:00 y 22:00 (hora del servidor) — `POST /api/mesas` valida `LocalTime.now()`.  
  E2E-08 (solo abonos) no depende de la hora.

  ⚠️ SEED EN V3: las reservas ESPECIAL del día (E2E-02/05/06/08) están sembradas en  
  `V3__dev_data.sql` (cliente [paola.rojas@gmail.com](https://mailto:paola.rojas@gmail.com), fechadas HOY). Para tenerlas frescas  
  (cada escenario consume la suya): `docker compose down -v && docker compose up --build`.
