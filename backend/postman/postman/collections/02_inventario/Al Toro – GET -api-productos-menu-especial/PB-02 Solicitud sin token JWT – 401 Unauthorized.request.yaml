$kind: http-request
description: |-
  **Criterio de Aceptación:** PB-02
  **Objetivo:** Verificar que el endpoint de menús especiales rechaza solicitudes que no incluyen token de autorización.
  **Pre-condición:** Ninguna sesión activa requerida.
  **Resultado esperado:** HTTP 401. El sistema no revela información de menús especiales a usuarios no autenticados.
url: "{{baseUrl}}/api/productos/menu-especial"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status 401 – Acceso denegado sin token JWT', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
