$kind: http-request
description: |-
  **Criterio de Aceptación:** MI-13 (HE-04-HU-04-CA-06 FIFO)
  **Objetivo:** Egreso del producto MI-FIFO-Parcial (ID 147, stock=3) con cantidad=2.
  **Lógica FIFO:** stockRestante=1. Comanda 37 (antigua, demanda=1): cubierta, disponible=0.
    Comanda 38 (reciente, demanda=1): 0<1 → notificada. Total: 1 notificada.
  **Pre-condición:** Producto 147 con stock=3. Comandas 37 y 38 PENDIENTE con 1 ítem c/u.
  **Resultado esperado:** HTTP 201, comandasNotificadas = 1.
  **AVISO:** La notificación CAMBIO creada en comanda 38 persiste. Re-ejecución sin flyway reset
    devolverá comandasNotificadas=0 (duplicado bloqueado).
  **Atómica:** afterResponse ejecuta INGRESO compensatorio qty=2 para restaurar stock=3.
url: "{{baseUrl}}/api/inventario/movimientos"
method: POST
headers:
  Authorization: Bearer {{cocineroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productoId": 147,
      "cantidad": 2.000,
      "tipo": "EGRESO",
      "observaciones": "Test FIFO MI-13: primera cubierta segunda no"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('success: true', () => pm.expect(body).to.have.property('success', true));
      pm.test('data.stockActualizado = 1', () => {
        pm.expect(Number(body.data.stockActualizado)).to.eql(1);
      });
      pm.test('data.comandasNotificadas = 1 (FIFO: 2ª no cubierta)', () => {
        pm.expect(body.data.comandasNotificadas).to.eql(1);
      });

      // Compensación: INGRESO para restaurar stock=3
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/inventario/movimientos',
        method: 'POST',
        header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pm.environment.get('cocineroToken') },
        body: { mode: 'raw', raw: JSON.stringify({ productoId: 147, cantidad: 2.000, tipo: 'INGRESO', observaciones: 'Reversa MI-13' }) }
      }, (err, res) => {
        pm.test('Reversa MI-13 restauró stock (201)', () => pm.expect(!err && res && res.code === 201).to.be.true);
      });
    language: text/javascript
order: 1490
