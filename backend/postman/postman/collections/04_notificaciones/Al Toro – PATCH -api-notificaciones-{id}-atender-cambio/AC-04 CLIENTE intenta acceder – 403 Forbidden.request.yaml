$kind: http-request
name: AC-04 CLIENTE intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Verificar que CLIENTE no puede usar este endpoint.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** 403 Forbidden, code=AUTH-002.
url: "{{baseUrl}}/api/notificaciones/1/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('code=AUTH-002', () => {
        pm.expect(pm.response.json().code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 7304
