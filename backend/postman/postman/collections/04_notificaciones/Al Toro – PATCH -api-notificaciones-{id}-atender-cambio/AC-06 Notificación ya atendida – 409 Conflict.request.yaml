$kind: http-request
name: AC-06 Notificación ya atendida – 409 Conflict
description: |-
  > ⚠️ TODO — Test dependiente de seed data
  >
  > Este test no se pudo refactorizar al patrón "create fresh data" porque el flujo prerequisito
  > no expone endpoint público:
  >   - Modificar una comanda existente para disparar notificación CAMBIO automáticamente.
  >
  > Hasta que el endpoint exista, el test:
  >   1. Sigue dependiendo de la notificación seed en V3__dev_data.sql.
  >   2. Puede romperse en runs repetidos.
  >
  > Acción pendiente: cuando se construya el endpoint, refactorizar este test al patrón
  > create-fresh siguiendo `docs/superpowers/plans/2026-05-03-postman-tests-independencia.md`.

  **Objetivo:** Verificar que intentar atender un cambio de una notificación ya ATENDIDA retorna 409.
  **Pre-condición:** AC-01 ya se ejecutó y marcó la notificación como ATENDIDA.
  **Resultado esperado:** 409 Conflict, code=NEG-002.
url: "{{baseUrl}}/api/notificaciones/15/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Independencia de orden: este test debe pasar 409 incluso si AC-01 no se
      // ejecutó previamente. Hacemos login MESERO y pre-atendemos la notificación
      // 15 antes del request principal. La pre-atención acepta 200 (atendida ahora)
      // o 409 (ya estaba atendida) como resultados válidos de setup.
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (loginErr, loginRes) => {
        if (loginErr || !loginRes || loginRes.code !== 200) {
          console.warn('AC-06 setup: login MESERO falló');
          return;
        }
        const token = loginRes.json().accessToken;
        pm.environment.set('meseroToken', token);
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/notificaciones/15/atender-cambio',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + token }
        }, (err, res) => {
          if (err) {
            console.warn('AC-06 setup: pre-atender falló', err);
          } else if (res && res.code !== 200 && res.code !== 409) {
            console.warn('AC-06 setup: pre-atender code', res.code, res.text());
          }
          // 200 = atendida ahora; 409 = ya estaba atendida (idempotent, OK)
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code=NEG-002', () => {
        pm.expect(pm.response.json().code).to.equal('NEG-002');
      });
    language: text/javascript
order: 7306
