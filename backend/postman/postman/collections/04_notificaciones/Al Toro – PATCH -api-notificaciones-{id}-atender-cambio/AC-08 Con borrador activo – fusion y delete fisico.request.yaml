$kind: http-request
name: AC-08 Con borrador activo – fusion y delete fisico
description: |-
  **Objetivo:** Verificar que el flujo de "atender cambio" fusiona los ítems de la comanda
  `PENDIENTE` dentro del borrador activo de la misma visita y estación, y elimina físicamente
  la comanda `PENDIENTE` (la cascada de FK elimina sus ítems, modificaciones y la propia
  notificación).
  **Pre-condición:** `meseroToken` lo provee el `beforeRequest` de colección. Seed HU-02:
  notificación CAMBIO ID 16 sobre comanda 28 (visita 13, COCINA, PENDIENTE) con borrador
  adyacente comanda 26.
  **Resultado esperado:** 200 OK; `data.comandaId == 26` (borrador destino tras la fusión).
url: "{{baseUrl}}/api/notificaciones/{{notificacionIdConBorrador}}/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |
      pm.environment.set('notificacionIdConBorrador', '16');
      pm.environment.set('comandaIdBorradorDestino', '28');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('comandaId resultante corresponde al borrador destino', function () {
        const esperado = Number(pm.environment.get('comandaIdBorradorDestino'));
        pm.expect(pm.response.json().data.comandaId).to.equal(esperado);
      });
    language: text/javascript
order: 7308
