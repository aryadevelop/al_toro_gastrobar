$kind: http-request
name: AC-04 CLIENTE intenta notificar – 403 Forbidden
description: |-
  **Objetivo:** Un cliente no tiene acceso a las notificaciones de producción.
  **Pre-condición:** `clienteToken` lo provee el `beforeRequest` de colección.
  **Resultado esperado:** 403 Forbidden con código AUTH-002.
url: "{{baseUrl}}/api/notificaciones/cambio"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "comandaId": 15
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', function () { pm.response.to.have.status(403); });
      pm.test('Código AUTH-002', function () {
        pm.expect(pm.response.json().code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 5040
