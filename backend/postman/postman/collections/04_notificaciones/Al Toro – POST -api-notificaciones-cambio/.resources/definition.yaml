$kind: collection
name: Al Toro – POST /api/notificaciones/cambio
description: |-
  # POST /api/notificaciones/cambio

  Crea una notificación de tipo CAMBIO sobre una comanda PENDIENTE. El empleado de
  producción (COCINERO o BARTENDER) indica al mesero que desea modificar una comanda
  antes de iniciar su preparación. La estación de la comanda debe coincidir con la del
  usuario autenticado.

  **Control de acceso:**
  - COCINERO: puede notificar sobre comandas de la estación COCINA.
  - BARTENDER: puede notificar sobre comandas de la estación BARRA.
  - Estación ajena o estado incorrecto: 409 NEG-002.
  - MESERO/CAJERO/CLIENTE/ADMIN: 403 AUTH-002.
  - Sin token: 401 Unauthorized.

  **Cuerpo de la solicitud:**
  ```json
  { "comandaId": <número> }
  ```

  **Reglas de negocio:**
  - La comanda debe estar en estado PENDIENTE; cualquier otro estado devuelve 409 NEG-002.
  - Si ya existe una notificación CAMBIO ACTIVA para la misma comanda: 409 NEG-002.
  - Comanda inexistente: 404 ENT-001.
  - Body sin `comandaId`: 422 VAL-001 (mapeado desde MethodArgumentNotValidException).

  **Campos de la respuesta (`data`):**
  - `notificacionId`, `estado`.

  ## Comandas del seed usadas
  Los IDs van fijos en cada request (no dependen de variables de entorno,
  que Postman puede descartar). Provienen del seed `V3__dev_data.sql`:
  - Comanda 30 (COCINA, PENDIENTE): dedicada al AC happy-path.
  - Comanda 13 (COCINA, EN_PREPARACION): comanda operativa reutilizada por el AC de error 409.

  ## Nota sobre idempotencia
  AC-01 crea una notificación ACTIVA. Si se ejecuta dos veces sin reseed, la segunda
  ejecución devuelve 409 NEG-002 (duplicado activo). Para repetir se requiere reseed:
  ```bash
  docker compose down -v && docker compose up --build
  ```

  | ID    | Escenario                                           | HTTP |
  |-------|-----------------------------------------------------|------|
  | AC-01 | COCINERO notifica cambio sobre comanda PENDIENTE    | 201  |
  | AC-02 | Sin token                                           | 401  |
  | AC-03 | MESERO intenta notificar                            | 403  |
  | AC-04 | CLIENTE intenta notificar                           | 403  |
  | AC-05 | Body sin comandaId                                  | 422  |
  | AC-06 | Comanda inexistente                                 | 404  |
  | AC-07 | Comanda no PENDIENTE                                | 409  |

scripts:
  - type: http:beforeRequest
    code: |-
      const logins = [
        { emailKey: 'emailCocinero',  tokenKey: 'cocineroToken'  },
        { emailKey: 'emailBartender', tokenKey: 'bartenderToken' },
        { emailKey: 'emailMesero',    tokenKey: 'meseroToken'    },
        { emailKey: 'emailCajero',    tokenKey: 'cajeroToken'    },
        { emailKey: 'emailCliente',   tokenKey: 'clienteToken'   },
        { emailKey: 'emailAdmin',     tokenKey: 'adminToken'     }
      ];
      const runLogin = (index) => {
        if (index >= logins.length) return;
        const { emailKey, tokenKey } = logins[index];
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: pm.environment.get(emailKey),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })
          }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('notificaciones-cambio pre-request: login ' + emailKey + ' falló');
          } else {
            pm.environment.set(tokenKey, res.json().accessToken);
          }
          runLogin(index + 1);
        });
      };
      runLogin(0);
    language: text/javascript
order: 5000
