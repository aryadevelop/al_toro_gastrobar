$kind: http-request
name: AC-05 Body sin comandaId – 422 Unprocessable
description: |-
  **Objetivo:** Un body sin el campo `comandaId` es rechazado por validación de DTO.
  **Pre-condición:** `cocineroToken` lo provee el `beforeRequest` de colección.
  **Resultado esperado:** 422 Unprocessable Entity con código VAL-001.
url: "{{baseUrl}}/api/notificaciones/cambio"
method: POST
headers:
  Authorization: Bearer {{cocineroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 422', function () { pm.response.to.have.status(422); });
      pm.test('Código VAL-001', function () {
        pm.expect(pm.response.json().code).to.equal('VAL-001');
      });
    language: text/javascript
order: 5050
