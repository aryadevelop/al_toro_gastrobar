$kind: http-request
name: SP-03 Sin token de autenticación – 401 Unauthorized
description: |-
  **Objetivo:** Verificar que la ausencia de token resulta en 401.
  **Pre-condición:** Ninguna. No se envía cabecera Authorization.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/notificaciones/1/servir-platos"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
