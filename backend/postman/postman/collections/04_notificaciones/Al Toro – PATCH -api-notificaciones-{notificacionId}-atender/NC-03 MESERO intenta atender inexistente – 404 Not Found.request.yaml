$kind: http-request
name: NC-03 MESERO intenta atender inexistente – 404 Not Found
description: |-
  **Criterio de Aceptación:** Endpoint valida existencia de notificación.
  **Objetivo:** Verificar manejo correcto de ID inexistente.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/notificaciones/999999/atender"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del MESERO
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('NC-03: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 404 notificación inexistente', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 3000
