$kind: http-request
name: NC-01 MESERO atiende solicitud activa – 200 OK
description: |-
  **Criterio de Aceptación:** CA-05 — Mesero puede marcar solicitud de asistencia como atendida.
  **Objetivo:** Verificar atención exitosa de notificación.
  **Resultado esperado:** 200 OK. Evento WS `AsistenciaAtendidaWsMessage` publicado al cliente.
  **Efecto observable:** GET /api/visitas/activa mostrará asistenciaSolicitada=false (validado en NC-05).
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // ---------------------------------------------------------------------------
      // Cadena de setup independiente:
      //   1) Login CLIENTE
      //   2) Login MESERO
      //   3) Si ya existe asistencia activa, atenderla con MESERO (limpieza)
      //   4) CLIENTE solicita asistencia → captura notificacionId en tmpNotificacionId
      // ---------------------------------------------------------------------------
      const baseUrl = pm.environment.get('baseUrl');
      const password = pm.environment.get('passwordValida');

      const login = (emailKey, tokenKey, cb) => {
        pm.sendRequest({
          url: baseUrl + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: pm.environment.get(emailKey),
              password: password,
              forceSessionOverride: true
            })
          }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('NC-01: login ' + emailKey + ' falló', err, res && res.code);
            return;
          }
          pm.environment.set(tokenKey, res.json().accessToken);
          cb();
        });
      };

      const solicitarAsistencia = (visitaId, clienteToken) => {
        pm.sendRequest({
          url: baseUrl + '/api/visitas/' + visitaId + '/asistencia',
          method: 'POST',
          header: { 'Authorization': 'Bearer ' + clienteToken }
        }, (err, res) => {
          if (err || !res || res.code !== 201) {
            console.warn('NC-01: POST asistencia falló', err, res && res.code, res && res.text());
            return;
          }
          const notifId = res.json().data.notificacionId;
          pm.environment.set('tmpNotificacionId', notifId);
        });
      };

      const obtenerVisitaYSolicitar = (clienteToken) => {
        pm.sendRequest({
          url: baseUrl + '/api/visitas/activa',
          method: 'GET',
          header: { 'Authorization': 'Bearer ' + clienteToken }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('NC-01: GET /visitas/activa falló', err, res && res.code);
            return;
          }
          const estado = res.json().data;
          const visitaId = estado.visitaId;

          // Si ya hay asistencia activa, atenderla primero con MESERO para liberar la mesa
          if (estado.asistenciaSolicitada && estado.notificacionAsistenciaId) {
            const meseroToken = pm.environment.get('meseroToken');
            pm.sendRequest({
              url: baseUrl + '/api/notificaciones/' + estado.notificacionAsistenciaId + '/atender',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + meseroToken }
            }, () => {
              solicitarAsistencia(visitaId, clienteToken);
            });
          } else {
            solicitarAsistencia(visitaId, clienteToken);
          }
        });
      };

      login('emailCliente', 'clienteToken', () => {
        login('emailMesero', 'meseroToken', () => {
          const clienteToken = pm.environment.get('clienteToken');
          obtenerVisitaYSolicitar(clienteToken);
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El MESERO atiende la solicitud con 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('El mensaje confirma que fue atendida', function () {
        const body = pm.response.json();
        pm.expect(body.message).to.include('atendida');
      });
      pm.environment.unset('tmpNotificacionId');
    language: text/javascript
order: 1000
