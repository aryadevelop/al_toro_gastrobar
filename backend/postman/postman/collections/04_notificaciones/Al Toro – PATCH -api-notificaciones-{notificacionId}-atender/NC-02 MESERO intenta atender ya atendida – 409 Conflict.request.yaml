$kind: http-request
name: NC-02 MESERO intenta atender ya atendida – 409 Conflict
description: |-
  **Criterio de Aceptación:** No se puede atender una notificación ya atendida.
  **Objetivo:** Verificar validación de estado de notificación.
  **Resultado esperado:** 409 Conflict.
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // ---------------------------------------------------------------------------
      // Cadena de setup independiente:
      //   1) Login CLIENTE
      //   2) Login MESERO
      //   3) Si ya existe asistencia activa, atenderla con MESERO (limpieza)
      //   4) CLIENTE solicita asistencia → captura notificacionId en tmpNotificacionId
      //   5) MESERO atiende la notificación una vez (para forzar el conflicto en el request bajo prueba)
      // ---------------------------------------------------------------------------
      const baseUrl = pm.environment.get('baseUrl');
      const password = pm.environment.get('passwordValida');

      const login = (emailKey, tokenKey, cb) => {
        pm.sendRequest({
          url: baseUrl + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: pm.environment.get(emailKey),
              password: password,
              forceSessionOverride: true
            })
          }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('NC-02: login ' + emailKey + ' falló', err, res && res.code);
            return;
          }
          pm.environment.set(tokenKey, res.json().accessToken);
          cb();
        });
      };

      const atenderUnaVez = (notifId, meseroToken, cb) => {
        pm.sendRequest({
          url: baseUrl + '/api/notificaciones/' + notifId + '/atender',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + meseroToken }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('NC-02: PATCH atender previo falló', err, res && res.code);
          }
          cb();
        });
      };

      const solicitarAsistencia = (visitaId, clienteToken, meseroToken) => {
        pm.sendRequest({
          url: baseUrl + '/api/visitas/' + visitaId + '/asistencia',
          method: 'POST',
          header: { 'Authorization': 'Bearer ' + clienteToken }
        }, (err, res) => {
          if (err || !res || res.code !== 201) {
            console.warn('NC-02: POST asistencia falló', err, res && res.code, res && res.text());
            return;
          }
          const notifId = res.json().data.notificacionId;
          pm.environment.set('tmpNotificacionId', notifId);
          // Atender la notificación para que el request bajo prueba reciba 409
          atenderUnaVez(notifId, meseroToken, () => {});
        });
      };

      const obtenerVisitaYSolicitar = (clienteToken, meseroToken) => {
        pm.sendRequest({
          url: baseUrl + '/api/visitas/activa',
          method: 'GET',
          header: { 'Authorization': 'Bearer ' + clienteToken }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('NC-02: GET /visitas/activa falló', err, res && res.code);
            return;
          }
          const estado = res.json().data;
          const visitaId = estado.visitaId;

          if (estado.asistenciaSolicitada && estado.notificacionAsistenciaId) {
            pm.sendRequest({
              url: baseUrl + '/api/notificaciones/' + estado.notificacionAsistenciaId + '/atender',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + meseroToken }
            }, () => {
              solicitarAsistencia(visitaId, clienteToken, meseroToken);
            });
          } else {
            solicitarAsistencia(visitaId, clienteToken, meseroToken);
          }
        });
      };

      login('emailCliente', 'clienteToken', () => {
        login('emailMesero', 'meseroToken', () => {
          const clienteToken = pm.environment.get('clienteToken');
          const meseroToken = pm.environment.get('meseroToken');
          obtenerVisitaYSolicitar(clienteToken, meseroToken);
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 409 notificación ya atendida', function () {
        pm.response.to.have.status(409);
      });
      pm.test('El mensaje indica que ya fue atendida', function () {
        const body = pm.response.json();
        pm.expect(body.message).to.match(/atendida|estado/i);
      });
      pm.environment.unset('tmpNotificacionId');
    language: text/javascript
order: 2000
