$kind: http-request
description: |-
  **Criterio de Aceptación:** Control de acceso por rol — ADM sin restricción de propiedad
  **Objetivo:** Verificar que un usuario con rol ADM puede consultar el historial de visitas de cualquier cliente sin restricción de propiedad.
  **Pre-condición:** `emailCliente` (andres.morales) tiene al menos una visita registrada en V3__dev_data.sql (visita_id=1 y visita_id=11).
  **Resultado esperado:** 200 OK · `data` es array no vacío.
url: "{{baseUrl}}/api/visitas/cliente/historial?emailCliente={{emailCliente}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna 200 cuando ADM consulta historial de otro cliente', function() {
        pm.response.to.have.status(200);
      });
      pm.test('ADM recibe la lista de visitas del cliente consultado', function() {
        pm.expect(pm.response.json().data).to.be.an('array').with.lengthOf.above(0);
      });
    language: text/javascript
order: 6000
