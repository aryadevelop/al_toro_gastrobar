$kind: http-request
name: AC-05 Visita inexistente – 404 Not Found
url: "{{baseUrl}}/api/visitas/999999/cliente?clienteId=11"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
queryParams:
  clienteId: "11"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Visita inexistente → 404', function () {
        pm.response.to.have.status(404);
      });
      pm.test('code = ENT-001', function () {
        pm.expect(pm.response.json().code).to.equal('ENT-001');
      });
    language: text/javascript
order: 5000
