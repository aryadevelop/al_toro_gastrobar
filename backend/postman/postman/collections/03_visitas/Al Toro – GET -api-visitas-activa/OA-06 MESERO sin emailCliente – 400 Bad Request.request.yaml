$kind: http-request
name: OA-06 MESERO sin emailCliente – 400 Bad Request
description: |-
  **Criterio de Aceptación:** Empleados deben especificar emailCliente en el parámetro.
  **Objetivo:** Verificar que sin el parámetro requerido se rechaza con 400.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 400 Bad Request.
url: "{{baseUrl}}/api/visitas/activa"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del MESERO
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('OA-06: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 400 cuando falta emailCliente', function () {
        pm.response.to.have.status(400);
      });
      pm.test('El mensaje indica que el parámetro es requerido', function () {
        const body = pm.response.json();
        pm.expect(body.message).to.include('emailCliente');
      });
    language: text/javascript
order: 6000
