$kind: http-request
name: AJ-01 Sin token – 401 Unauthorized
url: "{{baseUrl}}/api/visitas/19/items"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "items": [ { "comandaItemId": 1, "cantidad": 2 } ], "eliminados": [] }
scripts:
