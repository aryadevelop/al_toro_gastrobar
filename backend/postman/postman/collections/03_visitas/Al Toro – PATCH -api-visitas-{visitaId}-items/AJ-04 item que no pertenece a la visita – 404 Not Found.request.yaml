$kind: http-request
name: AJ-04 item que no pertenece a la visita – 404 Not Found
description: comandaItemId 999999 no pertenece a la visita 19 → 404 (ENT-001).
url: "{{baseUrl}}/api/visitas/19/items"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    { "items": [ { "comandaItemId": 999999, "cantidad": 2 } ] }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Ítem foráneo → 404', function () {
        pm.response.to.have.status(404);
      });
      pm.test('code = ENT-001', function () {
        pm.expect(pm.response.json().code).to.equal('ENT-001');
      });
    language: text/javascript
order: 4000
