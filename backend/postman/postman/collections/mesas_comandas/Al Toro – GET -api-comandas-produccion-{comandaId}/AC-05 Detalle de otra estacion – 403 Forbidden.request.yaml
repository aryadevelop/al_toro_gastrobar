$kind: http-request
name: AC-05 Detalle de otra estacion – 403 Forbidden
description: |-
  **Objetivo:** Un cocinero intenta consultar una comanda de BARRA y recibe 403.
  **Pre-condición:** `cocineroToken` lo provee el `beforeRequest` de colección;
  `comandaIdBarraVisible` apunta a una comanda visible de la estación BARRA.
  **Resultado esperado:** 403 Forbidden con código AUTH-002.
url: "{{baseUrl}}/api/comandas/produccion/{{comandaIdBarraVisible}}"
method: GET
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('comandaIdBarraVisible')) {
        pm.environment.set('comandaIdBarraVisible', '14');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', function () { pm.response.to.have.status(403); });
      pm.test('Código AUTH-002', function () {
        pm.expect(pm.response.json().code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 2050
