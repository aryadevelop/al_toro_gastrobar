$kind: http-request
name: AC-03 Sin token – 401 Unauthorized
description: |-
  **Objetivo:** Sin header Authorization el endpoint rechaza la solicitud.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/comandas/produccion/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', function () { pm.response.to.have.status(401); });
