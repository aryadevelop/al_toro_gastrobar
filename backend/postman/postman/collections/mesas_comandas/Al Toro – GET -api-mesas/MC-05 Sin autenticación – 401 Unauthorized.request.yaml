$kind: http-request
name: MC-05 Sin autenticación – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** CA-08 — Endpoint requiere autenticación.
  **Objetivo:** Verificar que el sistema rechaza solicitudes sin token JWT.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/mesas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 401', function () {
        pm.response.to.have.status(401);
      });

      pm.test('La respuesta indica autenticación requerida', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
      });
    language: text/javascript
order: 1040
