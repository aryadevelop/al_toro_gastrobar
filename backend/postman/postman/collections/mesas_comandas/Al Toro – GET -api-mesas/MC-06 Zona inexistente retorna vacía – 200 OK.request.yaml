$kind: http-request
name: MC-06 Zona inexistente retorna vacía – 200 OK
description: |-
  **Criterio de Aceptación:** CA-03 — Zonas sin mesas activas aparecen con array vacío.
  **Objetivo:** Verificar que zonaId inexistente (999) retorna 200 con array vacío.
  **Pre-condición:** `meseroToken` disponible. Zona ID 999 no existe.
  **Resultado esperado:** 200 OK con zonas[] vacío o con zona que tiene mesas[] vacío.
url: "{{baseUrl}}/api/mesas?zonaId=999"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del MESERO usando variables de entorno
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('MC-06: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('La respuesta contiene zonas vacías o sin mesas', function () {
        const body = pm.response.json();
        pm.expect(body.data.zonas).to.be.an('array');
        // Zona inexistente no aparece O aparece sin mesas
        if (body.data.zonas.length > 0) {
          const zona = body.data.zonas[0];
          pm.expect(zona.mesas).to.be.an('array');
          pm.expect(zona.mesas.length).to.equal(0);
        } else {
          pm.expect(body.data.zonas.length).to.equal(0);
        }
      });
    language: text/javascript
order: 1050
