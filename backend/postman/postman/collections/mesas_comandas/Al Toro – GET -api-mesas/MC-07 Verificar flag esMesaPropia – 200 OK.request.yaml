$kind: http-request
name: MC-07 Verificar flag esMesaPropia – 200 OK
description: |-
  **Criterio de Aceptación:** CA-04 — Mesa propia del mesero se identifica con esMesaPropia=true.
  **Objetivo:** Verificar que mesas del mesero autenticado tienen esMesaPropia=true y nombreMesero=null (RN-04).
  **Pre-condición:** `meseroToken` disponible. Mesero tiene mesas asignadas.
  **Resultado esperado:** 200 OK con al menos una mesa propia donde esMesaPropia=true y nombreMesero=null.
url: "{{baseUrl}}/api/mesas"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del MESERO usando variables de entorno
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('MC-07: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('RN-04: Mesas propias tienen esMesaPropia=true y nombreMesero=null', function () {
        const body = pm.response.json();
        const emailMesero = pm.environment.get('emailMesero');

        // Buscar mesas propias
        let mesasEncontradas = 0;
        body.data.zonas.forEach(zona => {
          zona.mesas.forEach(mesa => {
            if (mesa.emailMesero === emailMesero) {
              mesasEncontradas++;
              pm.expect(mesa.esMesaPropia).to.be.true;
              pm.expect(mesa.nombreMesero).to.be.null;
            }
          });
        });

        // Verificar que encontramos al menos una mesa propia
        pm.expect(mesasEncontradas).to.be.greaterThan(0);
      });

      pm.test('RN-04: Mesas ajenas tienen esMesaPropia=false y nombreMesero presente', function () {
        const body = pm.response.json();
        const emailMesero = pm.environment.get('emailMesero');

        // Buscar mesas ajenas
        body.data.zonas.forEach(zona => {
          zona.mesas.forEach(mesa => {
            if (mesa.emailMesero !== emailMesero) {
              pm.expect(mesa.esMesaPropia).to.be.false;
              pm.expect(mesa.nombreMesero).to.not.be.null;
            }
          });
        });
      });
    language: text/javascript
order: 1060
