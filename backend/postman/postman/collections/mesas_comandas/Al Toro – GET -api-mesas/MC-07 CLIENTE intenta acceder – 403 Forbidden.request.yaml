$kind: http-request
name: MC-07 CLIENTE intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Verificar que rol CLIENTE no tiene acceso al endpoint de mapa (solo staff).
  **Pre-condición:** `clienteToken` disponible. Endpoint requiere MESERO o ADMIN.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/mesas"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del CLIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        } else {
          console.warn('MC-07: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 403 cuando CLIENTE intenta acceder', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 7000
