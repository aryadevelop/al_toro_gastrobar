$kind: http-request
name: MC-08 Segunda llamada retorna datos consistentes – 200 OK
description: |-
  **Objetivo:** Verificar idempotencia — llamadas sucesivas retornan datos consistentes.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 200 OK con datos consistentes en ambas llamadas.
url: "{{baseUrl}}/api/mesas"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del MESERO
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);

          // Primera llamada al endpoint para guardar snapshot
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/mesas',
            method: 'GET',
            header: { 'Authorization': 'Bearer ' + token }
          }, (err2, res2) => {
            if (!err2 && res2 && res2.code === 200) {
              pm.environment.set('tmpPrimeraLlamada', JSON.stringify(res2.json().data));
            }
          });
        } else {
          console.warn('MC-08: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200 en segunda llamada', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Los datos son consistentes entre llamadas', function () {
        const primeraLlamada = JSON.parse(pm.environment.get('tmpPrimeraLlamada'));
        const segundaLlamada = pm.response.json().data;

        pm.expect(segundaLlamada.zonas.length).to.equal(primeraLlamada.zonas.length);

        // Verificar que las zonas tienen la misma cantidad de mesas
        segundaLlamada.zonas.forEach((zona, index) => {
          pm.expect(zona.cantidadMesasActivas).to.equal(primeraLlamada.zonas[index].cantidadMesasActivas);
        });
      });

      // Cleanup
      pm.environment.unset('tmpPrimeraLlamada');
    language: text/javascript
order: 8000
