$kind: http-request
name: MD-03 ADMIN obtiene detalle de mesa – 200 OK
description: |-
  **Objetivo:** Verificar que rol ADMIN tiene acceso al endpoint.
  **Pre-condición:** `adminToken` disponible. Visita 10 está activa.
  **Resultado esperado:** 200 OK con detalle completo.
url: "{{baseUrl}}/api/mesas/10/detalle"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del ADMIN
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailAdmin'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('adminToken', res.json().accessToken);
        } else {
          console.warn('MD-03: login ADMIN falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200 para ADMIN', function () {
        pm.response.to.have.status(200);
      });

      pm.test('La respuesta contiene detalle completo', function () {
        const body = pm.response.json();
        pm.expect(body.data).to.have.property('mesaId');
        pm.expect(body.data).to.have.property('visitaId');
      });
    language: text/javascript
order: 3000
