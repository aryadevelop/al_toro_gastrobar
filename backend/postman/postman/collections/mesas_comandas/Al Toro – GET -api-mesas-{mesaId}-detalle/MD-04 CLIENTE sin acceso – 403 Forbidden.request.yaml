$kind: http-request
name: MD-04 CLIENTE sin acceso – 403 Forbidden
description: |-
  **Criterio de Aceptación:** CA-08 — Solo MESERO y ADMIN tienen acceso.
  **Objetivo:** Verificar que CLIENTE recibe 403 Forbidden.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** 403 Forbidden con código AUTH-002.
url: "{{baseUrl}}/api/mesas/1/detalle"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del CLIENTE usando variables de entorno
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        } else {
          console.warn('MD-04: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 403', function () {
        pm.response.to.have.status(403);
      });

      pm.test('La respuesta contiene código de error AUTH-002', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
        pm.expect(body.code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 2030
