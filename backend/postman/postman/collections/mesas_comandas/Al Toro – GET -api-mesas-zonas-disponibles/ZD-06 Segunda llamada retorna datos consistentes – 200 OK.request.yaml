$kind: http-request
name: ZD-06 Segunda llamada retorna datos consistentes – 200 OK
description: |-
  **Criterio:** CA-06 — Idempotencia: múltiples llamadas retornan datos consistentes.
  **Objetivo:** Verificar que el endpoint es idempotente y retorna el mismo estado.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 200 OK con datos consistentes entre llamadas.
url: "{{baseUrl}}/api/mesas/zonas-disponibles"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('La respuesta contiene success=true', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(true);
      });

      pm.test('El campo data es un array', function () {
        const body = pm.response.json();
        pm.expect(body.data).to.be.an('array');
      });

      pm.test('Los datos son consistentes con llamadas previas', function () {
        const body = pm.response.json();
        // Verificar que la estructura se mantiene
        if (body.data.length > 0) {
          const zona = body.data[0];
          pm.expect(zona).to.have.property('zonaId');
          pm.expect(zona).to.have.property('zonaNombre');
          pm.expect(zona).to.have.property('capacidadTotal');
          pm.expect(zona).to.have.property('personasOcupadas');
          pm.expect(zona).to.have.property('disponibilidad');

          // Verificar cálculo correcto
          const disponibilidadEsperada = zona.capacidadTotal - zona.personasOcupadas;
          pm.expect(zona.disponibilidad).to.equal(disponibilidadEsperada);
        }
      });
    language: text/javascript
order: 6000
