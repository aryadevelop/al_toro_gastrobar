$kind: collection
name: Al Toro – GET /api/mesas/zonas-disponibles
description: |-
  # GET /api/mesas/zonas-disponibles

  Retorna listado de zonas con disponibilidad calculada en tiempo real.

  **Criterios de Aceptación cubiertos:**
  - CA-01: Listar zonas con capacidad disponible
  - CA-02: Validar acceso por rol

  **Control de acceso:**
  - MESERO/ADMIN: acceso permitido
  - CAJERO/CLIENTE: 403 Forbidden
  - Sin token: 401 Unauthorized

  **Campos de ZonaDisponibleMesaResponse:**
  - zonaId: ID de la zona
  - zonaNombre: Nombre descriptivo
  - capacidadTotal: Capacidad máxima de personas
  - personasOcupadas: Personas actualmente en mesas activas
  - disponibilidad: Capacidad restante (capacidadTotal - personasOcupadas)

  ## Independencia de datos

  - **Tokens:** login secuencial encadenado en `beforeRequest` de colección (MESERO, ADMIN, CAJERO, CLIENTE).
  - **Zonas seed:** IDs 1-7 (Salón Principal, Terraza, VIP, Barra, Jardín, Sala Privada, Zona Romántica).

  | ID | Escenario | HTTP |
  |----|-----------|------|
  | ZD-01 | MESERO obtiene zonas disponibles — 200 OK | 200 |
  | ZD-02 | ADMIN obtiene zonas disponibles — 200 OK | 200 |
  | ZD-03 | CAJERO intenta acceder — 403 Forbidden | 403 |
  | ZD-04 | CLIENTE intenta acceder — 403 Forbidden | 403 |
  | ZD-05 | Sin token de autenticación — 401 Unauthorized | 401 |
  | ZD-06 | Segunda llamada retorna datos consistentes (idempotencia) | 200 |

scripts:
  - type: http:beforeRequest
    code: |-
      // ---------------------------------------------------------------------------
      // Login secuencial de roles requeridos: MESERO, ADMIN, CAJERO, CLIENTE
      // ---------------------------------------------------------------------------
      const logins = [
        { emailKey: 'emailMesero',  tokenKey: 'meseroToken'  },
        { emailKey: 'emailAdmin',   tokenKey: 'adminToken'   },
        { emailKey: 'emailCajero',  tokenKey: 'cajeroToken'  },
        { emailKey: 'emailCliente', tokenKey: 'clienteToken' }
      ];

      const runLogin = (index) => {
        if (index >= logins.length) return;
        const { emailKey, tokenKey } = logins[index];
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: pm.environment.get(emailKey),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })
          }
        }, (err, res) => {
          if (err || !res || res.code !== 200) {
            console.warn('ZD pre-request: login ' + emailKey + ' falló', err, res && res.code);
          } else {
            pm.environment.set(tokenKey, res.json().accessToken);
          }
          runLogin(index + 1);
        });
      };
      runLogin(0);
    language: text/javascript
order: 1100
