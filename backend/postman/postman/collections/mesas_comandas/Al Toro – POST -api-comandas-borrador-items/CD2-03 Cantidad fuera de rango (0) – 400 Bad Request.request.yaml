$kind: http-request
name: CD2-03 Cantidad fuera de rango (0) – 400 Bad Request
description: |-
  **Objetivo:** Verificar la validación `@Min(1)` en cantidad.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 400 Bad Request con `code = VAL-001`.
url: "{{baseUrl}}/api/comandas/borrador/items"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "visitaId": 15,
      "productoId": 143,
      "cantidad": 0
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        }) }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 422', function () {
        pm.response.to.have.status(422);
      });

      pm.test('Código de error es VAL-001', function () {
        pm.expect(pm.response.json().code).to.equal('VAL-001');
      });
    language: text/javascript
order: 1020
