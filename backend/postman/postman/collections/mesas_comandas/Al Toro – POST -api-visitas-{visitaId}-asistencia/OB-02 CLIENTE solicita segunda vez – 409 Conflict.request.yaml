$kind: http-request
name: OB-02 CLIENTE solicita segunda vez – 409 Conflict
description: |-
  **Criterio de Aceptación:** CA-04 — No se puede duplicar solicitud mientras haya una activa.
  **Objetivo:** Verificar que el endpoint rechaza duplicación de solicitud.
  **Pre-condición:** OB-01 debe ejecutarse primero para crear la solicitud inicial.
  **Resultado esperado:** 409 Conflict.
url: "{{baseUrl}}/api/visitas/12/asistencia"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo del mismo CLIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'juan.torres@gmail.com',
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        } else {
          console.warn('OB-02: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza duplicación con 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('El mensaje indica que ya existe solicitud activa', function () {
        const body = pm.response.json();
        pm.expect(body.message).to.include('solicitud');
        pm.expect(body.message).to.include('activa');
      });
    language: text/javascript
order: 2000
