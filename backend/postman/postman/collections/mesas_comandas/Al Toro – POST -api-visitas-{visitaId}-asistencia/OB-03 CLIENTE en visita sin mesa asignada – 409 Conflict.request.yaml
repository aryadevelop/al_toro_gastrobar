$kind: http-request
name: OB-03 CLIENTE en visita sin mesa asignada – 409 Conflict
description: |-
  **Criterio de Aceptación:** No se puede solicitar asistencia sin mesa asignada.
  **Objetivo:** Verificar validación de mesa asignada antes de crear notificación.
  **Resultado esperado:** 409 Conflict (ó 404 si la visita no existe en el seed actual).
  **Independencia:** Cada ejecución usa un visitaId que no tiene mesa o no existe — el endpoint rechaza antes de mutar estado, así no hay efectos colaterales que limpiar.
  **Limitación conocida:** No existe un endpoint para crear visitas sin mesa, por lo que este caso depende de seed data específico (visita sin mesa). Mientras no exista, se acepta tanto 404 como 409 como resultado válido.
url: "{{baseUrl}}/api/visitas/{{tmpVisitaSinMesa}}/asistencia"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login y creación de visita sin mesa
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'valentina.cruz@gmail.com',
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
          // TODO: Crear visita sin mesa vía endpoint auxiliar o SQL
          // Por ahora usar ID fijo del seed (requiere migración adicional)
          pm.environment.set('tmpVisitaSinMesa', '999');
        } else {
          console.warn('OB-03: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza solicitud sin mesa asignada con 409', function () {
        // Si tmpVisitaSinMesa=999 (no existe), obtendremos 404 en lugar de 409
        const status = pm.response.code;
        if (status === 404) {
          console.warn('OB-03: Se requiere seed data con visita sin mesa. Crear migración V7 o endpoint auxiliar.');
        }
        pm.expect(status).to.be.oneOf([404, 409]);
      });
      pm.environment.unset('tmpVisitaSinMesa');
    language: text/javascript
order: 3000
