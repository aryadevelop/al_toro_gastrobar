$kind: http-request
name: AM-12 reserva inexistente – 404 Not Found
description: |-
  **Criterio:** CA-12 — Validación de negocio: reserva debe existir si se proporciona reservaId.
  **Objetivo:** Verificar que el sistema rechaza asignación con reservaId inexistente.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 404 Not Found con código ENT-001.
url: "{{baseUrl}}/api/mesas"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "mesaIdentificador": "TEST-RES-INV",
      "zonaId": 1,
      "numeroPersonas": 2,
      "reservaId": 9999
    }
scripts:
  - type: beforeRequest
    code: |-
      // Autonomous login using environment variables
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('AM-12: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 404', function () {
        pm.response.to.have.status(404);
      });

      pm.test('La respuesta contiene success=false', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(false);
      });

      pm.test('El código de error es ENT-001', function () {
        const body = pm.response.json();
        pm.expect(body.code).to.equal('ENT-001');
      });

      pm.test('El mensaje describe el error de reserva inexistente', function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property('message');
        pm.expect(body.message).to.be.a('string');
      });

      // NO cleanup - no se creó ningún recurso
    language: text/javascript
order: 12000
