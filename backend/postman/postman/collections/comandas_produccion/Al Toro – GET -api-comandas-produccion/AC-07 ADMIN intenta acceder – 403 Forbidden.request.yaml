$kind: http-request
name: AC-07 ADMIN intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Un usuario con rol ADMIN recibe 403 porque el tablero exige rol funcional PRODUCCION.
  **Pre-condición:** `adminToken` lo provee el `beforeRequest` de colección.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/comandas/produccion"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 1070
