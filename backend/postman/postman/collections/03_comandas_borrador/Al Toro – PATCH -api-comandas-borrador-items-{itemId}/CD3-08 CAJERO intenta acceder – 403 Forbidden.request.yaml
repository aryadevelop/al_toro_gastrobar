$kind: http-request
name: CD3-08 CAJERO intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Verificar que un usuario con rol CAJERO recibe 403.
  **Pre-condición:** `cajeroToken` disponible.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/comandas/borrador/items/{{itemPicanhaBaseId}}"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cantidad": 1
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCajero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        }) }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 403', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 1070
