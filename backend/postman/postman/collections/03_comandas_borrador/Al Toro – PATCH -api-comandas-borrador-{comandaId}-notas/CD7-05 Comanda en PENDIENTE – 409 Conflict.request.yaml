$kind: http-request
name: CD7-05 Comanda en PENDIENTE – 409 Conflict
description: |-
  **Objetivo:** Verificar que actualizar notas de una comanda no-BORRADOR devuelve NEG-002.
  **Pre-condición:** beforeRequest crea una comanda BORRADOR, la envía a producción (queda PENDIENTE) y guarda su id en `cd705ComandaId`.
  **Resultado esperado:** 409 Conflict con `code = NEG-002`.
url: "{{baseUrl}}/api/comandas/borrador/{{cd705ComandaId}}/notas"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "notas": "Intento sobre PENDIENTE"
    }
scripts:
  - type: beforeRequest
    code: |-
      const unique = 'E7-CD7-05-' + Date.now();
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        }) }
      }, (err1, res1) => {
        if (err1 || !res1 || res1.code !== 200) return;
        const token = res1.json().accessToken;
        pm.environment.set('meseroToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/comandas/borrador/items',
          method: 'POST',
          header: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({
            visitaId: 14,
            productoId: Number(pm.environment.get('productoTestPlatoId')),
            cantidad: 1,
            descripcion: unique
          }) }
        }, (err2, res2) => {
          if (err2 || !res2 || res2.code !== 200) return;
          const comandaId = res2.json().data.comandaCocinaId;
          if (!comandaId) return;
          pm.environment.set('cd705ComandaId', comandaId);

          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/comandas/borrador/' + comandaId + '/enviar',
            method: 'POST',
            header: { 'Authorization': 'Bearer ' + token }
          }, (err3, res3) => {
            if (err3 || !res3 || res3.code !== 200) {
              console.warn('CD7-05: enviar falló', err3, res3 && res3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 409', function () {
        pm.response.to.have.status(409);
      });

      pm.test('Código de error es NEG-002', function () {
        pm.expect(pm.response.json().code).to.equal('NEG-002');
      });
    language: text/javascript
order: 1040
