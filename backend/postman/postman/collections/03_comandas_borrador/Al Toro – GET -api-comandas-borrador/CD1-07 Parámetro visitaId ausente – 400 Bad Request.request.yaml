$kind: http-request
name: CD1-07 Parámetro visitaId ausente – 400 Bad Request
description: |-
  **Objetivo:** Verificar que Spring rechaza la solicitud cuando el `@RequestParam visitaId` obligatorio falta.
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 400 Bad Request.
url: "{{baseUrl}}/api/comandas/borrador"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        } else {
          console.warn('CD1-07: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 400', function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 1060
