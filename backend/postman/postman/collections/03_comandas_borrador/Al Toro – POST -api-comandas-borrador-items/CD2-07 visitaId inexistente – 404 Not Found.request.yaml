$kind: http-request
name: CD2-07 visitaId inexistente – 404 Not Found
description: |-
  **Objetivo:** Verificar que una visita inexistente devuelve ENT-001 (validarOwnership).
  **Pre-condición:** `meseroToken` disponible.
  **Resultado esperado:** 404 Not Found con `code = ENT-001`.
url: "{{baseUrl}}/api/comandas/borrador/items"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "visitaId": 999999,
      "productoId": 143,
      "cantidad": 1
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailMesero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        }) }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 404', function () {
        pm.response.to.have.status(404);
      });

      pm.test('Código de error es ENT-001', function () {
        pm.expect(pm.response.json().code).to.equal('ENT-001');
      });
    language: text/javascript
order: 1060
