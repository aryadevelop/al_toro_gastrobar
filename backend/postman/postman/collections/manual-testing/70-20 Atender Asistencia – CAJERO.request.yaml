$kind: http-request
name: 70-20 Atender Asistencia – CAJERO
description: Marcar solicitud de asistencia como atendida (rol CAJERO)
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender"
method: PATCH
headers:
  Authorization: Bearer {{tmpCajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('tmpNotificacionId', '1');

      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cajero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpNotificacionId');
      pm.environment.unset('tmpCajeroToken');
    language: text/javascript
order: 7200
