$kind: http-request
name: 20-03 Crear Reserva – CLIENTE
description: Crear nueva reserva con pre-orden (incluye todos los campos del DTO)
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{tmpClienteToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailCliente": null,
      "fechaHoraLlegada": "2026-04-29T19:23:00",
      "numeroPersonas": 12,
      "zonaId": 1,
      "decoracionId": 6,
      "notas": "Reserva de prueba manual con pre-orden completa",
      "preOrden": [
        {
          "productoId": 50,
          "cantidad": 3,
          "descripcion": null,
          "esMenuEspecial": false,
          "opcionesModificacion": null
        },
        {
          "productoId": 15,
          "cantidad": 2,
          "descripcion": "Sin cebolla",
          "esMenuEspecial": false,
          "opcionesModificacion": null
        }
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'andres.morales@gmail.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpClienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpClienteToken');
    language: text/javascript
order: 2030
