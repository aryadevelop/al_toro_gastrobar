$kind: http-request
name: 10-04 Get Menu Especial
description: Obtener menús especiales con opciones de modificación
url: "{{baseUrl}}/api/productos/menu-especial"
method: GET
headers:
  Authorization: Bearer {{tmpClienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'andres.morales@gmail.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpClienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpClienteToken');
    language: text/javascript
order: 1040
