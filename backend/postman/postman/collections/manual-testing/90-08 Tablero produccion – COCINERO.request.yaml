$kind: http-request
name: 90-08 Tablero produccion – COCINERO
description: Carga el tablero de comandas pendientes/en preparación/listas del cocinero
url: "{{baseUrl}}/api/comandas/produccion"
method: GET
headers:
  Authorization: Bearer {{tmpCocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cocinero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCocineroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpCocineroToken');
    language: text/javascript
order: 8010
