$kind: http-request
name: 70-07 Notificar cambio – COCINERO
description: El personal de producción registra una notificación CAMBIO sobre una comanda PENDIENTE (CA-02).
url: "{{baseUrl}}/api/notificaciones/cambio"
method: POST
headers:
  Authorization: Bearer {{tmpCocineroToken}}
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "comandaId": {{tmpComandaId}}
    }
scripts:
  - type: beforeRequest
    code: |-
      // Ajustar al ID de una comanda PENDIENTE de la estación COCINA
      pm.environment.set('tmpComandaId', '1');

      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cocinero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCocineroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpComandaId');
      pm.environment.unset('tmpCocineroToken');
    language: text/javascript
order: 7070
