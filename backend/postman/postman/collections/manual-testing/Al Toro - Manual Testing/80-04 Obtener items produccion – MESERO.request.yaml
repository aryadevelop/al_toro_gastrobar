$kind: http-request
name: 80-04 Obtener items produccion – MESERO
description: Obtiene items en producción de una mesa (visitaId=1)
url: "{{baseUrl}}/api/mesas/{{tmpVisitaId}}/items-produccion"
method: GET
headers:
  Authorization: Bearer {{tmpMeseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Configurar visitaId temporal (usar ID conocido de seed)
      pm.environment.set('tmpVisitaId', '1');

      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'mesero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpMeseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpVisitaId');
      pm.environment.unset('tmpMeseroToken');
    language: text/javascript
order: 8040
