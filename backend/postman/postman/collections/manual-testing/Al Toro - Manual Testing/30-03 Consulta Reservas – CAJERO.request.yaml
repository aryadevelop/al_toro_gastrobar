$kind: http-request
name: 30-03 Consulta Reservas – CAJERO
description: |-
  Consulta de reservas con vista de cajero: incluye todos los estados y los campos
  tipo, mostrarConfirmar, mostrarAgregarAbono, mostrarConfirmarDevolucion, mostrarCancelar.
  Sin parámetro fecha = día actual. Cambiar fecha o identificador según prueba manual.
url: "{{baseUrl}}/api/reservas/mesero/consulta"
method: GET
headers:
  Authorization: Bearer {{tmpCajeroToken}}
queryParams:
  - key: fecha
    value: 2026-05-21
  - key: identificador
    value: "1"
    disabled: true
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cajero2@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpCajeroToken');
    language: text/javascript
order: 3030
