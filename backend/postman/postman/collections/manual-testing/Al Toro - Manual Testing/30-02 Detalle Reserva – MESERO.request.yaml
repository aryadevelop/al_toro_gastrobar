$kind: http-request
name: 30-02 Detalle Reserva – MESERO
description: Obtener detalle completo de una reserva (mesero)
url: "{{baseUrl}}/api/reservas/mesero/{{tmpReservaId}}/detalle"
method: GET
headers:
  Authorization: Bearer {{tmpMeseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Configurar ID temporal (usar ID conocido)
      pm.environment.set('tmpReservaId', '10');

      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'mesero1@altoro.com',
            password: 'password123',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpMeseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpReservaId');
      pm.environment.unset('tmpMeseroToken');
    language: text/javascript
order: 3020
