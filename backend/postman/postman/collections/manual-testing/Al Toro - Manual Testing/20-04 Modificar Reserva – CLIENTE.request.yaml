$kind: http-request
name: 20-04 Modificar Reserva – CLIENTE
description: Modificar una reserva futura del cliente
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}"
method: PUT
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "fechaHoraLlegada": "2026-12-26T20:00:00",
      "numeroPersonas": 6,
      "zonaId": 2,
      "decoracionId": null,
      "notas": "Reserva modificada",
      "preOrden": null
    }
scripts:
  - type: beforeRequest
    code: |-
      // Configurar ID temporal
      const reservaId = pm.environment.get('reservaIdConPreOrden') || '10';
      pm.environment.set('tmpReservaId', reservaId);

      // Login autónomo
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 2040
