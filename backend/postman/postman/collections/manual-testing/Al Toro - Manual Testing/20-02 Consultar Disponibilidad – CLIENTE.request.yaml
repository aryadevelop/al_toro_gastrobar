$kind: http-request
name: 20-02 Consultar Disponibilidad – CLIENTE
description: Consultar disponibilidad para una fecha y hora
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora=2026-04-29T20:50:00"
method: GET
headers:
  Authorization: Bearer {{tmpClienteToken}}
queryParams:
  fechaHora: 2026-04-29T20:50:00
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'andres.morales@gmail.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpClienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpClienteToken');
    language: text/javascript
order: 2020
