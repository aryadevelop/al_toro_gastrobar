$kind: http-request
name: 90-12 Atender cambio – sin borrador
description: |-
  Caso "atender cambio" sin borrador activo: la comanda PENDIENTE asociada vuelve a BORRADOR
  y se publica el evento ELIMINADA al tablero de producción.
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{tmpMeseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('tmpNotificacionId', '1');
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'mesero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpMeseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpNotificacionId');
      pm.environment.unset('tmpMeseroToken');
    language: text/javascript
order: 8040
