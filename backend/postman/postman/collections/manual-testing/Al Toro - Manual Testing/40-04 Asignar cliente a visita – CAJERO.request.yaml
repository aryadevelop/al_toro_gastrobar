$kind: http-request
name: 40-04 Asignar cliente a visita – CAJERO
description: Relaciona la cuenta de la visita con un cliente existente (CA-02). Usar una visita ABIERTA (p.ej. 15) y un clienteId existente (11-22).
url: "{{baseUrl}}/api/visitas/15/cliente?clienteId=11"
method: PATCH
headers:
  Authorization: Bearer {{tmpCajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cajero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpCajeroToken');
    language: text/javascript
order: 4040
