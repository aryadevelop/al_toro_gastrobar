$kind: http-request
name: 40-03 Solicitar Asistencia – CLIENTE
description: Solicitar asistencia de un mesero para la mesa actual
url: "{{baseUrl}}/api/visitas/{{tmpVisitaId}}/asistencia"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Configurar ID temporal
      const visitaId = pm.environment.get('visitaIdConReserva') || '1';
      pm.environment.set('tmpVisitaId', visitaId);

      // Login autónomo
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpVisitaId');
    language: text/javascript
order: 4030
