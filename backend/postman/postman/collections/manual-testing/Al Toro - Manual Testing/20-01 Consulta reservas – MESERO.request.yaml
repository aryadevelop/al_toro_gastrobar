$kind: http-request
name: 20-01 Consulta reservas – MESERO
description: |-
  Consulta de reservas del día actual por mesero.
  Sin parámetro fecha = día actual. Sin identificador = todas las reservas.
url: "{{baseUrl}}/api/reservas/mesero/consulta?identificador=21"
method: GET
headers:
  Authorization: Bearer {{tmpMeseroToken}}
queryParams:
  - key: fecha
    value: 2026-04-29
    disabled: true
  - key: identificador
    value: "21"
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'mesero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpMeseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: pm.environment.unset('tmpMeseroToken');
    language: text/javascript
order: 2000
