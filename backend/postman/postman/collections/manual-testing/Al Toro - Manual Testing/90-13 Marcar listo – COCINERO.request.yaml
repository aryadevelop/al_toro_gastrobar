$kind: http-request
name: 90-13 Marcar listo – COCINERO
description: Marca una comanda EN_PREPARACION como LISTO (CA-05). Crea la notificación PLATOS_LISTOS o BEBIDAS_LISTAS según la estación.
url: "{{baseUrl}}/api/comandas/produccion/{{tmpComandaId}}/listo"
method: POST
headers:
  Authorization: Bearer {{tmpCocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Ajustar al ID de una comanda EN_PREPARACION de la estación COCINA
      pm.environment.set('tmpComandaId', '1');

      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cocinero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpCocineroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpComandaId');
      pm.environment.unset('tmpCocineroToken');
    language: text/javascript
order: 8050
