$kind: http-request
name: 50-02 Puntos Cliente – CAJERO
description: Obtener puntos de fidelidad de un cliente (cajero)
url: "{{baseUrl}}/api/clientes/{{tmpClienteId}}/puntos"
method: GET
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Configurar ID temporal
      const clienteId = pm.environment.get('clienteIdSinPuntos') || '11';
      pm.environment.set('tmpClienteId', clienteId);

      // Login autónomo
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCajero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('cajeroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpClienteId');
    language: text/javascript
order: 5020
