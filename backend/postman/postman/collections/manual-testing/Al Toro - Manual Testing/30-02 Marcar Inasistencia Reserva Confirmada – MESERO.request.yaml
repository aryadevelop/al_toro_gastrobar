request:
  url: '{{baseUrl}}/reservas/{{tmpReservaId}}/marcar-inasistencia'
  method: PATCH
  body: null
  headers:
    - key: Content-Type
      value: application/json
  auth:
    type: bearer
    bearer:
      - key: token
        value: '{{tmpMeseroToken}}'
hooks:
  beforeRequest:
    - lang: javascript
      value: |
        // 1. Configurar ID de reserva CONFIRMADA con +30 min
        // En producción, usar ID real de una reserva confirmada hace 30+ minutos
        const reservaId = pm.environment.get('reservaIdConfirmada') || '10';
        pm.environment.set('tmpReservaId', reservaId);

        // 2. Login autónomo como MESERO
        const loginReq = {
          url: pm.environment.get('baseUrl') + '/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
            mode: 'raw',
            raw: JSON.stringify({
              email: 'mesero@altoro.com',
              password: 'Al.Toro2026!'
            })
          }
        };

        pm.sendRequest(loginReq, (err, res) => {
          if (err) {
            console.error('Login failed:', err);
            return;
          }
          const body = res.json();
          if (body.success && body.data && body.data.accessToken) {
            pm.environment.set('tmpMeseroToken', body.data.accessToken);
            console.log('✓ Mesero authenticated');
          } else {
            console.error('Login response invalid:', body);
          }
        });
  afterResponse:
    - lang: javascript
      value: |
        // Cleanup: remover variables temporales
        pm.environment.unset('tmpReservaId');
        pm.environment.unset('tmpMeseroToken');

        // Mostrar respuesta
        if (pm.response.code === 200) {
          const body = pm.response.json();
          console.log('✓ Inasistencia marcada:', body.data);
          console.log('  - Zona liberada:', body.data.zonaLiberada);
          console.log('  - Decoración liberada:', body.data.decoracionLiberada);
        }
