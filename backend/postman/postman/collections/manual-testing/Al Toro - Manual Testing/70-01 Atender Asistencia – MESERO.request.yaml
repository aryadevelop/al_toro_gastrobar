$kind: http-request
name: 70-01 Atender Asistencia – MESERO
description: Marcar solicitud de asistencia como atendida
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Configurar ID temporal (debe obtenerse de una notificación activa)
      const notifId = pm.environment.get('notificacionIdActiva') || '1';
      pm.environment.set('tmpNotificacionId', notifId);

      // Login autónomo
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('meseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpNotificacionId');
    language: text/javascript
order: 7010
