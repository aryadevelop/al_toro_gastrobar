$kind: http-request
name: 70-05 Atender cambio – con fusion en borrador
description: |-
  Caso "atender cambio" con borrador activo: los ítems de la comanda PENDIENTE se fusionan
  dentro del borrador (match suma cantidades, no match clona) y la comanda PENDIENTE se
  elimina físicamente. Publica ELIMINADA al tablero.
url: "{{baseUrl}}/api/notificaciones/{{tmpNotificacionId}}/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{tmpMeseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('tmpNotificacionId', '2');
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'mesero1@altoro.com',
            password: 'Al.Toro2026!',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpMeseroToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpNotificacionId');
      pm.environment.unset('tmpMeseroToken');
    language: text/javascript
order: 8050
