$kind: http-request
name: 20-06 Reservas Futuras – CLIENTE
description: Obtener resumen de reservas futuras del cliente
url: "{{baseUrl}}/api/reservas/cliente/futuras?emailCliente=cliente1@altoro.com"
method: GET
headers:
  Authorization: Bearer {{tmpClienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Login autónomo con credenciales hardcoded
      pm.sendRequest({
        url: '{{baseUrl}}/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'cliente1@altoro.com',
            password: 'password123',
            forceSessionOverride: true
          })
        }
      }, (err, res) => {
        if (!err && res && res.code === 200) {
          pm.environment.set('tmpClienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.environment.unset('tmpClienteToken');
    language: text/javascript
order: 2060
