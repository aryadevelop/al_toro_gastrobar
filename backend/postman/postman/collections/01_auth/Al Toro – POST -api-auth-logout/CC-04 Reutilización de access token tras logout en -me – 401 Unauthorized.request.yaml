$kind: http-request
description: |-
  **Criterio de Aceptación:** CC-04
  **Objetivo:** Verificar que un access token usado antes del logout no puede reutilizarse para consumir endpoints protegidos después de cerrar sesión.
  **Pre-condición:** CC-02 debe haberse ejecutado previamente (almacena `savedAccessToken` en el entorno).
  **Resultado esperado:** HTTP 401 al consultar /me con el token invalidado.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Authorization: Bearer {{savedAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – Access token invalidado tras logout', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
