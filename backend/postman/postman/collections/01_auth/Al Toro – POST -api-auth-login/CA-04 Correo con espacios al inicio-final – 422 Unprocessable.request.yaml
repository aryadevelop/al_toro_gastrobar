$kind: http-request
name: CA-04 Correo con espacios al inicio/final – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-04
  **Objetivo:** Verificar que el backend rechaza correos electrónicos que contienen espacios en blanco al inicio o al final, dado que la validación de formato se realiza a nivel de API mediante la anotación `@Email`. El trimming es responsabilidad del frontend (Angular).
  **Pre-condición:** Ninguna sesión activa requerida.
  **Resultado esperado:** HTTP 422 con código `VAL-001` y mensaje de formato inválido.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "  {{emailAdmin}}  ",
      "password": "{{passwordValida}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Correo con espacios rechazado por validación', () => pm.response.to.have.status(422));

      const body = pm.response.json();

      pm.test('Código VAL-001 y mensaje de formato de correo inválido', () => {
        pm.expect(body.code).to.eql('VAL-001');
        pm.expect(body.message).to.include('Por favor ingresa un correo electrónico válido');
      });
    language: text/javascript
order: 5000
