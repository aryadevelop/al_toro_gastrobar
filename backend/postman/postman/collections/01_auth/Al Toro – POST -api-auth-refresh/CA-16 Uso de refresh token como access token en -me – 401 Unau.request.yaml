$kind: http-request
name: CA-16 Uso de refresh token como access token en /me – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** CA-16
  **Objetivo:** Verificar que el filtro JWT rechaza tokens cuyo claim `type` sea `refresh` cuando se usan en el header `Authorization` de endpoints protegidos. Un refresh token no debe autenticar solicitudes a recursos del sistema.
  **Pre-condición:** Debe existir un `refreshToken` válido en el entorno.
  **Resultado esperado:** HTTP 401.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Authorization: Bearer {{refreshToken}}
scripts:
  - type: afterResponse
    code: pm.test('Status 401 – Refresh token rechazado como Bearer en endpoint protegido', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
