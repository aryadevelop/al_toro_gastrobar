$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-12
  **Objetivo:** Verificar que el sistema rechaza refresh tokens con formato o firma inválidos.
  **Pre-condición:** Ninguna sesión activa requerida.
  **Resultado esperado:** HTTP 401 con código `AUTH-001`.
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "token.invalido.jwt"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – Refresh token inválido rechazado', () => pm.response.to.have.status(401));

      pm.test('Código de error AUTH-001', () =>
        pm.expect(pm.response.json().code).to.eql('AUTH-001'));
    language: text/javascript
order: 1000
