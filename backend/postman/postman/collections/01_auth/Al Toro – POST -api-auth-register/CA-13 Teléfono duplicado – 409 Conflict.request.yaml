$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-13
  **Objetivo:** Validar que no se permite registrar un teléfono ya existente.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Cliente Duplicado",
      "telefono": "3001234567",
      "email": "ca13.{{$timestamp}}@example.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "ValidPass123!",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409 – Teléfono duplicado', () => pm.response.to.have.status(409));

      const body = pm.response.json();

      pm.test('Código ENT-002', () => pm.expect(body.code).to.eql('ENT-002'));
      pm.test('Mensaje de teléfono duplicado', () => pm.expect(body.message.toLowerCase()).to.include('telefono'));
    language: text/javascript
order: 1012
