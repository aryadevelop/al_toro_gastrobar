$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-08
  **Objetivo:** Validar rechazo cuando password y passwordConfirmation no coinciden.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "3001111117",
      "email": "ca08.{{$timestamp}}@example.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "DifferentPass456!",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Confirmación no coincide', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
      pm.test('Mensaje de contraseñas no coinciden', () => pm.expect(body.message.toLowerCase()).to.include('contrasenas no coinciden'));
    language: text/javascript
order: 1007
