$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-12
  **Objetivo:** Validar rechazo de fecha de nacimiento con formato inválido.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "3001111121",
      "email": "ca12.{{$timestamp}}@example.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "ValidPass123!",
      "aceptaTerminos": true,
      "fechaNacimiento": "31-12-1990"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Fecha inválida', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
    language: text/javascript
order: 1011
