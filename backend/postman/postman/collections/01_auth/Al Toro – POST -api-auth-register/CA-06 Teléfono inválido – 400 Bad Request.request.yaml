$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-06
  **Objetivo:** Validar rechazo de teléfono con formato inválido.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "300-123-4567",
      "email": "ca06.{{$timestamp}}@example.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "ValidPass123!",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Teléfono inválido', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
      pm.test('Mensaje relacionado con teléfono', () => pm.expect(body.message.toLowerCase()).to.include('telefono'));
    language: text/javascript
order: 1005
