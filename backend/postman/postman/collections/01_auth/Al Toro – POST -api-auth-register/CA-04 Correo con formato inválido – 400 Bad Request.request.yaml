$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-04
  **Objetivo:** Validar rechazo de correo electrónico con formato inválido.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "3001111113",
      "email": "correo.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "ValidPass123!",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Correo inválido', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
      pm.test('Mensaje de correo válido', () => pm.expect(body.message.toLowerCase()).to.include('correo'));
    language: text/javascript
order: 1003
