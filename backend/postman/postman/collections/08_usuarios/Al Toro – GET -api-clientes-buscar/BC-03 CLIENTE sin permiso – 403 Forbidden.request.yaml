$kind: http-request
name: BC-03 CLIENTE sin permiso – 403 Forbidden
url: "{{baseUrl}}/api/clientes/buscar?correo=a"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  correo: "a"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('CLIENTE no puede buscar clientes → 403', function () {
        pm.response.to.have.status(403);
      });
      pm.test('code = AUTH-002', function () {
        pm.expect(pm.response.json().code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 3000
