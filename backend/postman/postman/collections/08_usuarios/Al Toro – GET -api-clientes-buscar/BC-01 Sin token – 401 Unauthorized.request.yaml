$kind: http-request
name: BC-01 Sin token – 401 Unauthorized
description: Sin cabecera Authorization, el filtro JWT rechaza el request y devuelve 401.
url: "{{baseUrl}}/api/clientes/buscar?correo=a"
method: GET
queryParams:
  correo: "a"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sin token → 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
