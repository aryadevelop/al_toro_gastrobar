$kind: http-request
name: PA-09 Query param emailCliente ausente – 400 Bad Request
description: |-
  **Criterio de Aceptación:** Validación de parámetros de entrada.
  **Objetivo:** Verificar que el sistema rechaza la petición cuando falta el query param
  obligatorio `emailCliente` con 400 (manejado por `GlobalExceptionHandler.handleMissingParam`).
  **Pre-condición:** El `beforeRequest` de este test hace login autónomo para obtener
  `clienteToken`, independiente del hook de colección.
  **Resultado esperado:** 400 Bad Request · mensaje "Parámetro requerido faltante: emailCliente".
url: "{{baseUrl}}/api/clientes/me/puntos"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('clienteToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        } else {
          console.warn('PA-09: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la falta del query param con 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('El mensaje indica qué parámetro falta', function () {
        const msg = (pm.response.json().message || '').toLowerCase();
        pm.expect(msg).to.include('emailcliente');
      });
    language: text/javascript
order: 9000
