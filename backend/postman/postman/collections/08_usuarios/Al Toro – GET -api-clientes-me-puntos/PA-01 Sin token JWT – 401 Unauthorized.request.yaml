$kind: http-request
name: PA-01 Sin token JWT – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** Control de acceso — no se permite consultar puntos sin autenticación.
  **Objetivo:** Verificar que el endpoint rechaza peticiones sin header `Authorization`.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/clientes/me/puntos?emailCliente={{emailCliente}}"
method: GET
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la petición sin token con 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
