$kind: http-request
name: PC-07 Cliente con puntosActuales = 0 – 422 Unprocessable Entity
description: |-
  > ⚠️ TODO — Test dependiente de seed data
  >
  > Este test no se pudo refactorizar al patrón "create fresh data" porque el flujo prerequisito
  > no expone endpoint público:
  >   - Endpoint admin/test para inyectar puntos al cliente, o cadena E2E completa visita→comanda→venta→cierre×N hasta acumular puntos requeridos.
  >
  > Hasta que el endpoint exista, el test:
  >   1. Sigue dependiendo de los puntos seed del cliente en V3__dev_data.sql.
  >   2. Puede romperse en runs repetidos (los puntos se consumen).
  >
  > Acción pendiente: cuando exista endpoint para inyectar puntos (o se considere viable la cadena E2E completa), refactorizar este test al patrón create-fresh siguiendo `docs/superpowers/plans/2026-05-03-postman-tests-independencia.md`.

  **Criterio de Aceptación:** Precondición de saldo para el canje (`cliente.getClientePuntos() == 0 → 422`).
  **Objetivo:** Verificar que el canje falla con 422 cuando el cliente no tiene puntos
  disponibles.
  **Pre-condición:** Se usa el cliente seed `sinpuntos@altoro.com` (usuario_id=23, saldo 0
  permanente). Su ID está hardcodeado en la URL (igual que el email en PA-07/PA-08) porque
  es un valor de seed fijo. El `beforeRequest` hace login autónomo de CAJERO y actualiza
  el header `Authorization` directamente vía `pm.request.headers.upsert` para garantizar
  que el token esté presente aunque el callback sea asíncrono.
  **Resultado esperado:** 422 Unprocessable Entity · mensaje menciona falta de puntos
  para canjear.
url: "{{baseUrl}}/api/clientes/23/canje-puntos?emailEmpleado={{emailCajero}}"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
queryParams:
  emailEmpleado: "{{emailCajero}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailCajero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('cajeroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        } else {
          console.warn('PC-07: login CAJERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza el canje sin saldo con 422', function () {
        pm.response.to.have.status(422);
      });
      pm.test('El mensaje indica ausencia de puntos para canjear', function () {
        const msg = (pm.response.json().message || '').toLowerCase();
        pm.expect(msg).to.satisfy(function (m) {
          return m.includes('punto') || m.includes('canjear');
        });
      });
    language: text/javascript
order: 7000
