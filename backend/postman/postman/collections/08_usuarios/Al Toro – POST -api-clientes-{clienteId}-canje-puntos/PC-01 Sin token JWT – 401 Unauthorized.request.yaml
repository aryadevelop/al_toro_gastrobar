$kind: http-request
name: PC-01 Sin token JWT – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** Control de acceso — canje no permitido sin autenticación.
  **Objetivo:** Verificar que el endpoint rechaza peticiones sin `Authorization` con 401.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/clientes/1/canje-puntos?emailEmpleado={{emailCajero}}"
method: POST
queryParams:
  emailEmpleado: "{{emailCajero}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza la petición sin token con 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
