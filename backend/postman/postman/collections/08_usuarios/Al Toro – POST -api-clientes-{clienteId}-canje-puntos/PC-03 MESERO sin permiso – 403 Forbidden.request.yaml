$kind: http-request
name: PC-03 MESERO sin permiso – 403 Forbidden
description: |-
  **Criterio de Aceptación:** Matriz de roles — canje exclusivo de `CAJERO`/`ADMIN`.
  **Objetivo:** Verificar que el endpoint deniega token de MESERO.
  **Pre-condición:** El `beforeRequest` de este test hace login autónomo para obtener
  `meseroToken`, independiente del hook de colección.
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/clientes/1/canje-puntos?emailEmpleado={{emailCajero}}"
method: POST
headers:
  Authorization: Bearer {{meseroToken}}
queryParams:
  emailEmpleado: "{{emailCajero}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.environment.get('emailMesero'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })
        }
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          const token = res.json().accessToken;
          pm.environment.set('meseroToken', token);
          pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
        } else {
          console.warn('PC-03: login MESERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza token de MESERO con 403', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000
