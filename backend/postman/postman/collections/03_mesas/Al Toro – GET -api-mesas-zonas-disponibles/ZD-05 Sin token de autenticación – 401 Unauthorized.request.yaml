$kind: http-request
name: ZD-05 Sin token de autenticación – 401 Unauthorized
description: |-
  **Criterio:** CA-05 — Validación de autenticación: sin token.
  **Objetivo:** Verificar que el sistema rechaza requests sin token JWT.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/mesas/zonas-disponibles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 401', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 5000
