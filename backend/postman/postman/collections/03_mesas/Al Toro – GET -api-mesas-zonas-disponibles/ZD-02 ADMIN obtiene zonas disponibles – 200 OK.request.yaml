$kind: http-request
name: ZD-02 ADMIN obtiene zonas disponibles – 200 OK
description: |-
  **Criterio:** CA-02 — ADMIN obtiene listado de zonas con disponibilidad.
  **Objetivo:** Verificar que un administrador puede consultar las zonas disponibles.
  **Pre-condición:** `adminToken` disponible. Zonas seed existen.
  **Resultado esperado:** 200 OK con array de ZonaDisponibleMesaResponse.
url: "{{baseUrl}}/api/mesas/zonas-disponibles"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('La respuesta contiene success=true', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(true);
      });

      pm.test('El campo data es un array', function () {
        const body = pm.response.json();
        pm.expect(body.data).to.be.an('array');
      });

      pm.test('El array contiene al menos una zona', function () {
        const body = pm.response.json();
        pm.expect(body.data.length).to.be.greaterThan(0);
      });
    language: text/javascript
order: 2000
