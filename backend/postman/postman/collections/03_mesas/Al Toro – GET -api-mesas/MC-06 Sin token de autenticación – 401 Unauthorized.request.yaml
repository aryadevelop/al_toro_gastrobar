$kind: http-request
name: MC-06 Sin token de autenticación – 401 Unauthorized
description: |-
  **Objetivo:** Verificar que el endpoint requiere autenticación.
  **Pre-condición:** Sin header Authorization.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/mesas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 401 sin token de autenticación', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 6000
