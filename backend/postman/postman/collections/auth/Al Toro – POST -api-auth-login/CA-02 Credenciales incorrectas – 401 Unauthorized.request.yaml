$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-02
  **Objetivo:** Verificar que el sistema retorna un error de autenticación cuando se proporcionan credenciales incorrectas, sin revelar información específica sobre cuál campo es erróneo (mensaje genérico).
  **Pre-condición:** El correo existe en el sistema; la contraseña enviada no corresponde a la registrada.
  **Resultado esperado:** HTTP 401 con código `AUTH-001` y mensaje `Credenciales inválidas.`
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{emailAdmin}}",
      "password": "contraseña_incorrecta"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – Credenciales inválidas', () => pm.response.to.have.status(401));

      const body = pm.response.json();

      pm.test('Código de error AUTH-001 y mensaje correspondiente', () => {
        pm.expect(body.code).to.eql('AUTH-001');
        pm.expect(body.message).to.eql('Credenciales inválidas.');
      });
    language: text/javascript
order: 3000
