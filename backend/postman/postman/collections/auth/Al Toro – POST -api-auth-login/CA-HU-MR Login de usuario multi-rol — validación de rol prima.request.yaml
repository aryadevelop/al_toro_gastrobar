$kind: http-request
name: CA-HU-MR Login de usuario multi-rol — validación de rol primario por prioridad – 200 OK
description: |-
  **Historia de Usuario:** HU-MR (Multi-Rol)
  **Objetivo:** Verificar que cuando un usuario posee múltiples roles activos, el sistema resuelve correctamente el rol primario utilizando la lógica de prioridad definida en `resolvePrimaryRole()`. Adicionalmente, se verifica que los roles inactivos no aparecen en el listado de roles disponibles.
  **Pre-condición:** cajero1@altoro.com debe tener CAJERO + MESERO + BARTENDER activos y ADM inactivo.
  **Resultado esperado:** HTTP 200. `user.role` es `CAJERO` (mayor prioridad). `user.roles` incluye `CAJERO`, `MESERO` y `PRODUCCION` pero NO incluye `ADMIN`.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{emailMultiRol}}",
      "password": "{{passwordValida}}",
      "forceSessionOverride": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Login de usuario multi-rol exitoso', () => pm.response.to.have.status(200));

      const body = pm.response.json();

      pm.test('El rol primario es CAJERO (mayor prioridad entre los roles activos)', () => pm.expect(body.user.role).to.eql('CAJERO'));

      pm.test('Los roles activos incluyen CAJERO, MESERO y PRODUCCION', () => {
        pm.expect(body.user.roles).to.include('CAJERO');
        pm.expect(body.user.roles).to.include('MESERO');
        pm.expect(body.user.roles).to.include('PRODUCCION');
      });

      pm.test('El rol ADMIN no aparece en los roles activos (ADM está inactivo)', () =>
        pm.expect(body.user.roles).to.not.include('ADMIN'));
    language: text/javascript
order: 16000
