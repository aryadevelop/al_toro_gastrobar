$kind: http-request
description: |-
  **Historia de Usuario:** HU-09
  **Objetivo:** Verificar que un empleado con rol MESERO puede autenticarse correctamente y que la respuesta refleja su rol asignado.
  **Pre-condición:** El usuario mesero2@altoro.com debe existir con estado activo y rol MESERO.
  **Resultado esperado:** HTTP 200. `user.role` es `MESERO`. Se almacena `meseroAccessToken` en el entorno.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{emailMesero}}",
      "password": "{{passwordValida}}",
      "forceSessionOverride": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Login de mesero exitoso', () => pm.response.to.have.status(200));

      const body = pm.response.json();

      pm.test('La respuesta contiene accessToken, refreshToken y user', () => {
        pm.expect(body).to.have.property('accessToken');
        pm.expect(body).to.have.property('refreshToken');
        pm.expect(body).to.have.property('user');
      });

      pm.test('El rol principal del usuario es MESERO', () => pm.expect(body.user.role).to.eql('MESERO'));

      pm.test('El tipo de token es Bearer', () => pm.expect(body.tokenType).to.eql('Bearer'));

      pm.environment.set('meseroAccessToken', body.accessToken);
    language: text/javascript
order: 13000
