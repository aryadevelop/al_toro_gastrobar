$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-07
  **Objetivo:** Validar rechazo de contraseña menor a 8 caracteres.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "3001111116",
      "email": "ca07.{{$timestamp}}@example.com",
      "password": "Pass12!",
      "passwordConfirmation": "Pass12!",
      "aceptaTerminos": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Contraseña inválida', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
      pm.test('Mensaje de longitud mínima', () => pm.expect(body.message.toLowerCase()).to.include('contrasena'));
    language: text/javascript
order: 1006
