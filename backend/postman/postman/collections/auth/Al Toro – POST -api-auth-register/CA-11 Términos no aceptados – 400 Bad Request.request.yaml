$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-11
  **Objetivo:** Validar que el registro se rechaza si no se aceptan términos y condiciones.
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Juan Perez",
      "telefono": "3001111120",
      "email": "ca11.{{$timestamp}}@example.com",
      "password": "ValidPass123!",
      "passwordConfirmation": "ValidPass123!",
      "aceptaTerminos": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 – Términos no aceptados', () => pm.response.to.have.status(400));

      const body = pm.response.json();

      pm.test('Código de validación', () => pm.expect(body.code).to.eql('VAL-001'));
      pm.test('Mensaje de términos y condiciones', () => pm.expect(body.message.toLowerCase()).to.include('terminos'));
    language: text/javascript
order: 1010
