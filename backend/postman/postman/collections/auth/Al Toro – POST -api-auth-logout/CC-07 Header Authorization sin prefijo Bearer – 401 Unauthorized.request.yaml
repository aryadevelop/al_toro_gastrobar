$kind: http-request
description: |-
  **Criterio de Aceptación:** CC-07
  **Objetivo:** Verificar que el endpoint /logout rechaza solicitudes con header Authorization mal formado (sin prefijo Bearer).
  **Pre-condición:** Debe existir `accessToken` válido en el entorno.
  **Resultado esperado:** HTTP 401.
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Authorization: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 – Authorization sin Bearer es inválido', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
