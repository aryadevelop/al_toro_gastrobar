$kind: http-request
description: |-
  **Criterio de Aceptación:** CC-01
  **Objetivo:** Verificar que el endpoint /logout rechaza solicitudes sin token de autorización.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** HTTP 401.
url: "{{baseUrl}}/api/auth/logout"
method: POST
scripts:
  - type: afterResponse
    code: pm.test('Status 401 – Acceso denegado sin token JWT', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
