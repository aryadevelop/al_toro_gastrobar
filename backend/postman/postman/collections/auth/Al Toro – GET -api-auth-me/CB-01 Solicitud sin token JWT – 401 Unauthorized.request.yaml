$kind: http-request
description: |-
  **Criterio de Aceptación:** CB-01
  **Objetivo:** Verificar que el endpoint protegido /me rechaza solicitudes que no incluyen token de autorización.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** HTTP 401.
url: "{{baseUrl}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status 401 – Acceso denegado sin token JWT', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
