$kind: http-request
name: AC-06 Notificación ya atendida – 409 Conflict
description: |-
  > ⚠️ TODO — Test dependiente de seed data
  >
  > Este test no se pudo refactorizar al patrón "create fresh data" porque el flujo prerequisito
  > no expone endpoint público:
  >   - Modificar una comanda existente para disparar notificación CAMBIO automáticamente.
  >
  > Hasta que el endpoint exista, el test:
  >   1. Sigue dependiendo de la notificación seed en V3__dev_data.sql.
  >   2. Puede romperse en runs repetidos.
  >
  > Acción pendiente: cuando se construya el endpoint, refactorizar este test al patrón
  > create-fresh siguiendo `docs/superpowers/plans/2026-05-03-postman-tests-independencia.md`.

  **Objetivo:** Verificar que intentar atender un cambio de una notificación ya ATENDIDA retorna 409.
  **Pre-condición:** AC-01 ya se ejecutó y marcó la notificación como ATENDIDA.
  **Resultado esperado:** 409 Conflict, code=NEG-002.
url: "{{baseUrl}}/api/notificaciones/{{seedNotificacionCambioId}}/atender-cambio"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code=NEG-002', () => {
        pm.expect(pm.response.json().code).to.equal('NEG-002');
      });
    language: text/javascript
order: 7306
