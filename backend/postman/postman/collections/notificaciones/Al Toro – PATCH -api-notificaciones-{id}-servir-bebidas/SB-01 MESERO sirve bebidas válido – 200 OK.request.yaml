$kind: http-request
name: SB-01 MESERO sirve bebidas válido – 200 OK
description: |-
  > ⚠️ TODO — Test dependiente de seed data
  >
  > Este test no se pudo refactorizar al patrón "create fresh data" porque el flujo prerequisito
  > no expone endpoint público:
  >   - Marcar comanda con items BEBIDA como LISTO (rol BARTENDER) para disparar notificación BEBIDAS_LISTAS automáticamente.
  >
  > Hasta que el endpoint exista, el test:
  >   1. Sigue dependiendo de la notificación seed en V3__dev_data.sql.
  >   2. Puede romperse en runs repetidos.
  >
  > Acción pendiente: cuando se construya el endpoint, refactorizar este test al patrón
  > create-fresh siguiendo `docs/superpowers/plans/2026-05-03-postman-tests-independencia.md`.

  **Criterio de Aceptación:** CA-04 — Mesero puede registrar que sirvió las bebidas.
  **Objetivo:** Verificar respuesta exitosa con success=true y mensaje correcto.
  **Pre-condición:** `meseroToken` disponible. Notificación ID 13 (ACTIVA, BEBIDAS_LISTAS).
  **Resultado esperado:** 200 OK, success=true, message="Bebidas servidas."
url: "{{baseUrl}}/api/notificaciones/{{seedNotificacionBebidasListasId}}/servir-bebidas"
method: PATCH
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('success=true', () => {
        pm.expect(pm.response.json().success).to.equal(true);
      });
      pm.test('message="Bebidas servidas."', () => {
        pm.expect(pm.response.json().message).to.equal('Bebidas servidas.');
      });
    language: text/javascript
order: 7201
