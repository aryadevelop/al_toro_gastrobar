$kind: http-request
name: SB-04 CAJERO intenta acceder – 403 Forbidden
description: |-
  **Objetivo:** Verificar que CAJERO no puede usar este endpoint.
  **Pre-condición:** `cajeroToken` disponible.
  **Resultado esperado:** 403 Forbidden, code=AUTH-002.
url: "{{baseUrl}}/api/notificaciones/1/servir-bebidas"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('code=AUTH-002', () => {
        pm.expect(pm.response.json().code).to.equal('AUTH-002');
      });
    language: text/javascript
order: 7204
