$kind: http-request
name: MC-07 ADMIN accede exitosamente – 200 OK
description: |-
  **Criterio de Aceptación:** CA-02 — el endpoint es accesible para ADMIN además de MESERO.
  **Objetivo:** Verificar que un usuario con rol ADMIN puede acceder al listado de reservas de meseros.
  **Pre-condición:** El pre-request hace login autónomo como ADMIN.
  **Resultado esperado:** 200 OK · `data.reservas` y `data.resumenZonas` son arrays.
url: "{{baseUrl}}/api/reservas/mesero/consulta"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  fecha: "{{tmpFechaConsultaMC07}}"
scripts:
  - type: beforeRequest
    code: |-
      // Crear reserva para mañana para garantizar que esté en el futuro
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setDate(d.getDate() + 1);  // Mañana
      d.setHours(19, 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;
      const fechaConsulta = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      pm.environment.set('tmpFechaConsultaMC07', fechaConsulta);

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('MC-07: login CLIENTE falló', err, res && res.code);
          return;
        }
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: null, preOrden: null
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaIdMC07', r2.json().data.reservaId);
          } else {
            console.warn('MC-07: creación de reserva falló', e2, r2 && r2.code);
          }

          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailAdmin'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('adminToken', r3.json().accessToken);
            } else {
              console.warn('MC-07: login ADMIN falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo success es true', function () {
        pm.expect(body.success).to.be.true;
      });

      pm.test('El campo data contiene reservas y resumenZonas', function () {
        pm.expect(body.data.reservas).to.be.an('array');
        pm.expect(body.data.resumenZonas).to.be.an('array');
      });

      // Cleanup: cancelar la reserva creada
      const reservaId = pm.environment.get('tmpReservaIdMC07');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({
            email: pm.environment.get('emailCliente'),
            password: pm.environment.get('passwordValida'),
            forceSessionOverride: true
          })}
        }, function (e, r) {
          if (!e && r && r.code === 200) {
            const clienteToken = r.json().accessToken;
            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + clienteToken }
            }, function (e2, r2) {
              if (!e2 && r2 && r2.code !== 200) {
                console.warn('Cleanup MC-07: cancelar reserva falló', r2 && r2.code);
              }
            });
          }
        });
      }

      pm.environment.unset('tmpReservaIdMC07');
      pm.environment.unset('tmpFechaConsultaMC07');
    language: text/javascript
order: 1060
