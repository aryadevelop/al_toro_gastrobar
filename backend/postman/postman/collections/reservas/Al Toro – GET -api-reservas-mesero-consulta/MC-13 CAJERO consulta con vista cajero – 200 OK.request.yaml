$kind: http-request
name: MC-13 CAJERO consulta con vista cajero – 200 OK
description: |-
  CA-01/CA-03: El CAJERO accede al listado y recibe la vista de cajero:
  - Incluye reservas en cualquier estado (no solo PENDIENTE/CONFIRMADA).
  - Cada item expone los campos `tipo`, `mostrarConfirmar`, `mostrarAgregarAbono`,
    `mostrarConfirmarDevolucion` y `mostrarCancelar` según el estado de la reserva.
  El beforeRequest crea una reserva ESPECIAL PENDIENTE para garantizar que haya
  al menos un item con mostrarConfirmar=true en la respuesta.
  Resultado esperado: 200 OK, reservas con campos de vista cajero.
url: "{{baseUrl}}/api/reservas/mesero/consulta"
method: GET
headers:
  Authorization: Bearer {{cajeroToken}}
queryParams:
  fecha: "{{tmpFechaConsultaMC13}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(19, 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;
      const fechaConsulta = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      pm.environment.set('tmpFechaConsultaMC13', fechaConsulta);

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE para mañana
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('MC-13: login CLIENTE falló', err, res && res.code);
          return;
        }
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaIdMC13', r2.json().data.reservaId);
            pm.environment.set('tmpClienteTokenMC13', clienteToken);
          } else {
            console.warn('MC-13: creación de reserva falló', e2, r2 && r2.code);
          }

          // Paso 2: CAJERO obtiene token
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('cajeroToken', r3.json().accessToken);
            } else {
              console.warn('MC-13: login CAJERO falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('CAJERO accede al listado → 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('success=true', function () {
        pm.expect(body.success).to.be.true;
      });
      pm.test('data contiene reservas y resumenZonas', function () {
        pm.expect(body.data.reservas).to.be.an('array');
        pm.expect(body.data.resumenZonas).to.be.an('array');
      });
      pm.test('Vista cajero: reservas incluyen campo tipo', function () {
        const reservas = body.data.reservas;
        pm.expect(reservas.length).to.be.above(0);
        reservas.forEach(r => pm.expect(r.tipo).to.be.oneOf(['BASICA', 'ESPECIAL']));
      });
      pm.test('Vista cajero: reserva ESPECIAL PENDIENTE tiene mostrarConfirmar=true', function () {
        const reservas = body.data.reservas;
        const especial = reservas.find(r => r.tipo === 'ESPECIAL' && r.estado === 'PENDIENTE');
        if (especial) {
          pm.expect(especial.mostrarConfirmar).to.be.true;
          pm.expect(especial.mostrarCancelar).to.be.true;
        } else {
          pm.expect(true, 'No se encontró reserva ESPECIAL PENDIENTE para verificar flags').to.be.true;
        }
      });

      // Cleanup: cliente cancela la reserva creada
      const reservaId = pm.environment.get('tmpReservaIdMC13');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('tmpClienteTokenMC13') }
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code !== 200) {
            console.warn('Cleanup MC-13: cancelar reserva falló', r2 && r2.code);
          }
        });
      }

      pm.environment.unset('tmpReservaIdMC13');
      pm.environment.unset('tmpClienteTokenMC13');
      pm.environment.unset('tmpFechaConsultaMC13');
    language: text/javascript
order: 1300
