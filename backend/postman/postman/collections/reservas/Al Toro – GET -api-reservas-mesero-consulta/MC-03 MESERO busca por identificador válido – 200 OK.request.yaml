$kind: http-request
name: MC-03 MESERO busca por identificador válido – 200 OK
description: |-
  **Criterio de Aceptación:** CA-07 — el mesero puede buscar por identificador de reserva.
  **Objetivo:** Verificar que un MESERO obtiene una reserva específica cuando busca por su identificador.
  **Pre-condición:** El pre-request hace login autónomo como MESERO y crea una reserva para buscar.
  **Resultado esperado:** 200 OK · `data.reservas` contiene exactamente la reserva buscada.
url: "{{baseUrl}}/api/reservas/mesero/consulta"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
queryParams:
  identificador: "{{tmpReservaIdMC03}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(19, 30, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('MC-03: login CLIENTE falló', err, res && res.code);
          return;
        }
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 3,
            zonaId: null, decoracionId: null, notas: 'Test MC-03', preOrden: null
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaIdMC03', r2.json().data.reservaId);
          } else {
            console.warn('MC-03: creación de reserva falló', e2, r2 && r2.code);
          }

          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailMesero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('meseroToken', r3.json().accessToken);
            } else {
              console.warn('MC-03: login MESERO falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo success es true', function () {
        pm.expect(body.success).to.be.true;
      });

      const tmpId = String(pm.environment.get('tmpReservaIdMC03'));
      pm.test('data.reservas contiene exactamente 1 elemento', function () {
        pm.expect(body.data.reservas).to.have.lengthOf(1);
      });

      pm.test('El ID de la reserva coincide con el buscado', function () {
        pm.expect(String(body.data.reservas[0].reservaId)).to.equal(tmpId);
      });

      pm.test('La reserva contiene los campos obligatorios', function () {
        const r = body.data.reservas[0];
        pm.expect(r).to.include.keys(['reservaId', 'clienteNombre', 'horaLlegada', 'numeroPersonas', 'estado']);
        pm.expect(r.numeroPersonas).to.equal(3);
      });

      const reservaId = pm.environment.get('tmpReservaIdMC03');
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (e, r) {
        if (!e && r && r.code === 200) {
          const clienteToken = r.json().accessToken;
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
            method: 'PATCH',
            header: { 'Authorization': 'Bearer ' + clienteToken }
          }, function (e2, r2) {
            if (!e2 && r2 && r2.code !== 200) {
              console.warn('Cleanup MC-03: cancelar reserva falló', r2 && r2.code);
            }
          });
        }
      });

      pm.environment.unset('tmpReservaIdMC03');
    language: text/javascript
order: 1020
