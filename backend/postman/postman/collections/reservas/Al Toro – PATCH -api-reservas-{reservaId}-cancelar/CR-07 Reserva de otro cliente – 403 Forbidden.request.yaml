$kind: http-request
name: CR-07 Reserva de otro cliente – 403 Forbidden
description: |
  El cliente autenticado intenta cancelar una reserva que pertenece a otro cliente.
  El servicio detecta el ownership incorrecto y lanza BusinessException(ACCESS_DENIED).
  Resultado esperado: 403 Forbidden.
  Prerequisito: reservaIdOtroCliente debe apuntar a una reserva PENDIENTE/CONFIRMADA de otro cliente seed.
url: "{{baseUrl}}/api/reservas/{{reservaIdOtroCliente}}/cancelar"
method: PATCH
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('clienteToken', res.json().accessToken);
        } else {
          console.warn('CR-07: login CLIENTE falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Reserva ajena → 403', function () {
        pm.response.to.have.status(403);
      });
      pm.test('Mensaje de error correcto', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.be.false;
        pm.expect(body.message).to.include('propias reservas');
      });
    language: text/javascript
order: 7000
