$kind: http-request
name: RE-02 CLIENTE consulta detalle de reserva propia básica sin pre-orden ni abonos – 200 OK
description: |-
  **Criterio de Aceptación:** HE-02-HU-03-CA-07 (omisión de campos opcionales por `@JsonInclude(NON_NULL)`)
  **Objetivo:** Verificar que `preOrdenItems`, `preOrdenTotal`, `abonos` y `totalAbonado`
  son omitidos del JSON cuando la reserva no tiene pre-orden ni abonos asociados.
  **Pre-condición:** Ninguna externa. El pre-request hace login autónomo, crea una reserva
  básica sin pre-orden y captura el `reservaId` en `tmpReservaId`. El afterResponse cancela
  la reserva para evitar acumulación de datos.
  **Resultado esperado:** 200 OK · `reservaId`, `estado`, `numeroPersonas` presentes ·
  `preOrdenItems`, `preOrdenTotal`, `abonos`, `totalAbonado` ausentes (undefined).
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}/detalle"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('Pre-request RE-02: login CLIENTE falló', err, res && res.code);
          return;
        }
        const token = res.json().accessToken;
        pm.environment.set('clienteToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: null, preOrden: null
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaId', r2.json().data.reservaId);
          } else {
            console.warn('Pre-request RE-02: creación de reserva falló', e2, r2 && r2.code, r2 && r2.text());
          }
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Los campos base están presentes en una reserva básica', function () {
        const data = pm.response.json().data;
        pm.expect(data.reservaId).to.exist;
        pm.expect(data.estado).to.exist;
        pm.expect(data.numeroPersonas).to.exist;
      });
      pm.test('Los campos opcionales de pre-orden y abonos están omitidos', function () {
        const data = pm.response.json().data;
        pm.expect(data.preOrdenItems).to.be.undefined;
        pm.expect(data.preOrdenTotal).to.be.undefined;
        pm.expect(data.abonos).to.be.undefined;
        pm.expect(data.totalAbonado).to.be.undefined;
      });

      const reservaId = pm.environment.get('tmpReservaId');
      if (reservaId) {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RE-02: cancelar reserva ' + reservaId + ' falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 2000
