$kind: http-request
name: RE-01 CLIENTE consulta detalle de reserva propia con pre-orden – 200 OK (CA-07)
description: |-
  **Criterio de Aceptación:** HE-02-HU-03-CA-07 (detalle reserva con pre-orden)
  **Objetivo:** Verificar que el detalle de una reserva propia incluye los ítems de pre-orden
  (`preOrdenItems` con `productoNombre`, `cantidad`, `precioUnitario`) y el `preOrdenTotal`.
  **Pre-condición:** Ninguna externa. El pre-request hace login autónomo, crea la reserva con
  pre-orden y captura el `reservaId` resultante en `tmpReservaId`. El afterResponse cancela
  la reserva para evitar acumulación de datos.
  **Resultado esperado:** 200 OK · campos base presentes · `preOrdenItems` array no vacío con
  los campos esperados · `preOrdenTotal` > 0 · variable temporal limpiada al final.
url: "{{baseUrl}}/api/reservas/{{tmpReservaId}}/detalle"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('Pre-request RE-01: login CLIENTE falló', err, res && res.code);
          return;
        }
        const token = res.json().accessToken;
        pm.environment.set('clienteToken', token);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: null,
            preOrden: [{ productoId: 1, cantidad: 2, descripcion: 'Sin cebolla', esMenuEspecial: false, opcionesModificacion: null }]
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaId', r2.json().data.reservaId);
          } else {
            console.warn('Pre-request RE-01: creación de reserva falló', e2, r2 && r2.code, r2 && r2.text());
          }
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('El detalle de reserva incluye los campos base obligatorios', function () {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('reservaId');
        pm.expect(data).to.have.property('fechaHoraLlegada');
        pm.expect(data).to.have.property('numeroPersonas');
        pm.expect(data).to.have.property('estado');
        pm.expect(data).to.have.property('tipo');
      });
      pm.test('La pre-orden contiene ítems con productoNombre, cantidad y precioUnitario', function () {
        const items = pm.response.json().data.preOrdenItems;
        pm.expect(items).to.be.an('array').with.lengthOf.above(0);
        pm.expect(items[0]).to.have.property('productoNombre');
        pm.expect(items[0]).to.have.property('cantidad');
        pm.expect(items[0]).to.have.property('precioUnitario');
      });
      pm.test('preOrdenTotal está presente y es mayor a 0', function () {
        pm.expect(pm.response.json().data.preOrdenTotal).to.be.above(0);
      });

      const reservaId = pm.environment.get('tmpReservaId');
      if (reservaId) {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RE-01: cancelar reserva ' + reservaId + ' falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaId');
    language: text/javascript
order: 1000
