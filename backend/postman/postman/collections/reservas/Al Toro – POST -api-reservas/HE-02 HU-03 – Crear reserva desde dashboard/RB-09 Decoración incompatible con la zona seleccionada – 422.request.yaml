$kind: http-request
name: RB-09 Decoración incompatible con la zona seleccionada – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** Validación compatibilidad decoración-zona
  **Objetivo:** Verificar que el sistema rechaza cuando la decoración tiene una zona asignada fija y se elige una zona diferente.
  **Pre-condición:** `idDecoracionZonaFija`=8 está vinculada a una zona específica; zonaId=1 es una zona diferente.
  **Resultado esperado:** 422 Unprocessable Entity · mensaje sobre incompatibilidad de decoración y zona.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaDecoracion}}",
      "numeroPersonas": 2,
      "zonaId": 1,
      "decoracionId": {{idDecoracionZonaFija}},
      "notas": null,
      "preOrden": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza decoración incompatible con zona con 422', function() {
        pm.response.to.have.status(422);
      });
    language: text/javascript
order: 9000
