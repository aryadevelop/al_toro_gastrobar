$kind: http-request
name: RB-05 Menú especial con más de 10 personas – 201 Created (PENDIENTE)
description: |-
  **Criterio de Aceptación:** Regla menú especial
  **Objetivo:** Verificar que un menú especial con >10 personas crea la reserva como ESPECIAL/PENDIENTE.
  **Pre-condición:** Producto ID 132 (Menú 1, menu_especial=TRUE); fecha 2026-12-19T20:00:00 disponible; 12 personas.
  **Resultado esperado:** 201 Created · `data.estado=PENDIENTE` · `data.tipo=ESPECIAL`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "2026-12-19T20:00:00",
      "numeroPersonas": 12,
      "zonaId": null,
      "decoracionId": null,
      "notas": null,
      "preOrden": [
        {
          "productoId": 132,
          "cantidad": 12,
          "descripcion": null,
          "esMenuEspecial": true,
          "opcionesModificacion": [1]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 201', function() {
        pm.response.to.have.status(201);
      });
      pm.test('La reserva con menú especial queda PENDIENTE y ESPECIAL', function() {
        var data = pm.response.json().data;
        pm.expect(data.estado).to.eql('PENDIENTE');
        pm.expect(data.tipo).to.eql('ESPECIAL');
      });
    language: text/javascript
order: 5000
