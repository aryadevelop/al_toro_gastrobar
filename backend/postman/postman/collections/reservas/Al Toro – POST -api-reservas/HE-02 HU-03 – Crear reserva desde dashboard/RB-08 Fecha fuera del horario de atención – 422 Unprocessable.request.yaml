$kind: http-request
name: RB-08 Fecha fuera del horario de atención – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** Validación horario en creación
  **Objetivo:** Verificar que el sistema rechaza una reserva fuera del horario de atención.
  **Pre-condición:** `fechaFueraHorario` = hora antes de las 17h.
  **Resultado esperado:** 422 Unprocessable Entity · mensaje sobre disponibilidad o fecha no válida.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaFueraHorario}}",
      "numeroPersonas": 2,
      "zonaId": null,
      "decoracionId": null,
      "notas": null,
      "preOrden": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza creación de reserva fuera del horario con 422', function() {
        pm.response.to.have.status(422);
      });
    language: text/javascript
order: 8000
