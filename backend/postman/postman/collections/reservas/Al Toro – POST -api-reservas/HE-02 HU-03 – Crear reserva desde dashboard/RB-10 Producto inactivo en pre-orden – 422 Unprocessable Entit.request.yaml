$kind: http-request
name: RB-10 Producto inactivo en pre-orden – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** Validación estado de producto en pre-orden
  **Objetivo:** Verificar que el sistema rechaza productos en estado INACTIVO en la pre-orden.
  **Pre-condición:** `idProductoInactivo`=138 tiene estado=INACTIVO (insertado en V3__dev_data.sql).
  **Resultado esperado:** 422 Unprocessable Entity · mensaje indica que el producto no está disponible.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "2026-12-22T19:00:00",
      "numeroPersonas": 2,
      "zonaId": null,
      "decoracionId": null,
      "notas": null,
      "preOrden": [
        {
          "productoId": {{idProductoInactivo}},
          "cantidad": 1,
          "descripcion": null,
          "esMenuEspecial": false,
          "opcionesModificacion": null
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza producto inactivo en pre-orden con 422', function() {
        pm.response.to.have.status(422);
      });
      pm.test('El mensaje de error menciona que el producto no está disponible', function() {
        var msg = pm.response.json().message || '';
        pm.expect(msg.toLowerCase()).to.satisfy(function(m) {
          return m.includes('disponible') || m.includes('inactivo');
        });
      });
    language: text/javascript
order: 10000
