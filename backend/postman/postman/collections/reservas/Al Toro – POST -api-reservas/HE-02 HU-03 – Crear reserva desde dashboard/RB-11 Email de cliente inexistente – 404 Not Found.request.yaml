$kind: http-request
description: |-
  **Criterio de Aceptación:** Validación de existencia del cliente
  **Objetivo:** Verificar que el sistema retorna 404 cuando el emailCliente no corresponde a ningún registro.
  **Pre-condición:** El email 'noexiste@altoro.com' no existe en la base de datos.
  **Resultado esperado:** 404 Not Found.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "noexiste@altoro.com",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "zonaId": null,
      "decoracionId": null,
      "notas": null,
      "preOrden": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna 404 para cliente inexistente', function() {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 11000
