$kind: collection
description: |-
  Crea una nueva reserva para el cliente autenticado.

  **Encabezados requeridos:** `Authorization: Bearer {{clienteToken}}` · `Content-Type: application/json`

  **Estructura del body:**
  ```json
  {
    "emailCliente": "{{emailCliente}}",
    "fechaHoraLlegada": "{{fechaLibre}}",
    "numeroPersonas": 2,
    "zonaId": null,
    "decoracionId": null,
    "notas": null,
    "preOrden": null
  }
  ```

  **Reglas de negocio clave:**
  - Si la decoración tiene costo adicional o hay menú especial → `tipo=ESPECIAL`, `estado=PENDIENTE`.
  - Sin decoración con costo ni menú especial → `tipo=BASICA`, `estado=CONFIRMADA`.
  - Menú especial requiere `numeroPersonas > 10`.
  - Solo un ítem de menú especial por reserva.
  - Hora debe estar en [17h, 22h).

  | ID | Escenario | HTTP |
  |----|-----------|------|
  | RB-01 | Reserva básica sin zona ni decoración | 201 |
  | RB-02 | Reserva básica con zona disponible | 201 |
  | RB-03 | Reserva especial con decoración de costo adicional | 201 |
  | RB-04 | Reserva con pre-orden (producto regular) | 201 |
  | RB-05 | Menú especial con >10 personas | 201 |
  | RB-06 | Menú especial con ≤10 personas | 422 |
  | RB-07 | Más de un menú especial en pre-orden | 422 |
  | RB-08 | Fecha fuera del horario de atención | 422 |
  | RB-09 | Decoración incompatible con zona | 422 |
  | RB-10 | Producto inactivo en pre-orden | 422 |
  | RB-11 | Email de cliente inexistente | 404 |
  | RB-12 | Sin token de autenticación | 401 |
order: 2000
