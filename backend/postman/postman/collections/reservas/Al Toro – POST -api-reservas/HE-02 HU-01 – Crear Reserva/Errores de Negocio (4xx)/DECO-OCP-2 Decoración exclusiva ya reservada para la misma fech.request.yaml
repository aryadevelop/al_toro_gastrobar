$kind: http-request
name: DECO-OCP-2 Decoración exclusiva ya reservada para la misma fecha – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que el sistema rechaza una segunda reserva con la misma decoración exclusiva (Velas Románticas, id=1) en la misma fecha, ya que este tipo de decoración solo puede asignarse a una reserva por fecha.
  **Pre-condición:** DECO-OCP-1 debe haberse ejecutado previamente. Las Velas Románticas están reservadas para {{fechaDecoracion}}.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona 'disponibilidad'.
  > **⚠ Dependencia secuencial:** Requiere DECO-OCP-1 ejecutado.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaDecoracion}}",
      "numeroPersonas": 2,
      "decoracionId": 1,
      "zonaId": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Decoración exclusiva ya reservada para la misma fecha', () => pm.response.to.have.status(422));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);

      pm.test('El mensaje de error menciona la disponibilidad de la decoración', () => {
        pm.expect(pm.response.json().message).to.include('disponibilidad');
      });
    language: text/javascript
order: 12000
