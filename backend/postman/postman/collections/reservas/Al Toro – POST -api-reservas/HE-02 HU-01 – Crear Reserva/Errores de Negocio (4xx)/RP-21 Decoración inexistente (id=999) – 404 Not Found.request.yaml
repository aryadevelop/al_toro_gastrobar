$kind: http-request
description: |-
  **Criterio de Aceptación:** RP-21
  **Objetivo:** Verificar que el sistema retorna 404 cuando se solicita una decoración con ID que no existe en la base de datos.
  **Pre-condición:** No debe existir ninguna decoración con id=999.
  **Resultado esperado:** HTTP 404 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "decoracionId": 999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404 – Decoración con id=999 no existe', () => pm.response.to.have.status(404));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 1000
