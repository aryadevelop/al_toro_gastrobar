$kind: http-request
name: CAP-1 Primera reserva en Zona Romántica (5 de 6 lugares) – 201 Created
description: |-
  **Criterio de Aceptación:** CA-03 (precondición)
  **Objetivo:** Crear la primera reserva en la Zona Romántica (cap=6) para {{fechaCapacidad}}, ocupando 5 de los 6 lugares disponibles. Este caso es la precondición obligatoria para CAP-2 y CAP-3.
  **Pre-condición:** Zona id=7 (Romántica, cap=6) sin reservas previas en {{fechaCapacidad}}.
  **Resultado esperado:** HTTP 201. `zonaId=7`.
  > **⚠ Dependencia secuencial:** CAP-2 y CAP-3 deben ejecutarse inmediatamente después en la misma sesión.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaCapacidad}}",
      "numeroPersonas": 5,
      "zonaId": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Primera reserva en Zona Romántica creada (5 personas ocupadas)', () => pm.response.to.have.status(201));

      pm.test('El zonaNombre coincide con Zona Romántica', () => pm.expect(pm.response.json().data.zonaNombre).to.eql('Zona Romántica'));
    language: text/javascript
order: 6000
