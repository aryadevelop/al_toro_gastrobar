$kind: http-request
name: CAP-3 Segunda reserva en el límite exacto de capacidad (5+1=6) – 201 Created
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que el sistema acepta una reserva cuando la suma acumulada alcanza exactamente la capacidad máxima de la zona (5 existentes + 1 nueva = 6 = cap).
  **Pre-condición:** CAP-1 debe haberse ejecutado previamente. La Zona Romántica tiene 5 personas en {{fechaCapacidad}}.
  **Resultado esperado:** HTTP 201 (la reserva cabe exactamente).
  > **⚠ Dependencia secuencial:** Requiere CAP-1 ejecutado. Habilita CAP-4.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaCapacidad}}",
      "numeroPersonas": 1,
      "zonaId": 7
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 – Reserva en límite exacto de capacidad aceptada (5+1=6=cap)', () => pm.response.to.have.status(201));
    language: text/javascript
order: 8000
