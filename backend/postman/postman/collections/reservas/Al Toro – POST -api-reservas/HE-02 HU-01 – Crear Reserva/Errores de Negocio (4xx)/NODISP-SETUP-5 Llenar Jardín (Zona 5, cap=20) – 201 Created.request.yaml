$kind: http-request
description: |-
  **Objetivo:** Reservar toda la capacidad del Jardín (20 personas) para {{fechaTodasOcupadas}}.
  **Pre-condición:** NODISP-SETUP-4 ejecutado. Zona id=5 (Jardín, cap=20) disponible.
  **Resultado esperado:** HTTP 201.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaTodasOcupadas}}",
      "numeroPersonas": 20,
      "zonaId": 5
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 – Jardín (Zona 5) llenado exitosamente', () => pm.response.to.have.status(201));
    language: text/javascript
order: 18000
