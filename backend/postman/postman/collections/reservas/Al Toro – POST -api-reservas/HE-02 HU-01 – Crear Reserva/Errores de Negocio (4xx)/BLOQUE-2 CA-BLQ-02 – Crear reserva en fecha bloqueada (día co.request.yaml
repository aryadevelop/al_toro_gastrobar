$kind: http-request
name: BLOQUE-2 CA-BLQ-02 – Crear reserva en fecha bloqueada (día completo) → 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-BLQ-02
  **Objetivo:** Verificar que el sistema rechaza la creación de una reserva en una fecha bloqueada por el administrador. El mensaje de error debe orientar al cliente.
  **Pre-condición:** V3 ejecutado con el bloqueo del 2026-12-25. `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaBloqueadaDia}}",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Reserva rechazada en fecha bloqueada (Navidad)', () => pm.response.to.have.status(422));

      const body = pm.response.json();
      pm.test('El campo success es false', () => pm.expect(body.success).to.be.false);
      pm.test('El mensaje menciona la disponibilidad', () => {
        pm.expect(body.message.toLowerCase()).to.include('disponibilidad');
      });
    language: text/javascript
order: 23000
