$kind: http-request
name: BLOQUE-4 CA-BLQ-04 – Misma fecha bloqueada pero hora fuera del bloqueo → disponible=true – 200 OK
description: |-
  **Criterio de Aceptación:** CA-BLQ-04
  **Objetivo:** Verificar que el bloqueo por franja horaria NO afecta horas del mismo día que están fuera del rango bloqueado. El 22 de diciembre tiene bloqueada la franja 19:00–21:00, pero las 17:00 del mismo día deben estar disponibles.
  **Pre-condición:** V3 ejecutado con el bloqueo del 2026-12-22 franja 19:00–21:00. `clienteToken` disponible. La variable {{fechaBloqueadaFranjaFuera}} es 2026-12-22T17:00:00.
  **Resultado esperado:** HTTP 200. `data.disponible=true`.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora={{fechaBloqueadaFranjaFuera}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  fechaHora: "{{fechaBloqueadaFranjaFuera}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Consulta procesada correctamente', () => pm.response.to.have.status(200));

      const d = pm.response.json().data;
      pm.test('disponible=true para hora fuera del bloqueo (17:00, bloqueo es 19:00-21:00)', () => pm.expect(d.disponible).to.be.true);
      pm.test('zonas no está vacío cuando la hora es válida y no está bloqueada', () => pm.expect(d.zonas).to.be.an('array').and.not.empty);
    language: text/javascript
order: 25000
