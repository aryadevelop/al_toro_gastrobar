$kind: http-request
description: |-
  **Objetivo:** Reservar toda la capacidad de la Barra (10 personas) para {{fechaTodasOcupadas}}.
  **Pre-condición:** NODISP-SETUP-3 ejecutado. Zona id=4 (Barra, cap=10) disponible.
  **Resultado esperado:** HTTP 201.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaTodasOcupadas}}",
      "numeroPersonas": 10,
      "zonaId": 4
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 – Barra (Zona 4) llenada exitosamente', () => pm.response.to.have.status(201));
    language: text/javascript
order: 17000
