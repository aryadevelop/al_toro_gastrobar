$kind: http-request
name: CAP-5 Reserva en distinta hora del mismo día con zona llena – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que la capacidad acumulada se calcula por día completo, no por franja horaria. La Zona Romántica está llena el 2026-12-16 ({{fechaCapacidad}}); intentar agregar una persona a las 18:00 del mismo día debe fallar porque la suma diaria sigue siendo 6/6.
  **Pre-condición:** CAP-1 y CAP-3 ejecutados. Zona id=7 con 6/6 personas el 2026-12-16.
  **Resultado esperado:** HTTP 422 (capacidad diaria agotada independientemente de la hora).
  > **⚠ Dependencia secuencial:** Requiere CAP-1 y CAP-3 ejecutados. Nota: la fecha `2026-12-16T18:00:00` coincide con el día de {{fechaCapacidad}} y está dentro del horario de atención.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaCapacidadHoraAlternativa}}",
      "numeroPersonas": 1,
      "zonaId": 7
    }
scripts:
  - type: beforeRequest
    code: |-
      // {{fechaCapacidad}} debe tener formato ISO-8601, ej. 2026-12-16T19:00:00.
      // Se extrae la parte de fecha y se asigna hora 18:00 para probar que
      // la capacidad se acumula por día, no por hora.
      const fechaCapacidad = pm.environment.get('fechaCapacidad');
      if (fechaCapacidad) {
          const datePart = fechaCapacidad.split('T')[0];
          pm.environment.set('fechaCapacidadHoraAlternativa', datePart + 'T18:00:00');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // La Zona Romántica (cap=6) quedó llena en fechaCapacidad (CAP-1 + CAP-3).
      // La capacidad se acumula por día, no por hora. Sumar 1 persona a otra hora del mismo día (6+1=7>6) debe fallar.
      pm.test('Status 422 – Capacidad diaria agotada independientemente de la hora de llegada', () => pm.response.to.have.status(422));
    language: text/javascript
order: 10000
