$kind: http-request
name: RP-23 CA-04 – Decoración con zona fija, zona incorrecta (Decoración id=8, Salón id=1) – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-04
  **Objetivo:** Verificar que el sistema rechaza una reserva cuando la zona especificada no coincide con la zona fija asignada a la decoración. La decoración id=8 tiene zona fija Barra (id=4); especificar Salón Principal (id=1) debe resultar en error.
  **Pre-condición:** Decoración id=8 con zona fija id=4. La fecha {{fechaLibre}} disponible.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona 'asignada'.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "decoracionId": {{idDecoracionZonaFija}},
      "zonaId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Zona incorrecta para decoración con zona fija', () => pm.response.to.have.status(422));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);

      pm.test('El mensaje de error menciona la zona asignada de la decoración', () => {
        pm.expect(pm.response.json().message).to.include('asignada');
      });
    language: text/javascript
order: 3000
