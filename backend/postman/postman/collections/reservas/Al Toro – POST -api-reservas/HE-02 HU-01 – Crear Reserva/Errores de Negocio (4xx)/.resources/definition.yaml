$kind: collection
description: |-
  Agrupa los casos en los que el backend debe rechazar la solicitud por incumplimiento de reglas de negocio: entidades no encontradas, incompatibilidad entre zona y decoración, exceso de capacidad o decoración ya reservada para la misma fecha.

  ## Grupos Secuenciales
  Los siguientes subgrupos deben ejecutarse en orden dentro de la misma sesión para que el estado de la base de datos sea coherente:
  - **CAP-1 → CAP-2 → CAP-3 → CAP-4**: ocupan la Zona Romántica (cap=6) en `{{fechaCapacidad}}` y verifican el límite de capacidad.
  - **DECO-OCP-1 → DECO-OCP-2 → DECO-OCP-3**: reservan y luego intentan reservar la misma decoración exclusiva en `{{fechaDecoracion}}`.
  - **NODISP-SETUP-1..7 → NODISP-1 → NODISP-2**: llenan todas las zonas en `{{fechaTodasOcupadas}}` y verifican el comportamiento sin disponibilidad (CA-03).
order: 3000
