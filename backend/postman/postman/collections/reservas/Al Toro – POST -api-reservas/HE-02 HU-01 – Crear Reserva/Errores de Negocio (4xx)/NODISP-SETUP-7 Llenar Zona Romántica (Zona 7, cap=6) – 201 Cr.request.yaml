$kind: http-request
name: NODISP-SETUP-7 Llenar Zona Romántica (Zona 7, cap=6) – 201 Created
description: |-
  **Objetivo:** Reservar toda la capacidad de la Zona Romántica (6 personas) para {{fechaTodasOcupadas}}, completando el llenado de todas las zonas del sistema.
  **Pre-condición:** NODISP-SETUP-6 ejecutado. Zona id=7 (Zona Romántica, cap=6) disponible.
  **Resultado esperado:** HTTP 201. Habilita NODISP-1 y NODISP-2.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaTodasOcupadas}}",
      "numeroPersonas": 6,
      "zonaId": 7
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 – Zona Romántica (Zona 7) llenada exitosamente', () => pm.response.to.have.status(201));
    language: text/javascript
order: 20000
