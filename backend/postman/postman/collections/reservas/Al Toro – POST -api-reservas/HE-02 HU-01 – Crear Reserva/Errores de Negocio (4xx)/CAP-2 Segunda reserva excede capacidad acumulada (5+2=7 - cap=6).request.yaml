$kind: http-request
name: CAP-2 Segunda reserva excede capacidad acumulada (5+2=7 > cap=6) – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que el sistema rechaza la segunda reserva cuando la suma acumulada de personas en la zona supera la capacidad máxima (5 existentes + 2 nuevas = 7 > 6).
  **Pre-condición:** CAP-1 debe haberse ejecutado previamente. La Zona Romántica tiene 5 personas en {{fechaCapacidad}}.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona 'capacidad'.
  > **⚠ Dependencia secuencial:** Requiere CAP-1 ejecutado.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaCapacidad}}",
      "numeroPersonas": 2,
      "zonaId": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Segunda reserva supera la capacidad acumulada de la zona', () => pm.response.to.have.status(422));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);

      pm.test('El mensaje de error menciona la capacidad de la zona', () => {
        pm.expect(pm.response.json().message).to.include('capacidad');
      });
    language: text/javascript
order: 7000
