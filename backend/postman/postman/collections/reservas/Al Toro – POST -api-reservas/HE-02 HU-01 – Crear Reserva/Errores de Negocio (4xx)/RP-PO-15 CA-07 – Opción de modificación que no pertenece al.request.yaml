$kind: http-request
name: RP-PO-15 CA-07 – Opción de modificación que no pertenece al menú seleccionado – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-07
  **Objetivo:** Verificar que el sistema rechaza una opción de modificación no vinculada al producto de menú especial seleccionado. El Menú 1 (id=132) solo acepta opciones BEBIDA (ids 1-4); la opción id=5 (SALSA_PROTEINA_1) es exclusiva de los menús de doble proteína (8a-8d).
  **Pre-condición:** `clienteToken` disponible. El par producto_id=132 + opcion_id=5 no existe en `producto_opcion_modificacion`.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona 'pertenece al menú'.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 11,
      "zonaId": 1,
      "preOrden": [
        {
          "productoId": 132,
          "cantidad": 11,
          "esMenuEspecial": true,
          "opcionesModificacion": [5]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Opción inválida para el menú seleccionado rechazada (CA-07)', () => pm.response.to.have.status(422));

      const body = pm.response.json();
      pm.test('El campo success es false', () => pm.expect(body.success).to.be.false);

      pm.test('El mensaje menciona que la opción no pertenece al menú', () => {
        pm.expect(body.message.toLowerCase()).to.satisfy(m => m.includes('pertenece') || m.includes('menú') || m.includes('opción'), 'El mensaje debe indicar la incompatibilidad');
      });
    language: text/javascript
order: 30000
