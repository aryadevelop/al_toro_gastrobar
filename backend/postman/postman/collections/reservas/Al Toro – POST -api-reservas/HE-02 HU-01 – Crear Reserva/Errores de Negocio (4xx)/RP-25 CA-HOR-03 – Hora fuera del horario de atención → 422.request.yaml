$kind: http-request
name: RP-25 CA-HOR-03 – Hora fuera del horario de atención → 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-HOR-03
  **Objetivo:** Verificar que el sistema rechaza la creación de una reserva cuando la hora de llegada está fuera del horario de atención (5:00 PM a 10:00 PM). El mensaje de error debe mencionar el horario.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona el horario de reservas.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "2026-12-15T10:00:00",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Hora fuera del horario de atención rechazada', () => pm.response.to.have.status(422));

      const body = pm.response.json();
      pm.test('El campo success es false en la respuesta de error', () => pm.expect(body.success).to.be.false);

      pm.test('El mensaje de error menciona el horario de reservas', () => {
        const msg = (body.message || '').toLowerCase();
        pm.expect(msg).to.satisfy(
          m => m.includes('horario') || m.includes('disponibilidad') || m.includes('p.m'),
          'El mensaje debe mencionar el horario de atención'
        );
      });
    language: text/javascript
order: 5000
