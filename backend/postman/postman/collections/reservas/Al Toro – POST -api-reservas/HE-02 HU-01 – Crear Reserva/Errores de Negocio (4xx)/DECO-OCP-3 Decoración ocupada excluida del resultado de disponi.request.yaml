$kind: http-request
name: DECO-OCP-3 Decoración ocupada excluida del resultado de disponibilidad – 200 OK
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que una decoración exclusiva ya reservada para una fecha no aparece en el listado de decoraciones disponibles para esa misma fecha.
  **Pre-condición:** DECO-OCP-1 debe haberse ejecutado previamente. Las Velas Románticas están reservadas para {{fechaDecoracion}}.
  **Resultado esperado:** HTTP 200. La decoración con `decoracionId=1` no aparece en `data.decoraciones`.
  > **⚠ Dependencia secuencial:** Requiere DECO-OCP-1 ejecutado.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora={{fechaDecoracion}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  fechaHora: "{{fechaDecoracion}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Disponibilidad consultada exitosamente', () => pm.response.to.have.status(200));

      const decos = pm.response.json().data.decoraciones;
      const velas = decos.find(d => d.decoracionId === 1);

      pm.test('Las Velas Románticas (id=1) no aparecen en disponibilidad al estar ya reservadas', () => pm.expect(velas).to.be.undefined);
    language: text/javascript
order: 13000
