$kind: http-request
name: NODISP-SETUP-6 Llenar Sala Privada (Zona 6, cap=12) – 201 Created
description: |-
  **Objetivo:** Reservar toda la capacidad de la Sala Privada (12 personas) para {{fechaTodasOcupadas}}.
  **Pre-condición:** NODISP-SETUP-5 ejecutado. Zona id=6 (Sala Privada, cap=12) disponible.
  **Resultado esperado:** HTTP 201.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaTodasOcupadas}}",
      "numeroPersonas": 12,
      "zonaId": 6
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 – Sala Privada (Zona 6) llenada exitosamente', () => pm.response.to.have.status(201));
    language: text/javascript
order: 19000
