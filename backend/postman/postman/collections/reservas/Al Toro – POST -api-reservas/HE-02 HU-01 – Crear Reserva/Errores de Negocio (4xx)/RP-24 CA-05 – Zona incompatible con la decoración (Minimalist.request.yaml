$kind: http-request
name: RP-24 CA-05 – Zona incompatible con la decoración (Minimalista id=5, VIP id=3) – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-05
  **Objetivo:** Verificar que el sistema rechaza una reserva cuando la zona solicitada no es compatible con la decoración seleccionada. La decoración Minimalista Elegante (id=5) es compatible solo con zonas 1 y 2; la zona VIP (id=3) no es válida.
  **Pre-condición:** Decoración id=5 compatible únicamente con zonas 1 y 2. Fecha {{fechaLibre}} disponible.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona 'compatible'.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "decoracionId": 5,
      "zonaId": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Zona incompatible con la decoración seleccionada', () => pm.response.to.have.status(422));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);

      pm.test('El mensaje de error menciona la incompatibilidad entre zona y decoración', () => {
        pm.expect(pm.response.json().message).to.include('compatible');
      });
    language: text/javascript
order: 4000
