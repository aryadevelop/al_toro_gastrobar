$kind: http-request
name: "RP-PO-16 Pre-orden: producto inexistente (id=9999) – 404 Not Found"
description: |-
  **Criterio de Aceptación:** CA-01 (negativo)
  **Objetivo:** Verificar que cuando la pre-orden referencia un producto que no existe en la base de datos, el sistema retorna 404 y la transacción completa se revierte (la reserva no queda guardada).
  **Pre-condición:** `clienteToken` disponible. No existe ningún producto con id=9999.
  **Resultado esperado:** HTTP 404 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3,
      "preOrden": [
        { "productoId": 9999, "cantidad": 2 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404 – Producto id=9999 en pre-orden retorna 404', () => pm.response.to.have.status(404));
      pm.test('El campo success es false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 31000
