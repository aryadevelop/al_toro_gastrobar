$kind: http-request
name: RP-PO-14 CA-05 – Dos ítems con esMenuEspecial=true en la misma reserva – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-05
  **Objetivo:** Verificar que el sistema rechaza la pre-orden cuando contiene más de un ítem con `esMenuEspecial=true`. Solo se permite un menú especial por reserva.
  **Pre-condición:** `clienteToken` disponible. Productos id=132 (Menú 1) e id=133 (Menú 3) activos. 15 personas (supera el umbral de 10).
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que menciona la restricción de un menú especial.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 15,
      "zonaId": 1,
      "preOrden": [
        {
          "productoId": 132,
          "cantidad": 15,
          "esMenuEspecial": true,
          "opcionesModificacion": [1]
        },
        {
          "productoId": 133,
          "cantidad": 15,
          "esMenuEspecial": true,
          "opcionesModificacion": [2]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Dos menús especiales rechazados (CA-05)', () => pm.response.to.have.status(422));

      const body = pm.response.json();
      pm.test('El campo success es false', () => pm.expect(body.success).to.be.false);

      pm.test('El mensaje menciona la restricción de un menú especial por reserva', () => {
        pm.expect(body.message.toLowerCase()).to.satisfy(m => m.includes('un') || m.includes('especial'), 'El mensaje debe indicar la restricción');
      });
    language: text/javascript
order: 29000
