$kind: http-request
name: "NODISP-1 CA-03 – Sin disponibilidad: disponible=false y listas vacías – 200 OK"
description: |-
  **Criterio de Aceptación:** CA-03
  **Objetivo:** Verificar que cuando todas las zonas están llenas para una fecha, el sistema retorna `disponible=false` con listas de zonas y decoraciones vacías, informando correctamente al cliente que no hay disponibilidad.
  **Pre-condición:** NODISP-SETUP-1 a 7 ejecutados. Todas las zonas a capacidad máxima en {{fechaTodasOcupadas}}.
  **Resultado esperado:** HTTP 200. `success=true`, `data.disponible=false`, `data.zonas=[]`, `data.decoraciones=[]`.
  > **⚠ Dependencia secuencial:** Requiere todos los NODISP-SETUP ejecutados.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora={{fechaTodasOcupadas}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  fechaHora: "{{fechaTodasOcupadas}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 – Disponibilidad consultada exitosamente', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      const d = body.data;

      pm.test('El campo success es true', () => pm.expect(body.success).to.be.true);

      pm.test('El campo disponible es false cuando todas las zonas están llenas (CA-03)', () => {
        pm.expect(d.disponible).to.be.false;
      });

      pm.test('El listado de zonas está vacío cuando no hay disponibilidad', () => {
        pm.expect(d.zonas).to.be.an('array').and.be.empty;
      });

      pm.test('El listado de decoraciones está vacío cuando no hay disponibilidad', () => {
        pm.expect(d.decoraciones).to.be.an('array').and.be.empty;
      });
    language: text/javascript
order: 21000
