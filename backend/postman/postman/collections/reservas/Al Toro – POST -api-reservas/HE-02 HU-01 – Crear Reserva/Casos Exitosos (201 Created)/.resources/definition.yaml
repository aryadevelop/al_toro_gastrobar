description: |-
  Agrupa los casos de prueba en los que la reserva debe crearse satisfactoriamente (HTTP 201). La mayoría utiliza `{{fechaLibre}}` para evitar colisiones entre casos. Los grupos secuenciales CAP-* usan `{{fechaCapacidad}}` y los grupos DECO-OCP-* usan `{{fechaDecoracion}}`.

  ## Regla de Clasificación Automática
  | Condición | tipo | estado |
  |-----------|------|--------|
  | Sin decoración con costo Y personas < 10 | BASICA | CONFIRMADA |
  | Decoración con costo O personas ≥ 10 | ESPECIAL | PENDIENTE |
