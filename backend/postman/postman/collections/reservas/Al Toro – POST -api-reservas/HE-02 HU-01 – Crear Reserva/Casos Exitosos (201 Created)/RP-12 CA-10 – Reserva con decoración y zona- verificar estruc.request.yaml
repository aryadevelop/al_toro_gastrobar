$kind: http-request
name: "RP-12 CA-10 – Reserva con decoración y zona: verificar estructura completa del response – 201 Created"
description: |-
  **Criterio de Aceptación:** CA-10
  **Objetivo:** Verificar que la respuesta de una reserva exitosa con decoración y zona incluye todos los campos requeridos: `decoracionId`, `decoracionNombre`, `zonaId`, `zonaNombre`, `clienteNombre`, `notas` y los campos de auditoría. La decoración id=2 (Cumpleaños Premium, costo=0) sin menú especial clasifica como BASICA.
  **Pre-condición:** Decoración id=2 (Cumpleaños Premium) compatible con zona id=3 (VIP). Fecha {{fechaLibre}} disponible.
  **Resultado esperado:** HTTP 201 con estructura completa del response. `tipo=BASICA`, `estado=CONFIRMADA`, `decoracionId=2`, campos de nombre de decoración y zona presentes.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 10,
      "decoracionId": 2,
      "zonaId": 3,
      "notas": "Cumpleaños del equipo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva con decoración creada exitosamente', () => pm.response.to.have.status(201));

      const body = pm.response.json();
      const r = body.data;

      pm.test('El campo success es true', () => pm.expect(body.success).to.be.true);
      pm.test('El campo message está presente y no es vacío', () => pm.expect(body.message).to.be.a('string').and.not.empty);

      pm.test('La respuesta contiene todos los campos obligatorios del response', () => {
        pm.expect(r).to.include.keys([
          'reservaId', 'fechaHoraLlegada', 'numeroPersonas',
          'estado', 'tipo', 'decoracionNombre',
          'zonaNombre', 'clienteId', 'clienteNombre'
        ]);
      });

      pm.test('La clasificación es BASICA (decoración sin costo, sin menú especial)', () => pm.expect(r.tipo).to.eql('BASICA'));
      pm.test('El estado de la reserva básica es CONFIRMADA', () => pm.expect(r.estado).to.eql('CONFIRMADA'));
      pm.test('El decoracionNombre coincide con el solicitado (Cumpleaños Premium)', () => pm.expect(r.decoracionNombre).to.eql('Cumpleaños Premium'));
      pm.test('El campo decoracionNombre está presente y no es vacío', () => pm.expect(r.decoracionNombre).to.be.a('string').and.not.empty);
      pm.test('El campo zonaNombre está presente y no es vacío', () => pm.expect(r.zonaNombre).to.be.a('string').and.not.empty);
      pm.test('El campo clienteNombre está presente y no es vacío', () => pm.expect(r.clienteNombre).to.be.a('string').and.not.empty);
      pm.test('El valor de notas coincide con el enviado en el body', () => pm.expect(r.notas).to.eql('Cumpleaños del equipo'));
    language: text/javascript
order: 12000
