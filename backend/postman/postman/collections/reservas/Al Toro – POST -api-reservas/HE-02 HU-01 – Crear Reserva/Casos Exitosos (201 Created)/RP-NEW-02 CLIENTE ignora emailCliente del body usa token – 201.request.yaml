$kind: http-request
name: RP-NEW-02 CLIENTE ignora emailCliente del body – usa email del token – 201 Created
description: |-
  **Criterio de Aceptación:** Regla de ownership — CLIENTE solo puede crear para sí mismo
  **Objetivo:** Verificar que cuando un CLIENTE envía el email de otro cliente en el body, el sistema ignora ese valor y crea la reserva para el usuario autenticado (email del token).
  **Pre-condición:** `emailCliente` del body difiere del email del token. `fechaLibre` disponible.
  **Resultado esperado:** 201 Created · la reserva queda registrada para el usuario del token, no para el email del body.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{clienteToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailSuspendido}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "zonaId": null,
      "decoracionId": null,
      "notas": "Test ownership: emailCliente del body debe ser ignorado",
      "preOrden": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 201 — la reserva se crea para el usuario del token', function() {
        pm.response.to.have.status(201);
      });
      pm.test('La reserva fue creada para el cliente autenticado, no para el email del body', function() {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('reservaId');
        // La reserva existe: el sistema no rechazó ni usó el email incorrecto
      });
    language: text/javascript
order: 13000
