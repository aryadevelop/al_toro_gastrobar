$kind: http-request
name: "RP-PO-20 Menú especial con opcionesModificacion vacías []: aceptado sin opciones – 201 Created"
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: json
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaPreorden}}",
      "numeroPersonas": 12,
      "zonaId": 1,
      "preOrden": [
        {
          "productoId": 133,
          "cantidad": 12,
          "esMenuEspecial": true,
          "opcionesModificacion": []
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Menú especial con lista de opciones vacía aceptado', () => pm.response.to.have.status(201));
      const postData = pm.response.json().data;
      pm.test('La reserva se clasifica como ESPECIAL', () => pm.expect(postData.tipo).to.eql('ESPECIAL'));
      pm.test('El estado es PENDIENTE', () => pm.expect(postData.estado).to.eql('PENDIENTE'));
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/reservas/' + postData.reservaId + '/detalle',
        method: 'GET',
        header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
      }, function(err, res) {
        const r = res.json().data;
        pm.test('preOrdenItems contiene el menú especial (productoId=133)', () => {
          pm.expect(r.preOrdenItems).to.be.an('array').with.lengthOf(1);
          pm.expect(r.preOrdenItems[0].productoId).to.eql(133);
        });
      });
    language: text/javascript
order: 23000
