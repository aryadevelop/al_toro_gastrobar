$kind: http-request
name: "RP-08 CA-08 – 9 personas: límite inferior al umbral ESPECIAL → tipo BASICA – 201 Created"
description: |-
  **Criterio de Aceptación:** CA-08
  **Objetivo:** Verificar el valor de frontera inferior del umbral de clasificación: 9 personas debe resultar en tipo BASICA (el umbral empieza en 10 inclusive).
  **Pre-condición:** `clienteToken` disponible. Zona id=1 con capacidad en {{fechaLibre}}.
  **Resultado esperado:** HTTP 201. `tipo=BASICA`, `estado=CONFIRMADA`, `numeroPersonas=9`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 9,
      "zonaId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva de 9 personas creada exitosamente', () => pm.response.to.have.status(201));

      const r = pm.response.json().data;

      pm.test('Con 9 personas la clasificación es BASICA (umbral no alcanzado)', () => pm.expect(r.tipo).to.eql('BASICA'));
      pm.test('El estado de la reserva básica de 9 personas es CONFIRMADA', () => pm.expect(r.estado).to.eql('CONFIRMADA'));
      pm.test('El número de personas retornado coincide con el enviado (9)', () => pm.expect(r.numeroPersonas).to.eql(9));
    language: text/javascript
order: 8000
