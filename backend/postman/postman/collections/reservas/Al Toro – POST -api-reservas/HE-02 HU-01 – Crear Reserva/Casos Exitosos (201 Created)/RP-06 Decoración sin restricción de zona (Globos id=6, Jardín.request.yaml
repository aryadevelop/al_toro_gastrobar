$kind: http-request
name: RP-06 Decoración sin restricción de zona (Globos id=6, Jardín id=5) – 201 Created
description: |-
  **Criterio de Aceptación:** CA-06
  **Objetivo:** Verificar que una decoración sin restricción de zona (compatible con todas) puede combinarse con cualquier zona disponible, y que el campo `notas` se almacena y retorna correctamente.
  **Pre-condición:** Decoración id=6 (Globos y Flores) sin restricción. Zona id=5 (Jardín) disponible en {{fechaLibre}}.
  **Resultado esperado:** HTTP 201. `tipo=BASICA`, `decoracionId=6`, `zonaId=5`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 4,
      "decoracionId": 6,
      "zonaId": 5,
      "notas": "Mesa cerca de la fuente"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva con decoración sin restricción creada exitosamente', () => pm.response.to.have.status(201));

      const r = pm.response.json().data;

      pm.test('La reserva con decoración gratuita sin restricción se clasifica como BASICA', () => pm.expect(r.tipo).to.eql('BASICA'));
      pm.test('El decoracionNombre coincide con el solicitado (Globos y Flores)', () => pm.expect(r.decoracionNombre).to.eql('Globos y Flores'));
      pm.test('El zonaNombre coincide con el solicitado (Jardín)', () => pm.expect(r.zonaNombre).to.eql('Jardín'));
    language: text/javascript
order: 6000
