$kind: http-request
name: "RP-PO-03 Pre-orden: ítem con descripción libre (modificación de texto) – 201 Created"
description: |-
  **Criterio de Aceptación:** CA-01 (negativo)
  **Objetivo:** Verificar que el sistema acepta ítems de pre-orden con descripción libre (`descripcion` no nulo), que representa la modificación de texto especificada por el cliente. Estos ítems SÍ cuentan para el cálculo de `preOrdenTotal`.
  **Pre-condición:** `clienteToken` disponible. Producto id=1 (Don Tostón, $16.000) activo. Fecha {{fechaPreorden}} con disponibilidad.
  **Resultado esperado:** HTTP 201. `preOrdenItems[0].descripcion` coincide con el texto enviado. `preOrdenTotal` = 16000 (1×$16.000 Don Tostón).
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaPreorden}}",
      "numeroPersonas": 2,
      "preOrden": [
        { "productoId": 1, "cantidad": 1, "descripcion": "Don Tostón - sin salsa criolla" }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva con ítem de modificación libre creada exitosamente', () => pm.response.to.have.status(201));
      const postData = pm.response.json().data;
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/reservas/' + postData.reservaId + '/detalle',
        method: 'GET',
        header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
      }, function(err, res) {
        const r = res.json().data;
        pm.test('preOrdenItems contiene 1 elemento', () => {
          pm.expect(r.preOrdenItems).to.be.an('array').with.lengthOf(1);
        });
        pm.test('La descripción libre se conserva en el ítem', () => {
          pm.expect(r.preOrdenItems[0].descripcion).to.eql('Don Tostón - sin salsa criolla');
        });
        pm.test('preOrdenTotal es 16000 (1×$16.000 Don Tostón, incluye ítems con descripción)', () => {
          pm.expect(r.preOrdenTotal).to.eql(16000);
        });
      });
    language: text/javascript
order: 15000
