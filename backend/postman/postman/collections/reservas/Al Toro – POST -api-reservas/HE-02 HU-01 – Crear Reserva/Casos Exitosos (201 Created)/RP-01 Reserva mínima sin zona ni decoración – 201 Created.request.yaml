$kind: http-request
description: |-
  **Criterio de Aceptación:** CA-06, CA-11
  **Objetivo:** Verificar que una reserva puede crearse exitosamente sin especificar zona ni decoración, que se clasifica como BASICA y que los campos `zonaId` y `decoracionId` retornan null.
  **Pre-condición:** `clienteToken` disponible. Fecha {{fechaLibre}} con capacidad disponible.
  **Resultado esperado:** HTTP 201. `tipo=BASICA`, `estado=CONFIRMADA`, `zonaId=null`, `decoracionId=null`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva mínima creada exitosamente', () => pm.response.to.have.status(201));

      const r = pm.response.json().data;

      pm.test('La reserva se clasifica como tipo BASICA', () => pm.expect(r.tipo).to.eql('BASICA'));
      pm.test('El estado inicial de la reserva básica es CONFIRMADA', () => pm.expect(r.estado).to.eql('CONFIRMADA'));
      pm.test('El campo zonaNombre es null cuando no se especifica zona', () => pm.expect(r.zonaNombre).to.be.null);
      pm.test('El campo decoracionNombre es null cuando no se especifica decoración', () => pm.expect(r.decoracionNombre).to.be.null);
    language: text/javascript
order: 1000
