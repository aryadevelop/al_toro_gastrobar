$kind: http-request
name: RP-02 Reserva con zona disponible (Salón Principal id=1) – 201 Created
description: |-
  **Criterio de Aceptación:** CA-06, CA-11
  **Objetivo:** Verificar que una reserva se crea exitosamente al especificar una zona disponible, que `zonaId` coincide con el solicitado y que la clasificación es BASICA (sin decoración con costo ni ≥10 personas).
  **Pre-condición:** `clienteToken` disponible. Zona 1 (Salón Principal, cap=60) con capacidad disponible para {{fechaLibre}}.
  **Resultado esperado:** HTTP 201. `tipo=BASICA`, `estado=CONFIRMADA`, `zonaId=1`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 5,
      "zonaId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva con zona creada exitosamente', () => pm.response.to.have.status(201));

      const r = pm.response.json().data;

      pm.test('La reserva se clasifica como tipo BASICA', () => pm.expect(r.tipo).to.eql('BASICA'));
      pm.test('El estado inicial de la reserva básica es CONFIRMADA', () => pm.expect(r.estado).to.eql('CONFIRMADA'));
      pm.test('El zonaNombre coincide con el solicitado (Salón Principal)', () => pm.expect(r.zonaNombre).to.eql('Salón Principal'));
    language: text/javascript
order: 2000
