$kind: http-request
name: "RP-PO-02 Pre-orden: múltiples productos regulares – 201 Created"
description: |-
  **Criterio de Aceptación:** CA-01 (negativo)
  **Objetivo:** Verificar que la pre-orden acepta varios productos regulares en la misma reserva y que `preOrdenItems` los incluye todos.
  **Pre-condición:** `clienteToken` disponible. Productos id=1 (Don Tostón) e id=36 (Hamburguesa Al Toro) activos. Fecha {{fechaPreorden}} con disponibilidad.
  **Resultado esperado:** HTTP 201. `preOrdenItems` con 2 elementos. `preOrdenTotal` = 57000 (2 × $16.000 + 1 × $25.000).
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaPreorden}}",
      "numeroPersonas": 4,
      "preOrden": [
        { "productoId": 1, "cantidad": 2 },
        { "productoId": 36, "cantidad": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva con pre-orden de múltiples productos creada exitosamente', () => pm.response.to.have.status(201));

      const postData = pm.response.json().data;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/reservas/' + postData.reservaId + '/detalle',
        method: 'GET',
        header: { 'Authorization': 'Bearer ' + pm.environment.get('clienteToken') }
      }, function(err, res) {
        const r = res.json().data;
        pm.test('preOrdenItems contiene 2 elementos (un ítem por producto)', () => {
          pm.expect(r.preOrdenItems).to.be.an('array').with.lengthOf(2);
        });
        pm.test('preOrdenTotal es 57000 (2×$16.000 Don Tostón + 1×$25.000 Hamburguesa)', () => {
          pm.expect(r.preOrdenTotal).to.eql(57000);
        });
      });
    language: text/javascript
order: 14000
