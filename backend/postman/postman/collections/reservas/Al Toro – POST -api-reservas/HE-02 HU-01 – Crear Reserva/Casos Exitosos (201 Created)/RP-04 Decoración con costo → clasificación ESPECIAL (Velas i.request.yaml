$kind: http-request
name: RP-04 Decoración con costo → clasificación ESPECIAL (Velas id=1, VIP id=3) – 201 Created
description: |-
  **Criterio de Aceptación:** CA-10
  **Objetivo:** Verificar que una reserva con decoración que tiene costo (Velas Románticas, id=1) es clasificada automáticamente como ESPECIAL con estado PENDIENTE, independientemente del número de personas.
  **Pre-condición:** Decoración id=1 (Velas Románticas, costo=25.000) compatible con zona id=3 (VIP). Fecha {{fechaLibre}} disponible.
  **Resultado esperado:** HTTP 201. `tipo=ESPECIAL`, `estado=PENDIENTE`, `decoracionId=1`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 2,
      "decoracionId": 1,
      "zonaId": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 – Reserva especial por decoración con costo creada exitosamente', () => pm.response.to.have.status(201));

      const r = pm.response.json().data;

      pm.test('La reserva con decoración con costo se clasifica como tipo ESPECIAL', () => pm.expect(r.tipo).to.eql('ESPECIAL'));
      pm.test('El estado inicial de la reserva especial es PENDIENTE', () => pm.expect(r.estado).to.eql('PENDIENTE'));
      pm.test('El decoracionNombre coincide con el solicitado (Velas Románticas)', () => pm.expect(r.decoracionNombre).to.eql('Velas Románticas'));
    language: text/javascript
order: 4000
