$kind: http-request
description: |-
  **Criterio de Aceptación:** RP-18
  **Objetivo:** Verificar que el sistema rechaza reservas con `numeroPersonas` negativo.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": -2
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 – numeroPersonas negativo no es válido', () => pm.response.to.have.status(422));
    language: text/javascript
order: 8000
