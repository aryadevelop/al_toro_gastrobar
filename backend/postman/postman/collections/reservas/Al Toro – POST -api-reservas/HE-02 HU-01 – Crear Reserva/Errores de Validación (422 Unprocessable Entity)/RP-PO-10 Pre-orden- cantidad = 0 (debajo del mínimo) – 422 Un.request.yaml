$kind: http-request
name: "RP-PO-10 Pre-orden: cantidad = 0 (debajo del mínimo) – 422 Unprocessable Entity"
description: |-
  **Criterio de Aceptación:** Validación Bean (@Min=1)
  **Objetivo:** Verificar que el campo `cantidad` rechaza el valor 0, ya que el mínimo permitido es 1. Valor de frontera inferior inválido.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3,
      "preOrden": [
        { "productoId": 1, "cantidad": 0 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – cantidad=0 rechazada (mínimo es 1)', () => pm.response.to.have.status(422));
      pm.test('El campo success es false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 13000
