$kind: http-request
name: RP-15 CA-02 – Campo fechaHoraLlegada ausente – 422 Unprocessable Entity
description: |-
  **Criterio de Aceptación:** CA-02
  **Objetivo:** Verificar que el campo `fechaHoraLlegada` es obligatorio y que su ausencia resulta en un error de validación.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – Campo fechaHoraLlegada ausente', () => pm.response.to.have.status(422));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 5000
