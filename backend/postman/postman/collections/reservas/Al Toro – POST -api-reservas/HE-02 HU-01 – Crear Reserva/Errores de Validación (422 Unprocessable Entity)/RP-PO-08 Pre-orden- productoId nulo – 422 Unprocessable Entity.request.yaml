$kind: http-request
name: "RP-PO-08 Pre-orden: productoId nulo – 422 Unprocessable Entity"
description: |-
  **Criterio de Aceptación:** Validación Bean
  **Objetivo:** Verificar que el campo `productoId` dentro de cada ítem de pre-orden es obligatorio; su ausencia debe generar un error de validación antes de ejecutar lógica de negocio.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3,
      "preOrden": [
        { "productoId": null, "cantidad": 2 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – productoId nulo en pre-orden rechazado por validación', () => pm.response.to.have.status(422));
      pm.test('El campo success es false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 11000
