$kind: http-request
name: "RP-20 CA-02 – fechaHoraLlegada con valor null explícito: mensaje menciona 'fecha' – 422 Unprocessable Entity"
description: |-
  **Criterio de Aceptación:** CA-02
  **Objetivo:** Verificar que enviar `fechaHoraLlegada: null` explícitamente resulta en un error de validación cuyo mensaje hace referencia al campo fecha, orientando al usuario sobre el error específico.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false` y mensaje que incluye la palabra 'fecha' o 'date'.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "fechaHoraLlegada": null,
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – fechaHoraLlegada null explícito rechazado', () => pm.response.to.have.status(422));

      const body = pm.response.json();

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(body.success).to.be.false);

      pm.test('El mensaje de error hace referencia al campo fecha', () => {
        const msg = (body.message || '').toLowerCase();
        pm.expect(msg).to.satisfy(
          m => m.includes('fecha') || m.includes('date'),
          'El mensaje de error debe mencionar la fecha'
        );
      });
    language: text/javascript
order: 10000
