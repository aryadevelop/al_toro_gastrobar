$kind: http-request
description: |-
  **Criterio de Aceptación:** RP-13
  **Objetivo:** Verificar que el endpoint de creación rechaza solicitudes sin token de autorización, independientemente del contenido del body.
  **Pre-condición:** Ninguna sesión activa requerida.
  **Resultado esperado:** HTTP 401.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 – Acceso denegado sin token JWT', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
