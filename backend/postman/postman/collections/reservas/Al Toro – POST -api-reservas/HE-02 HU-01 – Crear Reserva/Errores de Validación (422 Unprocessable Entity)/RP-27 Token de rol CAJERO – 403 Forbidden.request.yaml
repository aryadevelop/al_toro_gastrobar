$kind: http-request
description: |-
  **Criterio de Aceptación:** RP-27
  **Objetivo:** Verificar que el endpoint de creación de reservas deniega el acceso cuando el token corresponde al rol CAJERO. El endpoint solo permite el rol CLIENTE.
  **Pre-condición:** `cajeroToken` disponible.
  **Resultado esperado:** HTTP 403 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{cajeroToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403 – Rol CAJERO no puede crear reservas', () => pm.response.to.have.status(403));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 4000
