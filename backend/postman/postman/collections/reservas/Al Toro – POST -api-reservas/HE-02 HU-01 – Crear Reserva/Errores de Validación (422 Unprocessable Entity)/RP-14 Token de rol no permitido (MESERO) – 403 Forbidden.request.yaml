$kind: http-request
description: |-
  **Criterio de Aceptación:** RP-14
  **Objetivo:** Verificar que el sistema deniega la creación de reservas cuando el token corresponde al rol MESERO. Solo CLIENTE puede crear reservas.
  **Pre-condición:** El token de MESERO debe estar disponible en `{{meseroToken}}`.
  **Resultado esperado:** HTTP 403 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{meseroToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403 – Rol MESERO no puede crear reservas', () => pm.response.to.have.status(403));

      pm.test('El campo success es false en la respuesta de error', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 2000
