$kind: http-request
name: "RP-PO-09 Pre-orden: cantidad nula – 422 Unprocessable Entity"
description: |-
  **Criterio de Aceptación:** Validación Bean
  **Objetivo:** Verificar que el campo `cantidad` dentro de cada ítem de pre-orden es obligatorio; enviarlo como null debe generar un error de validación.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3,
      "preOrden": [
        { "productoId": 1, "cantidad": null }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – cantidad nula en pre-orden rechazado por validación', () => pm.response.to.have.status(422));
      pm.test('El campo success es false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 12000
