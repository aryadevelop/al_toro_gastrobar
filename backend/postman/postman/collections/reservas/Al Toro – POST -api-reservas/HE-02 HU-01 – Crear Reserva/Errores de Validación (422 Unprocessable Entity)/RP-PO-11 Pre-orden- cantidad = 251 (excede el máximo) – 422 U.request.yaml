$kind: http-request
name: "RP-PO-11 Pre-orden: cantidad = 251 (excede el máximo) – 422 Unprocessable Entity"
description: |-
  **Criterio de Aceptación:** Validación Bean (@Max=250)
  **Objetivo:** Verificar que el campo `cantidad` rechaza valores superiores a 250. Valor de frontera superior inválido: 251 debe ser rechazado.
  **Pre-condición:** `clienteToken` disponible.
  **Resultado esperado:** HTTP 422 con `success=false`.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clienteToken}}
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{fechaLibre}}",
      "numeroPersonas": 3,
      "preOrden": [
        { "productoId": 1, "cantidad": 251 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 – cantidad=251 rechazada (máximo es 250)', () => pm.response.to.have.status(422));
      pm.test('El campo success es false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 14000
