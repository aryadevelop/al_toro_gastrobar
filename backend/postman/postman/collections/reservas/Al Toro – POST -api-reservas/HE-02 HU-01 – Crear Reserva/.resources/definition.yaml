description: |-
  ## Descripción
  Endpoint de creación de reservas. Accesible por CLIENTE, CAJERO y ADMIN. El sistema clasifica automáticamente la reserva según las reglas de negocio definidas y retorna la reserva creada con todos sus campos.

  ## Estructura del Cuerpo de la Solicitud
  ```json
  {
    "emailCliente": "cliente@example.com",
    "fechaHoraLlegada": "yyyy-MM-dd'T'HH:mm:ss",
    "numeroPersonas": 1,
    "zonaId": 1,
    "decoracionId": 1,
    "notas": "string"
  }
  ```
  El campo `emailCliente` es obligatorio para CAJERO y ADMIN (indica el cliente para quien se crea la reserva) e ignorado para CLIENTE. Los campos `zonaId`, `decoracionId` y `notas` son opcionales.

  ## Control de Acceso
  | Rol | Puede crear | Requiere emailCliente |
  |-----|-------------|----------------------|
  | CLIENTE | Sí | No (usa su propio email) |
  | CAJERO | Sí | Sí |
  | ADMIN | Sí | Sí |
  | MESERO | No | — |
  | COCINERO | No | — |

  ## Regla de Clasificación Automática
  | Condición | tipo | estado |
  |-----------|------|--------|
  | Sin decoración con costo Y personas < 10 | BASICA | CONFIRMADA |
  | Decoración con costo O personas ≥ 10 | ESPECIAL | PENDIENTE |

  ## Notas sobre Grupos Secuenciales
  Los subgrupos CAP-*, DECO-OCP-* y NODISP-* son secuenciales y deben ejecutarse en orden dentro de la misma sesión para garantizar la coherencia del estado de la base de datos.

  ## Matriz de Casos de Prueba
  | ID | Escenario | HTTP |
  |----|-----------|------|
  | RP-01 | Reserva mínima sin zona ni decoración | 201 |
  | RP-02 | Con zona disponible (Salón Principal) | 201 |
  | RP-03 | Decoración sin costo con zona compatible | 201 |
  | RP-04 | Decoración con costo → ESPECIAL | 201 |
  | RP-05 | CA-08: exactamente 10 personas → ESPECIAL | 201 |
  | RP-06 | Decoración sin restricción de zona | 201 |
  | RP-07 | CA-04: decoración con zona fija, zona correcta | 201 |
  | RP-08 | CA-08: 9 personas → BASICA (valor de frontera) | 201 |
  | RP-09 | CA-08: 11 personas → ESPECIAL (valor de frontera) | 201 |
  | RP-10 | CA-07: Zona Romántica sin extras → BASICA | 201 |
  | RP-11 | CA-11: reserva básica, estructura completa del response | 201 |
  | RP-12 | CA-10: reserva especial, estructura completa del response | 201 |
  | RP-26 | ADMIN crea reserva para un cliente | 201 |
  | RP-27 | CAJERO crea reserva para un cliente | 201 |
  | RP-13 | Sin token JWT | 401 |
  | RP-14 | Token MESERO (rol no permitido) | 403 |
  | RP-15 | CA-02: fechaHoraLlegada ausente | 422 |
  | RP-16 | numeroPersonas ausente | 422 |
  | RP-17 | numeroPersonas = 0 | 422 |
  | RP-18 | numeroPersonas negativo | 422 |
  | RP-19 | Cuerpo vacío | 422 |
  | RP-20 | CA-02: fechaHoraLlegada null explícito | 422 |
  | RP-28 | ADMIN sin emailCliente | 422 |
  | RP-21 | Decoración inexistente (id=999) | 404 |
  | RP-22 | Zona inexistente (id=999) | 404 |
  | RP-23 | CA-04: zona incorrecta para decoración con zona fija | 422 |
  | RP-24 | CA-05: zona incompatible con decoración | 422 |
  | CAP-1..5 | Capacidad acumulada por día (secuencial) | varios |
  | DECO-OCP-1..3 | Decoración exclusiva ya reservada (secuencial) | varios |
  | NODISP-SETUP-1..7 | Setup: llenar todas las zonas (secuencial) | 201 |
  | NODISP-1 | CA-03: disponible=false, listas vacías | 200 |
  | NODISP-2 | CA-03: reserva sin disponibilidad rechazada | 422 |
order: 1000
