$kind: http-request
name: CR-05 ADMIN sin permiso – 403 Forbidden
description: |-
  **Criterio de Aceptación:** Autorización por rol — a diferencia de otros endpoints del
  módulo, `POST /api/reservas` restringe el acceso **solo** al rol `CLIENTE`. El rol `ADMIN`
  debe ser rechazado con 403, aun cuando la lógica del controller esté preparada para que
  ADMIN tome el `emailCliente` del body cuando se amplíe el `@PreAuthorize` en el futuro.
  **Objetivo:** Verificar que un ADMIN autenticado correctamente NO puede crear reservas hoy.
  **Pre-condición:** `accessToken` (ADMIN) disponible (lo gestiona el pre-request de la colección).
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/reservas"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailCliente": "{{emailCliente}}",
      "fechaHoraLlegada": "{{tmpFechaLibre}}",
      "numeroPersonas": 2
    }
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      pm.environment.set('tmpFechaLibre',
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 403 al rol ADMIN', function () {
        pm.response.to.have.status(403);
      });
      pm.environment.unset('tmpFechaLibre');
    language: text/javascript
order: 5000
