$kind: http-request
name: MD-02 MESERO consulta reserva básica sin pre-orden – 200 OK
description: |-
  **Criterio de Aceptación:** CA-05 — el detalle funciona con reservas básicas sin pre-orden.
  **Objetivo:** Verificar que un MESERO obtiene el detalle de una reserva BASICA que no tiene pre-orden.
  **Pre-condición:** El pre-request hace login autónomo como MESERO y crea una reserva básica.
  **Resultado esperado:** 200 OK · detalle contiene clienteTelefono · preOrdenItems es array vacío.
url: "{{baseUrl}}/api/reservas/mesero/{{tmpReservaIdMD02}}/detalle"
method: GET
headers:
  Authorization: Bearer {{meseroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(18, 0, 0, 0);
      const fechaHora = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00:00`;

      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) {
          console.warn('MD-02: login CLIENTE falló', err, res && res.code);
          return;
        }
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            emailCliente: pm.environment.get('emailCliente'),
            fechaHoraLlegada: fechaHora,
            numeroPersonas: 2,
            zonaId: null, decoracionId: null, notas: 'Test MD-02', preOrden: null
          })}
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code === 201) {
            pm.environment.set('tmpReservaIdMD02', r2.json().data.reservaId);
          } else {
            console.warn('MD-02: creación de reserva falló', e2, r2 && r2.code);
          }

          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailMesero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('meseroToken', r3.json().accessToken);
            } else {
              console.warn('MD-02: login MESERO falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo success es true', function () {
        pm.expect(body.success).to.be.true;
      });

      pm.test('El detalle contiene clienteTelefono', function () {
        pm.expect(body.data.clienteTelefono).to.exist;
      });

      pm.test('El tipo de reserva es BASICA', function () {
        pm.expect(body.data.tipo).to.equal('BASICA');
      });

      pm.test('El estado es CONFIRMADA', function () {
        pm.expect(body.data.estado).to.equal('CONFIRMADA');
      });

      pm.test('preOrdenItems no está presente o es vacío (reserva BASICA sin pre-orden)', function () {
        if (body.data.preOrdenItems !== undefined) {
          pm.expect(body.data.preOrdenItems).to.be.an('array').that.is.empty;
        } else {
          pm.expect(body.data.preOrdenItems).to.be.undefined;
        }
      });

      const reservaId = pm.environment.get('tmpReservaIdMD02');
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (e, r) {
        if (!e && r && r.code === 200) {
          const clienteToken = r.json().accessToken;
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
            method: 'PATCH',
            header: { 'Authorization': 'Bearer ' + clienteToken }
          }, function (e2, r2) {
            if (!e2 && r2 && r2.code !== 200) {
              console.warn('Cleanup MD-02: cancelar reserva falló', r2 && r2.code);
            }
          });
        }
      });

      pm.environment.unset('tmpReservaIdMD02');
    language: text/javascript
order: 2010
