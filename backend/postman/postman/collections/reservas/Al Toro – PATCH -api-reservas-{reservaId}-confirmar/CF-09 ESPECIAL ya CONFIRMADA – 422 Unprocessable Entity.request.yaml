$kind: http-request
name: CF-09 ESPECIAL ya CONFIRMADA – 422 Unprocessable Entity
description: |
  Una reserva ESPECIAL que ya fue CONFIRMADA no puede confirmarse de nuevo.
  El beforeRequest crea una ESPECIAL PENDIENTE, la confirma primero, y luego
  intenta confirmarla una segunda vez.
  Resultado esperado: 422 Unprocessable Entity.
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdCF09}}/confirmar"
method: PATCH
headers:
  Authorization: Bearer {{cajeroToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fecha = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fecha,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('CF-09: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          const reservaId = r2.json().data.reservaId;
          pm.environment.set('tmpReservaIdCF09', reservaId);

          // Paso 2: CAJERO obtiene token y confirma la reserva por primera vez
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (e3 || !r3 || r3.code !== 200) {
              console.warn('CF-09: login CAJERO falló', e3, r3 && r3.code);
              return;
            }
            const cajeroToken = r3.json().accessToken;
            pm.environment.set('cajeroToken', cajeroToken);

            // Primera confirmación: debe ser 200
            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/confirmar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + cajeroToken }
            }, function (e4, r4) {
              if (!e4 && r4 && r4.code !== 200) {
                console.warn('CF-09: primera confirmación falló con', r4.code);
              }
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('ESPECIAL ya CONFIRMADA no puede confirmarse de nuevo → 422', function () {
        pm.response.to.have.status(422);
      });

      // Cleanup: CAJERO cancela la reserva confirmada
      const reservaId = pm.environment.get('tmpReservaIdCF09');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('cajeroToken') }
        }, function (e2, r2) {
          if (!e2 && r2 && r2.code !== 200) {
            console.warn('Cleanup CF-09: cancelar reserva falló', r2 && r2.code);
          }
        });
      }
      pm.environment.unset('tmpReservaIdCF09');
    language: text/javascript
order: 9000
