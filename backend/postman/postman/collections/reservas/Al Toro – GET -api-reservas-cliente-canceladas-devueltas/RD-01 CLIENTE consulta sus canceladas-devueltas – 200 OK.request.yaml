$kind: http-request
name: RD-01 CLIENTE consulta sus propias reservas canceladas o devueltas – 200 OK
description: |-
  **Criterio de Aceptación:** Historial terminal — lista de reservas `CANCELADA` o `DEVUELTA`
  del cliente autenticado, ordenadas descendentemente por fecha.
  **Objetivo:** Verificar que el endpoint retorna 200 y que todos los elementos cumplen el
  contrato del DTO: solo estados `CANCELADA`/`DEVUELTA`, fecha de llegada no posterior a
  ahora, y orden descendente.
  **Pre-condición:** El seed `V3__dev_data.sql` garantiza que `emailCliente`
  (andres.morales, cliente_id=13) tiene la reserva 16 en estado `DEVUELTA`, por lo que la
  lista no estará vacía. No hay endpoint de cancelación en la API, así que esta dependencia
  de *seed* es inevitable (ver notas de la carpeta).
  **Resultado esperado:** 200 OK · `data` es un array no vacío · cada elemento tiene los
  campos obligatorios · orden descendente por `fechaHoraLlegada`.
url: "{{baseUrl}}/api/reservas/cliente/canceladas-devueltas?emailCliente={{emailCliente}}"
method: GET
headers:
  Authorization: Bearer {{clienteToken}}
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema retorna HTTP 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();
      pm.test('El campo success es true', function () {
        pm.expect(body.success).to.be.true;
      });
      pm.test('El campo data es un array', function () {
        pm.expect(body.data).to.be.an('array');
      });

      const lista = body.data;
      pm.test('La lista no está vacía (hay al menos una reserva terminal del seed)', function () {
        pm.expect(lista.length).to.be.above(0);
      });

      pm.test('Cada reserva contiene los campos obligatorios del dashboard', function () {
        lista.forEach(r => {
          pm.expect(r).to.include.keys(['reservaId', 'fechaHoraLlegada', 'numeroPersonas', 'estado', 'tipo']);
        });
      });

      pm.test('Solo hay reservas con estado CANCELADA o DEVUELTA', function () {
        lista.forEach(r => {
          pm.expect(['CANCELADA', 'DEVUELTA']).to.include(r.estado);
        });
      });

      pm.test('La lista está ordenada descendentemente por fechaHoraLlegada', function () {
        for (let i = 1; i < lista.length; i++) {
          pm.expect(new Date(lista[i].fechaHoraLlegada) <= new Date(lista[i-1].fechaHoraLlegada)).to.be.true;
        }
      });
    language: text/javascript
order: 1000
