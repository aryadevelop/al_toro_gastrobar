$kind: http-request
name: AB-14 Anticipo sobre reserva NO CONFIRMADA – 409 Conflict
description: |
  Un anticipo solo puede registrarse sobre reservas CONFIRMADAS.
  El beforeRequest crea una reserva ESPECIAL PENDIENTE (sin confirmar).
  Resultado esperado: 409 Conflict, code = NEG-002.
  Cleanup en afterResponse: cliente cancela la reserva PENDIENTE.
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdAB14}}/abonos"
method: POST
headers:
  Authorization: Bearer {{cajeroToken}}
  Content-Type: application/json
body:
  type: json
  content: "{{tmpAbonoBodyAB14}}"
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaReserva = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      const now = new Date();
      const fechaAbono = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
        + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

      pm.environment.set('tmpAbonoBodyAB14', JSON.stringify({
        tipo: 'ANTICIPO',
        monto: 50000,
        metodo: 'EFECTIVO',
        fechaHora: fechaAbono
      }));

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE (sin confirmar)
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;
        pm.environment.set('tmpClienteTokenAB14', clienteToken);

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fechaReserva,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('AB-14: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          pm.environment.set('tmpReservaIdAB14', r2.json().data.reservaId);

          // Paso 2: CAJERO obtiene su token (no confirma — reserva queda PENDIENTE)
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (!e3 && r3 && r3.code === 200) {
              pm.environment.set('cajeroToken', r3.json().accessToken);
            } else {
              console.warn('AB-14: login CAJERO falló', e3, r3 && r3.code);
            }
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Anticipo sobre reserva NO CONFIRMADA → 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('code = NEG-002', function () {
        pm.expect(pm.response.json().code).to.equal('NEG-002');
      });

      // Cleanup: cliente cancela la reserva PENDIENTE
      const reservaId = pm.environment.get('tmpReservaIdAB14');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('tmpClienteTokenAB14') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup AB-14: cancelar reserva falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaIdAB14');
      pm.environment.unset('tmpClienteTokenAB14');
      pm.environment.unset('tmpAbonoBodyAB14');
    language: text/javascript
order: 14000
