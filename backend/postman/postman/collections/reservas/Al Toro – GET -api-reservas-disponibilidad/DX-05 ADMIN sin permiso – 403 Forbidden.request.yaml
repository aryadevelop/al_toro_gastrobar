$kind: http-request
name: DX-05 ADMIN sin permiso – 403 Forbidden
description: |-
  **Criterio de Aceptación:** Autorización por rol — a diferencia de otros endpoints del
  módulo, `/disponibilidad` restringe el acceso **solo** al rol `CLIENTE`. El rol `ADMIN`
  debe ser rechazado con 403.
  **Objetivo:** Verificar que un ADMIN autenticado correctamente NO puede consultar la
  disponibilidad (el endpoint está diseñado para el flujo de reserva del cliente final).
  **Pre-condición:** `accessToken` (ADMIN) disponible (lo gestiona el pre-request de la colección).
  **Resultado esperado:** 403 Forbidden.
url: "{{baseUrl}}/api/reservas/disponibilidad?fechaHora=2026-12-15T19:00:00"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  fechaHora: "2026-12-15T19:00:00"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 403 al rol ADMIN', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 5000
