$kind: http-request
name: RP-06 ADMIN consulta resumen pago – 200 OK
description: |
  ADMIN consulta el resumen de pago de una reserva ESPECIAL CONFIRMADA.
  El beforeRequest: (1) cliente crea reserva ESPECIAL, (2) CAJERO confirma,
  (3) ADMIN obtiene token para el GET.
  Resultado esperado: 200, data contiene todos los campos del ResumenPagoResponse.
  Cleanup en afterResponse: ADMIN cancela la reserva.
url: "{{baseUrl}}/api/reservas/{{tmpReservaIdRP06}}/resumen-pago"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: beforeRequest
    code: |-
      const pad = n => String(n).padStart(2, '0');
      const d = new Date();
      d.setFullYear(d.getFullYear() + 2 + Math.floor(Math.random() * 3));
      d.setMonth(Math.floor(Math.random() * 12));
      d.setDate(1 + Math.floor(Math.random() * 28));
      d.setHours(17 + Math.floor(Math.random() * 5), 0, 0, 0);
      const fechaReserva = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':00:00';

      // Paso 1: cliente crea reserva ESPECIAL PENDIENTE
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCliente'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (err || !res || res.code !== 200) return;
        const clienteToken = res.json().accessToken;

        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas',
          method: 'POST',
          header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + clienteToken },
          body: { mode: 'raw', raw: JSON.stringify({
            fechaHoraLlegada: fechaReserva,
            numeroPersonas: 2,
            decoracionId: 1,
            zonaId: 2
          })}
        }, function (e2, r2) {
          if (e2 || !r2 || r2.code !== 201) {
            console.warn('RP-06: creación de reserva falló', e2, r2 && r2.code);
            return;
          }
          pm.environment.set('tmpReservaIdRP06', r2.json().data.reservaId);

          // Paso 2: CAJERO confirma la reserva
          pm.sendRequest({
            url: pm.environment.get('baseUrl') + '/api/auth/login',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: { mode: 'raw', raw: JSON.stringify({
              email: pm.environment.get('emailCajero'),
              password: pm.environment.get('passwordValida'),
              forceSessionOverride: true
            })}
          }, function (e3, r3) {
            if (e3 || !r3 || r3.code !== 200) {
              console.warn('RP-06: login CAJERO para confirmar falló', e3, r3 && r3.code);
              return;
            }
            const cajeroToken = r3.json().accessToken;

            pm.sendRequest({
              url: pm.environment.get('baseUrl') + '/api/reservas/' + r2.json().data.reservaId + '/confirmar',
              method: 'PATCH',
              header: { 'Authorization': 'Bearer ' + cajeroToken }
            }, function (e4, r4) {
              if (!e4 && r4 && r4.code !== 200) {
                console.warn('RP-06: confirmar reserva falló', r4 && r4.code);
              }

              // Paso 3: ADMIN obtiene su token
              pm.sendRequest({
                url: pm.environment.get('baseUrl') + '/api/auth/login',
                method: 'POST',
                header: { 'Content-Type': 'application/json' },
                body: { mode: 'raw', raw: JSON.stringify({
                  email: pm.environment.get('emailAdmin'),
                  password: pm.environment.get('passwordValida'),
                  forceSessionOverride: true
                })}
              }, function (e5, r5) {
                if (!e5 && r5 && r5.code === 200) {
                  pm.environment.set('adminToken', r5.json().accessToken);
                } else {
                  console.warn('RP-06: login ADMIN falló', e5, r5 && r5.code);
                }
              });
            });
          });
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('RP-06: ADMIN consulta resumen pago → 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('RP-06: data.reservaId coincide', function () {
        pm.expect(pm.response.json().data.reservaId)
          .to.eql(parseInt(pm.environment.get('tmpReservaIdRP06')));
      });
      pm.test('RP-06: data contiene campos de resumen pago', function () {
        const data = pm.response.json().data;
        pm.expect(data.clienteNombre).to.be.a('string').and.not.empty;
        pm.expect(data.totalReserva).to.be.a('number');
        pm.expect(data.totalAnticipado).to.be.a('number');
        pm.expect(data.totalDevuelto).to.be.a('number');
        pm.expect(data.netoAbonado).to.be.a('number');
        // Reserva CONFIRMADA: pendientePorAbonar presente, pendientePorDevolver ausente
        pm.expect(data.pendientePorAbonar).to.be.a('number');
        pm.expect(data).to.not.have.property('pendientePorDevolver');
      });

      // Cleanup: ADMIN cancela la reserva
      const reservaId = pm.environment.get('tmpReservaIdRP06');
      if (reservaId && reservaId !== 'undefined') {
        pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/api/reservas/' + reservaId + '/cancelar',
          method: 'PATCH',
          header: { 'Authorization': 'Bearer ' + pm.environment.get('adminToken') }
        }, function (e, r) {
          if (!e && r && r.code !== 200) {
            console.warn('Cleanup RP-06: cancelar reserva falló', r && r.code);
          }
        });
      }
      pm.environment.unset('tmpReservaIdRP06');
    language: text/javascript
order: 6000
