$kind: http-request
name: RF-05 Sin token JWT – 401 Unauthorized
description: |-
  **Criterio de Aceptación:** Control de acceso — no se permite el consumo sin autenticación.
  **Objetivo:** Verificar que el endpoint rechaza peticiones sin header `Authorization` con 401.
  **Pre-condición:** Ninguna.
  **Resultado esperado:** 401 Unauthorized.
url: "{{baseUrl}}/api/reservas/cliente/futuras?emailCliente={{emailCliente}}"
method: GET
queryParams:
  emailCliente: "{{emailCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El sistema rechaza con 401 la petición sin token', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 5000
