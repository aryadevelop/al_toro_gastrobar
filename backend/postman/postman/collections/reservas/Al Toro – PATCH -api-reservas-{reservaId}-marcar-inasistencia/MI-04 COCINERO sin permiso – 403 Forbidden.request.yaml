$kind: http-request
name: MI-04 COCINERO sin permiso – 403 Forbidden
url: "{{baseUrl}}/api/reservas/1/marcar-inasistencia"
method: PATCH
headers:
  Authorization: Bearer {{cocineroToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.environment.get('baseUrl') + '/api/auth/login',
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.environment.get('emailCocinero'),
          password: pm.environment.get('passwordValida'),
          forceSessionOverride: true
        })}
      }, function (err, res) {
        if (!err && res && res.code === 200) {
          pm.environment.set('cocineroToken', res.json().accessToken);
        } else {
          console.warn('MI-04: login COCINERO falló', err, res && res.code);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('COCINERO no puede marcar inasistencia → 403', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
