spring:

  # Base de datos: H2 en archivo local
  datasource:
    url: jdbc:h2:file:./data/altoro_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Crea/actualiza tablas automaticamente en dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Consola web de H2: habilitada solo en desarrollo
  h2:
    console:
      enabled: true
      path: /h2-console

  # RabbitMQ local
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Correo: Mailtrap captura los emails sin enviarlos realmente
  mail:
    host: smtp.mailtrap.io
    port: 587
    username: tu_usuario_mailtrap
    password: tu_password_mailtrap

# JWT: secreto de desarrollo
jwt:
  secret: altoro-gastrobar-super-secret-key-dev-only-change-in-prod
  expiration: 86400000  # 24 horas en milisegundos

logging:
  level:
    root: INFO
    co.edu.unicauca: DEBUG
    org.springframework.security: DEBUG
    org.springframework.amqp: DEBUG
