spring:

  # Dev carga el schema/catálogo base MÁS los datos de desarrollo (usuarios de prueba)
  flyway:
    locations: classpath:db/migration,classpath:db/migration-dev

  # PostgreSQL via Docker; defaults para correr la app localmente sin Docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/altoro_db}
    username: ${DB_USERNAME:altoro}
    password: ${DB_PASSWORD:altoro123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:dummy}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.starttls.protocols: TLSv1.2
      mail.smtp.ssl.checkserveridentity: false
      mail.smtp.ssl.trust: "*"

management:
  health:
    mail:
      enabled: false  # credenciales Mailtrap son placeholder en dev; no tiene sentido verificarlas

# Secret fijo para desarrollo; en producción se inyecta desde la variable de entorno JWT_SECRET
jwt:
  secret: ${JWT_SECRET:altoro-dev-only-secret-not-for-prod}

# Orígenes permitidos en CORS; por defecto el frontend Angular en local
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}

logging:
  level:
    root: INFO
    co.edu.unicauca: DEBUG
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG
    javax.mail: DEBUG
    com.sun.mail: DEBUG
