spring:
  application:
    name: Al-Toro-Gastro-Bar

  # Perfil por defecto al correr localmente; Docker lo sobreescribe con SPRING_PROFILES_ACTIVE
  profiles:
    active: dev

  # Fechas en lugar de timestamps; zona horaria Colombia
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota

  # Limite de tamano para subida de archivos
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Driver y dialecto PostgreSQL
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET client_encoding = 'UTF8'; SET search_path TO restaurante, public"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false   # Evita lazy loading fuera de transaccion
    properties:
      hibernate:
        "[default_schema]": restaurante   # Todas las entidades apuntan al schema restaurante

  # Flyway: ejecuta las migraciones SQL automaticamente al arrancar
  flyway:
    enabled: true
    schemas: restaurante            # Crea el schema si no existe y lo gestiona
    default-schema: restaurante
    locations: classpath:db/migration

  # Propiedades SMTP comunes, host y credenciales las define cada perfil
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  # En dev se expone el mensaje de error; prod lo silencia (ver application-prod.yml)
  error:
    include-message: always
    include-stacktrace: on_param

# Actuator: dev expone health/info/metrics; prod solo health (ver application-prod.yml)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# Swagger habilitado por defecto; prod lo deshabilita (ver application-prod.yml)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Expiracion JWT comun: 30 minutos para access token; el secret lo define cada perfil
jwt:
  expiration: 1800000
  refresh-expiration: 604800000
