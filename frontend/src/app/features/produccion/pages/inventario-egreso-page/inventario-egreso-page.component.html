<section class="page-grid">
  <app-page-header title="Ajuste Manual de Inventario" subtitle="Registrar ingresos o egresos por producción o compras"></app-page-header>

  <article class="card p-4" style="max-width: 800px; margin: 0 auto;">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      
      <!-- Búsqueda con Autocompletado -->
      <div class="form-group mb-4 position-relative">
        <label class="form-label fw-bold">Buscar producto o insumo *</label>
        <div class="input-group">
          <span class="input-group-text">🔍</span>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            formControlName="search"
            placeholder="Escribe el nombre para buscar..."
            (input)="onSearchChange($event)"
            autocomplete="off"
          >
          <span *ngIf="isSearching" class="input-group-text">
            <span class="spinner-border spinner-border-sm" role="status"></span>
          </span>
        </div>

        <!-- Autocomplete Dropdown -->
        <ul *ngIf="showDropdown" class="list-group position-absolute w-100 mt-1 shadow" style="z-index: 1000; max-height: 250px; overflow-y: auto;">
          <button 
            type="button" 
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            *ngFor="let item of searchResults"
            (click)="seleccionarItem(item)"
          >
            <div>
              <span class="fw-bold">{{ item.nombre }}</span>
              <span class="badge bg-secondary ms-2">{{ item.tipo }}</span>
            </div>
            <span class="text-muted small">Stock: {{ item.stockActual }} {{ item.unidad }}</span>
          </button>
        </ul>
      </div>

      <!-- Datos del Item Seleccionado -->
      <div *ngIf="form.get('elementoId')?.value" class="alert alert-info d-flex justify-content-between align-items-center mb-4">
        <div>
          <h5 class="mb-0">{{ form.get('selectedItemName')?.value }}</h5>
          <small>Stock actual: <strong>{{ form.get('stockActual')?.value }} {{ form.get('unidad')?.value }}</strong></small>
        </div>
        <span class="badge bg-primary">{{ form.get('tipoElemento')?.value }}</span>
      </div>

      <div class="row">
        <!-- Tipo Movimiento -->
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Tipo de movimiento *</label>
          <select class="form-select" formControlName="tipoMovimiento">
            <option value="EGRESO">Egreso (Salida)</option>
            <option value="INGRESO">Ingreso (Entrada)</option>
          </select>
        </div>

        <!-- Cantidad -->
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Cantidad a modificar *</label>
          <div class="input-group">
            <input type="number" class="form-control" formControlName="cantidad" min="1" placeholder="Ej. 5">
            <span class="input-group-text">{{ form.get('unidad')?.value || 'und' }}</span>
          </div>
        </div>
      </div>

      <!-- Errores de Validación -->
      <div *ngIf="submitErrorMsg" class="alert alert-danger py-2 mb-3">
        ❌ {{ submitErrorMsg }}
      </div>
      <div *ngIf="stockErrorMsg" class="alert alert-danger py-2 mb-3">
        ⚠️ {{ stockErrorMsg }}
      </div>

      <!-- Datos Adicionales -->
      <h5 class="mt-3 mb-3 border-bottom pb-2">Información de trazabilidad (Opcional)</h5>
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Proveedor</label>
          <input type="text" class="form-control" formControlName="proveedor" placeholder="Nombre de quien provee">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Número de factura</label>
          <input type="text" class="form-control" formControlName="numeroFactura" placeholder="Ej. FAC-1234">
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="form-label">Observaciones</label>
        <textarea class="form-control" rows="3" formControlName="observaciones" placeholder="Razón del ajuste, avería, caducidad, etc..."></textarea>
      </div>

      <!-- Acciones -->
      <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary px-4" (click)="cancelar()" [disabled]="isSubmitting">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Guardar Ajuste
        </button>
      </div>

    </form>
  </article>
</section>
